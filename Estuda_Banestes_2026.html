\"><semantics><mrow><mi>μ<\/mi><mo>,<\/mo><mi>σ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\mu,\\sigma<\/annotation><\/semantics><\/math>),\nestatística caracteriza amostra\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mo>,<\/mo><mi>s<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\bar x,s<\/annotation><\/semantics><\/math>).\nVariáveis qualitativas nominais são categorias sem ordem (tipo de\nconta), ordinais possuem ordem (nível de satisfação); quantitativas\ndiscretas são contagens (número de transações), contínuas são medidas\n(tempo de atendimento). Dado ausente não é automaticamente zero.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Classificação<\/strong><\/p>\n<p>Uma agência tem 3.000 clientes e consulta 150 sobre satisfação (ruim,\nregular, boa, ótima) e número de visitas mensais. População: 3.000;\namostra: 150. Satisfação é qualitativa ordinal; visitas é quantitativa\ndiscreta.<\/p>\n<\/div>\n", "id": "estatistica-01", "number": 1, "examples": 1, "exercises": 0, "search": "Estatística descritiva organiza, resume e representa dados; inferencial utiliza amostras para estimar propriedades populacionais sob incerteza. População é conjunto de unidades de interesse; amostra é subconjunto observado; censo observa toda a população definida. Parâmetro caracteriza população ( μ , σ \\mu,\\sigma ), estatística caracteriza amostra ( x ‾ , s \\bar x,s ). Variáveis qualitativas nominais são categorias sem ordem (tipo de conta), ordinais possuem ordem (nível de satisfação); quantitativas discretas são contagens (número de transações), contínuas são medidas (tempo de atendimento). Dado ausente não é automaticamente zero. Exemplo resolvido · Classificação Uma agência tem 3.000 clientes e consulta 150 sobre satisfação (ruim, regular, boa, ótima) e número de visitas mensais. População: 3.000; amostra: 150. Satisfação é qualitativa ordinal; visitas é quantitativa discreta."}, {"title": "Técnicas de amostragem", "html": "<p>Na aleatória simples, cada amostra de mesmo tamanho tem igual\nprobabilidade de seleção. Na sistemática, seleciona-se a cada\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>k<\/mi><annotation encoding=\"application/x-tex\">k<\/annotation><\/semantics><\/math>\nunidades após início aleatório; cuidado com periodicidade da lista.\nEstratificada divide a população em grupos relativamente homogêneos e\namostra cada estrato; por conglomerados seleciona grupos (por exemplo,\nagências) e observa unidades dentro deles conforme desenho. Conveniência\nseleciona quem está acessível; não é probabilística e pode gerar viés.\nErro amostral resulta da variabilidade da seleção; viés decorre de\ndistorção sistemática e não desaparece simplesmente aumentando a\namostra.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Amostra estratificada proporcional<\/strong><\/p>\n<p>Uma população de 2.000 clientes tem 1.200 digitais e 800 presenciais.\nDeseja-se amostra de 100 com representação proporcional. Digital:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100<\/mn><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1200<\/mn><mi>/<\/mi><mn>2000<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>60<\/mn><\/mrow><annotation encoding=\"application/x-tex\">100(1200/2000)=60<\/annotation><\/semantics><\/math>;\npresencial: 40. Faça seleção aleatória dentro de cada estrato.<\/p>\n<\/div>\n", "id": "estatistica-02", "number": 2, "examples": 1, "exercises": 0, "search": "Na aleatória simples, cada amostra de mesmo tamanho tem igual probabilidade de seleção. Na sistemática, seleciona-se a cada k k unidades após início aleatório; cuidado com periodicidade da lista. Estratificada divide a população em grupos relativamente homogêneos e amostra cada estrato; por conglomerados seleciona grupos (por exemplo, agências) e observa unidades dentro deles conforme desenho. Conveniência seleciona quem está acessível; não é probabilística e pode gerar viés. Erro amostral resulta da variabilidade da seleção; viés decorre de distorção sistemática e não desaparece simplesmente aumentando a amostra. Exemplo resolvido · Amostra estratificada proporcional Uma população de 2.000 clientes tem 1.200 digitais e 800 presenciais. Deseja-se amostra de 100 com representação proporcional. Digital: 100 ( 1200 / 2000 ) = 60 100(1200/2000)=60 ; presencial: 40. Faça seleção aleatória dentro de cada estrato."}, {"title": "Distribuição de frequências e representação", "html": "<p>Frequência absoluta\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>f<\/mi><mi>i<\/mi><\/msub><annotation encoding=\"application/x-tex\">f_i<\/annotation><\/semantics><\/math>\né contagem; relativa\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>h<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><msub><mi>f<\/mi><mi>i<\/mi><\/msub><mi>/<\/mi><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">h_i=f_i/n<\/annotation><\/semantics><\/math>;\npercentual\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100<\/mn><msub><mi>h<\/mi><mi>i<\/mi><\/msub><\/mrow><annotation encoding=\"application/x-tex\">100h_i<\/annotation><\/semantics><\/math>;\nacumulada é soma até uma classe ordenada. Para variável contínua, agrupe\nem intervalos sem sobreposição, com limites claros. Em dados agrupados,\nponto médio\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>m<\/mi><mi>i<\/mi><\/msub><annotation encoding=\"application/x-tex\">m_i<\/annotation><\/semantics><\/math>\naproxima valores e\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mo>≈<\/mo><mo>∑<\/mo><msub><mi>f<\/mi><mi>i<\/mi><\/msub><msub><mi>m<\/mi><mi>i<\/mi><\/msub><mi>/<\/mi><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\bar x\\approx\\sum f_im_i/n<\/annotation><\/semantics><\/math>.\nHistograma usa classes numéricas e área proporcional à frequência\n(densidade se amplitudes desiguais); barras representam categorias;\nsetores representam proporções; linhas evolução temporal.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Tabela de frequências<\/strong><\/p>\n<p>Número de produtos por cliente em uma amostra:<\/p>\n<div class=\"center\">\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: right;\">Produtos<\/th>\n<th style=\"text-align: right;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>f<\/mi><mi>i<\/mi><\/msub><annotation encoding=\"application/x-tex\">f_i<\/annotation><\/semantics><\/math><\/th>\n<th style=\"text-align: right;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>h<\/mi><mi>i<\/mi><\/msub><annotation encoding=\"application/x-tex\">h_i<\/annotation><\/semantics><\/math><\/th>\n<th style=\"text-align: right;\">Acumulada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: right;\">0<\/td>\n<td style=\"text-align: right;\">4<\/td>\n<td style=\"text-align: right;\">0,20<\/td>\n<td style=\"text-align: right;\">4<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: right;\">1<\/td>\n<td style=\"text-align: right;\">8<\/td>\n<td style=\"text-align: right;\">0,40<\/td>\n<td style=\"text-align: right;\">12<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: right;\">2<\/td>\n<td style=\"text-align: right;\">6<\/td>\n<td style=\"text-align: right;\">0,30<\/td>\n<td style=\"text-align: right;\">18<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: right;\">3<\/td>\n<td style=\"text-align: right;\">2<\/td>\n<td style=\"text-align: right;\">0,10<\/td>\n<td style=\"text-align: right;\">20<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<p>Total 20. Proporção com pelo menos dois produtos:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>6<\/mn><mo>+<\/mo><mn>2<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mn>20<\/mn><mo>=<\/mo><mn>40<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">(6+2)/20=40\\%<\/annotation><\/semantics><\/math>.\nA média é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>0<\/mn><mo>⋅<\/mo><mn>4<\/mn><mo>+<\/mo><mn>1<\/mn><mo>⋅<\/mo><mn>8<\/mn><mo>+<\/mo><mn>2<\/mn><mo>⋅<\/mo><mn>6<\/mn><mo>+<\/mo><mn>3<\/mn><mo>⋅<\/mo><mn>2<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mn>20<\/mn><mo>=<\/mo><mn>1<\/mn><mo>,<\/mo><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">(0\\cdot4+1\\cdot8+2\\cdot6+3\\cdot2)/20=1{,}3<\/annotation><\/semantics><\/math>.\nA moda é 1 e a mediana é 1 (10ª e 11ª observações).<\/p>\n<\/div>\n", "id": "estatistica-03", "number": 3, "examples": 1, "exercises": 0, "search": "Frequência absoluta f i f_i é contagem; relativa h i = f i / n h_i=f_i/n ; percentual 100 h i 100h_i ; acumulada é soma até uma classe ordenada. Para variável contínua, agrupe em intervalos sem sobreposição, com limites claros. Em dados agrupados, ponto médio m i m_i aproxima valores e x ‾ ≈ ∑ f i m i / n \\bar x\\approx\\sum f_im_i/n . Histograma usa classes numéricas e área proporcional à frequência (densidade se amplitudes desiguais); barras representam categorias; setores representam proporções; linhas evolução temporal. Exemplo resolvido · Tabela de frequências Número de produtos por cliente em uma amostra: Produtos f i f_i h i h_i Acumulada 0 4 0,20 4 1 8 0,40 12 2 6 0,30 18 3 2 0,10 20 Total 20. Proporção com pelo menos dois produtos: ( 6 + 2 ) / 20 = 40 % (6+2)/20=40\\% . A média é ( 0 ⋅ 4 + 1 ⋅ 8 + 2 ⋅ 6 + 3 ⋅ 2 ) / 20 = 1 , 3 (0\\cdot4+1\\cdot8+2\\cdot6+3\\cdot2)/20=1{,}3 . A moda é 1 e a mediana é 1 (10ª e 11ª observações)."}, {"title": "Medidas de posição e dispersão", "html": "<p>Média populacional\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ<\/mi><mo>=<\/mo><mo>∑<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mi>/<\/mi><mi>N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\mu=\\sum x_i/N<\/annotation><\/semantics><\/math>;\nmédia amostral\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mo>=<\/mo><mo>∑<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mi>/<\/mi><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\bar x=\\sum x_i/n<\/annotation><\/semantics><\/math>.\nMediana resiste melhor a extremos do que média; moda pode não existir de\nforma única. Amplitude é diferença entre extremos. Variância e desvio\npadrão populacionais:\n<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>σ<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mfrac><mn>1<\/mn><mi>N<\/mi><\/mfrac><mo>∑<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mo>−<\/mo><mi>μ<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>,<\/mo><mspace width=\"2.0em\"><\/mspace><mi>σ<\/mi><mo>=<\/mo><msqrt><msup><mi>σ<\/mi><mn>2<\/mn><\/msup><\/msqrt><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\sigma^2=\\frac{1}{N}\\sum(x_i-\\mu)^2,\\qquad\\sigma=\\sqrt{\\sigma^2}.<\/annotation><\/semantics><\/math>\nPara amostra, usa-se normalmente\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>s<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mo>∑<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mo>−<\/mo><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">s^2=\\sum(x_i-\\bar x)^2/(n-1)<\/annotation><\/semantics><\/math>\ncomo estimador não viesado da variância populacional. Coeficiente de\nvariação\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>V<\/mi><mo>=<\/mo><mi>σ<\/mi><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">|<\/mo><mi>μ<\/mi><mo form=\"postfix\" stretchy=\"true\">|<\/mo><\/mrow><mo>×<\/mo><mn>100<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CV=\\sigma/|\\mu|\\times100\\%<\/annotation><\/semantics><\/math>\nou\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s<\/mi><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">|<\/mo><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mo form=\"postfix\" stretchy=\"true\">|<\/mo><\/mrow><mo>×<\/mo><mn>100<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">s/|\\bar x|\\times100\\%<\/annotation><\/semantics><\/math>,\npara média não nula e escala adequada, compara dispersão relativa.\nVariância tem unidade ao quadrado; desvio padrão tem unidade original;\nCV é adimensional.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Variância e coeficiente de variação<\/strong><\/p>\n<p>Considere como população os dados\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10<\/mn><mo>,<\/mo><mn>12<\/mn><mo>,<\/mo><mn>14<\/mn><\/mrow><annotation encoding=\"application/x-tex\">10,12,14<\/annotation><\/semantics><\/math>.\nMédia\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>12<\/mn><\/mrow><annotation encoding=\"application/x-tex\">=12<\/annotation><\/semantics><\/math>.\nVariância\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>4<\/mn><mo>+<\/mo><mn>0<\/mn><mo>+<\/mo><mn>4<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mn>3<\/mn><mo>=<\/mo><mn>8<\/mn><mi>/<\/mi><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">=(4+0+4)/3=8/3<\/annotation><\/semantics><\/math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ<\/mi><mo>≈<\/mo><mn>1<\/mn><mo>,<\/mo><mn>633<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sigma\\approx1{,}633<\/annotation><\/semantics><\/math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>V<\/mi><mo>≈<\/mo><mn>13<\/mn><mo>,<\/mo><mn>61<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CV\\approx13{,}61\\%<\/annotation><\/semantics><\/math>.\nSe fossem amostra e se pedisse a variância amostral,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>s<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mn>8<\/mn><mi>/<\/mi><mn>2<\/mn><mo>=<\/mo><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">s^2=8/2=4<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">s=2<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>V<\/mi><mo>=<\/mo><mn>16<\/mn><mo>,<\/mo><mn>67<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CV=16{,}67\\%<\/annotation><\/semantics><\/math>.\nO denominador é a principal diferença.<\/p>\n<\/div>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Comparação relativa<\/strong><\/p>\n<p>Carteira A possui retorno médio de 10% e desvio padrão de 2 pontos\npercentuais; carteira B, média 20% e desvio de 3 pontos.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><msub><mi>V<\/mi><mi>A<\/mi><\/msub><mo>=<\/mo><mn>20<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CV_A=20\\%<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><msub><mi>V<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mn>15<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CV_B=15\\%<\/annotation><\/semantics><\/math>.\nB possui maior dispersão absoluta, mas menor dispersão relativa, segundo\nessa medida. Isso não basta para recomendar uma carteira.<\/p>\n<\/div>\n", "id": "estatistica-04", "number": 4, "examples": 2, "exercises": 0, "search": "Média populacional μ = ∑ x i / N \\mu=\\sum x_i/N ; média amostral x ‾ = ∑ x i / n \\bar x=\\sum x_i/n . Mediana resiste melhor a extremos do que média; moda pode não existir de forma única. Amplitude é diferença entre extremos. Variância e desvio padrão populacionais: σ 2 = 1 N ∑ ( x i − μ ) 2 , σ = σ 2 . \\sigma^2=\\frac{1}{N}\\sum(x_i-\\mu)^2,\\qquad\\sigma=\\sqrt{\\sigma^2}. Para amostra, usa-se normalmente s 2 = ∑ ( x i − x ‾ ) 2 / ( n − 1 ) s^2=\\sum(x_i-\\bar x)^2/(n-1) como estimador não viesado da variância populacional. Coeficiente de variação C V = σ / | μ | × 100 % CV=\\sigma/|\\mu|\\times100\\% ou s / | x ‾ | × 100 % s/|\\bar x|\\times100\\% , para média não nula e escala adequada, compara dispersão relativa. Variância tem unidade ao quadrado; desvio padrão tem unidade original; CV é adimensional. Exemplo resolvido · Variância e coeficiente de variação Considere como população os dados 10 , 12 , 14 10,12,14 . Média = 12 =12 . Variância = ( 4 + 0 + 4 ) / 3 = 8 / 3 =(4+0+4)/3=8/3 ; σ ≈ 1 , 633 \\sigma\\approx1{,}633 ; C V ≈ 13 , 61 % CV\\approx13{,}61\\% . Se fossem amostra e se pedisse a variância amostral, s 2 = 8 / 2 = 4 s^2=8/2=4 , s = 2 s=2 , C V = 16 , 67 % CV=16{,}67\\% . O denominador é a principal diferença. Exemplo resolvido · Comparação relativa Carteira A possui retorno médio de 10% e desvio padrão de 2 pontos percentuais; carteira B, média 20% e desvio de 3 pontos. C V A = 20 % CV_A=20\\% , C V B = 15 % CV_B=15\\% . B possui maior dispersão absoluta, mas menor dispersão relativa, segundo essa medida. Isso não basta para recomendar uma carteira."}, {"title": "Espaço amostral e eventos", "html": "<p>Experimento aleatório tem resultado incerto. Espaço amostral\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Ω<\/mi><annotation encoding=\"application/x-tex\">\\Omega<\/annotation><\/semantics><\/math>\ncontém resultados possíveis; evento\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>⊆<\/mo><mi>Ω<\/mi><\/mrow><annotation encoding=\"application/x-tex\">A\\subseteq\\Omega<\/annotation><\/semantics><\/math>\né conjunto de resultados.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>≤<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>≤<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0\\le P(A)\\le1<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>Ω<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(\\Omega)=1<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><msup><mi>A<\/mi><mi>c<\/mi><\/msup><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>1<\/mn><mo>−<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">P(A^c)=1-P(A)<\/annotation><\/semantics><\/math>.\nEm resultados equiprováveis,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">|<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">|<\/mo><\/mrow><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">|<\/mo><mi>Ω<\/mi><mo form=\"postfix\" stretchy=\"true\">|<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">P(A)=|A|/|\\Omega|<\/annotation><\/semantics><\/math>.\nA união representa ocorrência de pelo menos um; interseção, ocorrência\nsimultânea:\n<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∪<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>+<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>−<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">P(A\\cup B)=P(A)+P(B)-P(A\\cap B).<\/annotation><\/semantics><\/math>\nEventos mutuamente exclusivos têm interseção vazia; se ambos possuem\nprobabilidade positiva, não são independentes.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>União e complementar<\/strong><\/p>\n<p>De 100 clientes, 40 usam Pix, 35 usam cartão de crédito e 15 usam\nambos. Probabilidade de um cliente escolhido ao acaso usar pelo menos\num:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>40<\/mn><mo>+<\/mo><mn>35<\/mn><mo>−<\/mo><mn>15<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mn>100<\/mn><mo>=<\/mo><mn>60<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">(40+35-15)/100=60\\%<\/annotation><\/semantics><\/math>.\nNenhum:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">40\\%<\/annotation><\/semantics><\/math>.\nApenas Pix:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>40<\/mn><mo>−<\/mo><mn>15<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mn>100<\/mn><mo>=<\/mo><mn>25<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">(40-15)/100=25\\%<\/annotation><\/semantics><\/math>.<\/p>\n<\/div>\n", "id": "estatistica-05", "number": 5, "examples": 1, "exercises": 0, "search": "Experimento aleatório tem resultado incerto. Espaço amostral Ω \\Omega contém resultados possíveis; evento A ⊆ Ω A\\subseteq\\Omega é conjunto de resultados. 0 ≤ P ( A ) ≤ 1 0\\le P(A)\\le1 , P ( Ω ) = 1 P(\\Omega)=1 , P ( A c ) = 1 − P ( A ) P(A^c)=1-P(A) . Em resultados equiprováveis, P ( A ) = | A | / | Ω | P(A)=|A|/|\\Omega| . A união representa ocorrência de pelo menos um; interseção, ocorrência simultânea: P ( A ∪ B ) = P ( A ) + P ( B ) − P ( A ∩ B ) . P(A\\cup B)=P(A)+P(B)-P(A\\cap B). Eventos mutuamente exclusivos têm interseção vazia; se ambos possuem probabilidade positiva, não são independentes. Exemplo resolvido · União e complementar De 100 clientes, 40 usam Pix, 35 usam cartão de crédito e 15 usam ambos. Probabilidade de um cliente escolhido ao acaso usar pelo menos um: ( 40 + 35 − 15 ) / 100 = 60 % (40+35-15)/100=60\\% . Nenhum: 40 % 40\\% . Apenas Pix: ( 40 − 15 ) / 100 = 25 % (40-15)/100=25\\% ."}, {"title": "Probabilidade condicional e independência", "html": "<p>A probabilidade condicional restringe universo ao evento conhecido:\n<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∣<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><\/mfrac><mo>,<\/mo><mspace width=\"1.0em\"><\/mspace><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∣<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>,<\/mo><mspace width=\"1.0em\"><\/mspace><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>&gt;<\/mo><mn>0<\/mn><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)},\\quad P(A\\cap B)=P(A\\mid B)P(B),\\quad P(B)&gt;0.<\/annotation><\/semantics><\/math>\nIndependência significa\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">P(A\\cap B)=P(A)P(B)<\/annotation><\/semantics><\/math>;\nquando\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(B)&gt;0<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∣<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">P(A\\mid B)=P(A)<\/annotation><\/semantics><\/math>.\nNão confunda independência com exclusão mútua. Em retiradas sem\nreposição, as probabilidades geralmente se alteram após cada\nretirada.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Sem reposição<\/strong><\/p>\n<p>Em uma caixa há 4 fichas azuis e 6 brancas. Probabilidade de tirar\nduas azuis sem reposição:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>4<\/mn><mi>/<\/mi><mn>10<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>3<\/mn><mi>/<\/mi><mn>9<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>2<\/mn><mi>/<\/mi><mn>15<\/mn><mo>≈<\/mo><mn>13<\/mn><mo>,<\/mo><mn>33<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">(4/10)(3/9)=2/15\\approx13{,}33\\%<\/annotation><\/semantics><\/math>.\nCom reposição:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>4<\/mn><mi>/<\/mi><mn>10<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>=<\/mo><mn>16<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">(4/10)^2=16\\%<\/annotation><\/semantics><\/math>.\nO segundo sorteio depende do primeiro no caso sem reposição.<\/p>\n<\/div>\n", "id": "estatistica-06", "number": 6, "examples": 1, "exercises": 0, "search": "A probabilidade condicional restringe universo ao evento conhecido: P ( A ∣ B ) = P ( A ∩ B ) P ( B ) , P ( A ∩ B ) = P ( A ∣ B ) P ( B ) , P ( B ) > 0 . P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)},\\quad P(A\\cap B)=P(A\\mid B)P(B),\\quad P(B)>0. Independência significa P ( A ∩ B ) = P ( A ) P ( B ) P(A\\cap B)=P(A)P(B) ; quando P ( B ) > 0 P(B)>0 , P ( A ∣ B ) = P ( A ) P(A\\mid B)=P(A) . Não confunda independência com exclusão mútua. Em retiradas sem reposição, as probabilidades geralmente se alteram após cada retirada. Exemplo resolvido · Sem reposição Em uma caixa há 4 fichas azuis e 6 brancas. Probabilidade de tirar duas azuis sem reposição: ( 4 / 10 ) ( 3 / 9 ) = 2 / 15 ≈ 13 , 33 % (4/10)(3/9)=2/15\\approx13{,}33\\% . Com reposição: ( 4 / 10 ) 2 = 16 % (4/10)^2=16\\% . O segundo sorteio depende do primeiro no caso sem reposição."}, {"title": "Probabilidade total e teorema de Bayes", "html": "<p>Se\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>B<\/mi><mn>1<\/mn><\/msub><mo>,<\/mo><mi>…<\/mi><mo>,<\/mo><msub><mi>B<\/mi><mi>k<\/mi><\/msub><\/mrow><annotation encoding=\"application/x-tex\">B_1,\\ldots,B_k<\/annotation><\/semantics><\/math>\nparticionam o universo,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><msub><mo>∑<\/mo><mi>j<\/mi><\/msub><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∣<\/mo><msub><mi>B<\/mi><mi>j<\/mi><\/msub><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><msub><mi>B<\/mi><mi>j<\/mi><\/msub><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">P(A)=\\sum_jP(A\\mid B_j)P(B_j)<\/annotation><\/semantics><\/math>.\nBayes inverte a condição:\n<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><msub><mi>B<\/mi><mi>j<\/mi><\/msub><mo>∣<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∣<\/mo><msub><mi>B<\/mi><mi>j<\/mi><\/msub><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><msub><mi>B<\/mi><mi>j<\/mi><\/msub><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><mrow><munder><mo>∑<\/mo><mi>i<\/mi><\/munder><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∣<\/mo><msub><mi>B<\/mi><mi>i<\/mi><\/msub><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><msub><mi>B<\/mi><mi>i<\/mi><\/msub><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><\/mfrac><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">P(B_j\\mid A)=\\frac{P(A\\mid B_j)P(B_j)}{\\sum_iP(A\\mid B_i)P(B_i)}.<\/annotation><\/semantics><\/math>\nIsso é particularmente útil para interpretar alertas de fraude, sem\nconfundir sensibilidade do sistema e chance de fraude dado alerta.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Alerta de fraude<\/strong><\/p>\n<p>Em exemplo hipotético, 1% das transações é fraudulenta. O sistema\nalerta 90% das fraudulentas e 5% das legítimas. A probabilidade de\nalerta é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>,<\/mo><mn>01<\/mn><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>90<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>+<\/mo><mn>0<\/mn><mo>,<\/mo><mn>99<\/mn><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>05<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mn>0585<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0{,}01(0{,}90)+0{,}99(0{,}05)=0{,}0585<\/annotation><\/semantics><\/math>.\nEntão\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mtext mathvariant=\"normal\">fraude<\/mtext><mo>∣<\/mo><mtext mathvariant=\"normal\">alerta<\/mtext><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mn>009<\/mn><mi>/<\/mi><mn>0<\/mn><mo>,<\/mo><mn>0585<\/mn><mo>≈<\/mo><mn>15<\/mn><mo>,<\/mo><mn>38<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">P(\\text{fraude}\\mid\\text{alerta})=0{,}009/0{,}0585\\approx15{,}38\\%<\/annotation><\/semantics><\/math>.\nMesmo com sensibilidade alta, muitos alertas podem ser legítimos por\ncausa da baixa prevalência. Alerta não equivale a prova.<\/p>\n<\/div>\n", "id": "estatistica-07", "number": 7, "examples": 1, "exercises": 0, "search": "Se B 1 , … , B k B_1,\\ldots,B_k particionam o universo, P ( A ) = ∑ j P ( A ∣ B j ) P ( B j ) P(A)=\\sum_jP(A\\mid B_j)P(B_j) . Bayes inverte a condição: P ( B j ∣ A ) = P ( A ∣ B j ) P ( B j ) ∑ i P ( A ∣ B i ) P ( B i ) . P(B_j\\mid A)=\\frac{P(A\\mid B_j)P(B_j)}{\\sum_iP(A\\mid B_i)P(B_i)}. Isso é particularmente útil para interpretar alertas de fraude, sem confundir sensibilidade do sistema e chance de fraude dado alerta. Exemplo resolvido · Alerta de fraude Em exemplo hipotético, 1% das transações é fraudulenta. O sistema alerta 90% das fraudulentas e 5% das legítimas. A probabilidade de alerta é 0 , 01 ( 0 , 90 ) + 0 , 99 ( 0 , 05 ) = 0 , 0585 0{,}01(0{,}90)+0{,}99(0{,}05)=0{,}0585 . Então P ( fraude ∣ alerta ) = 0 , 009 / 0 , 0585 ≈ 15 , 38 % P(\\text{fraude}\\mid\\text{alerta})=0{,}009/0{,}0585\\approx15{,}38\\% . Mesmo com sensibilidade alta, muitos alertas podem ser legítimos por causa da baixa prevalência. Alerta não equivale a prova."}, {"title": "Variáveis aleatórias, distribuição binomial e normal", "html": "<p>Variável aleatória associa número ao resultado aleatório. Esperança\nde variável discreta é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">[<\/mo><mi>X<\/mi><mo form=\"postfix\" stretchy=\"true\">]<\/mo><\/mrow><mo>=<\/mo><mo>∑<\/mo><mi>x<\/mi><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>X<\/mi><mo>=<\/mo><mi>x<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">E[X]=\\sum xP(X=x)<\/annotation><\/semantics><\/math>;\nvariância\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">[<\/mo><msup><mi>X<\/mi><mn>2<\/mn><\/msup><mo form=\"postfix\" stretchy=\"true\">]<\/mo><\/mrow><mo>−<\/mo><mi>E<\/mi><msup><mrow><mo form=\"prefix\" stretchy=\"true\">[<\/mo><mi>X<\/mi><mo form=\"postfix\" stretchy=\"true\">]<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><annotation encoding=\"application/x-tex\">E[X^2]-E[X]^2<\/annotation><\/semantics><\/math>.\nBernoulli tem sucesso com probabilidade\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p<\/mi><annotation encoding=\"application/x-tex\">p<\/annotation><\/semantics><\/math>,\nfalha com\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>−<\/mo><mi>p<\/mi><\/mrow><annotation encoding=\"application/x-tex\">1-p<\/annotation><\/semantics><\/math>.\nBinomial conta sucessos em\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><annotation encoding=\"application/x-tex\">n<\/annotation><\/semantics><\/math>\nensaios independentes com mesma probabilidade:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>X<\/mi><mo>=<\/mo><mi>k<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac linethickness=\"0\"><mi>n<\/mi><mi>k<\/mi><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><msup><mi>p<\/mi><mi>k<\/mi><\/msup><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>p<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mi>n<\/mi><mo>−<\/mo><mi>k<\/mi><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">P(X=k)=\\binom nk p^k(1-p)^{n-k}<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">[<\/mo><mi>X<\/mi><mo form=\"postfix\" stretchy=\"true\">]<\/mo><\/mrow><mo>=<\/mo><mi>n<\/mi><mi>p<\/mi><\/mrow><annotation encoding=\"application/x-tex\">E[X]=np<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mi>a<\/mi><mi>r<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>X<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mi>n<\/mi><mi>p<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>p<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">Var(X)=np(1-p)<\/annotation><\/semantics><\/math>.<\/p>\n<p>A normal\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>μ<\/mi><mo>,<\/mo><msup><mi>σ<\/mi><mn>2<\/mn><\/msup><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">N(\\mu,\\sigma^2)<\/annotation><\/semantics><\/math>\né contínua, simétrica e unimodal, com média, mediana e moda iguais. A\nárea sob a curva é 1. Aproximadamente 68,27% dos valores estão entre\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ<\/mi><mo>±<\/mo><mi>σ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\mu\\pm\\sigma<\/annotation><\/semantics><\/math>,\n95,45% entre\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ<\/mi><mo>±<\/mo><mn>2<\/mn><mi>σ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\mu\\pm2\\sigma<\/annotation><\/semantics><\/math>\ne 99,73% entre\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ<\/mi><mo>±<\/mo><mn>3<\/mn><mi>σ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\mu\\pm3\\sigma<\/annotation><\/semantics><\/math>.\nPadronização\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z<\/mi><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>X<\/mi><mo>−<\/mo><mi>μ<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mi>σ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">Z=(X-\\mu)/\\sigma<\/annotation><\/semantics><\/math>\npermite consultar tabela normal padrão. Probabilidade de um valor exato\né zero para distribuição contínua.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Binomial<\/strong><\/p>\n<p>Três clientes independentes possuem probabilidade 0,2 de aceitar uma\nproposta. Exatamente um aceite:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac linethickness=\"0\"><mn>3<\/mn><mn>1<\/mn><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>2<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>8<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mn>384<\/mn><mo>=<\/mo><mn>38<\/mn><mo>,<\/mo><mn>4<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\binom31(0{,}2)(0{,}8)^2=0{,}384=38{,}4\\%<\/annotation><\/semantics><\/math>.\nPelo menos um:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>−<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>X<\/mi><mo>=<\/mo><mn>0<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>1<\/mn><mo>−<\/mo><mn>0<\/mn><mo>,<\/mo><msup><mn>8<\/mn><mn>3<\/mn><\/msup><mo>=<\/mo><mn>48<\/mn><mo>,<\/mo><mn>8<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">1-P(X=0)=1-0{,}8^3=48{,}8\\%<\/annotation><\/semantics><\/math>.<\/p>\n<\/div>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Distribuição normal<\/strong><\/p>\n<p>Tempo de atendimento aproximadamente normal, média 10 min e desvio 2\nmin.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>8<\/mn><mo>&lt;<\/mo><mi>X<\/mi><mo>&lt;<\/mo><mn>12<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>≈<\/mo><mn>68<\/mn><mo>,<\/mo><mn>27<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">P(8&lt;X&lt;12)\\approx68{,}27\\%<\/annotation><\/semantics><\/math>.\nPara\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X<\/mi><mo>=<\/mo><mn>14<\/mn><\/mrow><annotation encoding=\"application/x-tex\">X=14<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z<\/mi><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>14<\/mn><mo>−<\/mo><mn>10<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mn>2<\/mn><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">z=(14-10)/2=2<\/annotation><\/semantics><\/math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>X<\/mi><mo>&gt;<\/mo><mn>14<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>≈<\/mo><mn>2<\/mn><mo>,<\/mo><mn>275<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">P(X&gt;14)\\approx2{,}275\\%<\/annotation><\/semantics><\/math>.\nA metade restante fora de dois desvios está na cauda esquerda.<\/p>\n<\/div>\n", "id": "estatistica-08", "number": 8, "examples": 2, "exercises": 0, "search": "Variável aleatória associa número ao resultado aleatório. Esperança de variável discreta é E [ X ] = ∑ x P ( X = x ) E[X]=\\sum xP(X=x) ; variância E [ X 2 ] − E [ X ] 2 E[X^2]-E[X]^2 . Bernoulli tem sucesso com probabilidade p p , falha com 1 − p 1-p . Binomial conta sucessos em n n ensaios independentes com mesma probabilidade: P ( X = k ) = ( n k ) p k ( 1 − p ) n − k P(X=k)=\\binom nk p^k(1-p)^{n-k} , E [ X ] = n p E[X]=np , V a r ( X ) = n p ( 1 − p ) Var(X)=np(1-p) . A normal N ( μ , σ 2 ) N(\\mu,\\sigma^2) é contínua, simétrica e unimodal, com média, mediana e moda iguais. A área sob a curva é 1. Aproximadamente 68,27% dos valores estão entre μ ± σ \\mu\\pm\\sigma , 95,45% entre μ ± 2 σ \\mu\\pm2\\sigma e 99,73% entre μ ± 3 σ \\mu\\pm3\\sigma . Padronização Z = ( X − μ ) / σ Z=(X-\\mu)/\\sigma permite consultar tabela normal padrão. Probabilidade de um valor exato é zero para distribuição contínua. Exemplo resolvido · Binomial Três clientes independentes possuem probabilidade 0,2 de aceitar uma proposta. Exatamente um aceite: ( 3 1 ) ( 0 , 2 ) ( 0 , 8 ) 2 = 0 , 384 = 38 , 4 % \\binom31(0{,}2)(0{,}8)^2=0{,}384=38{,}4\\% . Pelo menos um: 1 − P ( X = 0 ) = 1 − 0 , 8 3 = 48 , 8 % 1-P(X=0)=1-0{,}8^3=48{,}8\\% . Exemplo resolvido · Distribuição normal Tempo de atendimento aproximadamente normal, média 10 min e desvio 2 min. P ( 8 < X < 12 ) ≈ 68 , 27 % P(8<X<12)\\approx68{,}27\\% . Para X = 14 X=14 , z = ( 14 − 10 ) / 2 = 2 z=(14-10)/2=2 ; P ( X > 14 ) ≈ 2 , 275 % P(X>14)\\approx2{,}275\\% . A metade restante fora de dois desvios está na cauda esquerda."}, {"title": "Indicadores estatísticos em contextos bancários", "html": "<p>Taxa de inadimplência depende da definição de atraso, carteira e\ndenominador; taxa de conversão é contratos/contatos elegíveis;\nsatisfação pode ser medida por proporções; tempo médio deve ser\nanalisado com dispersão e mediana. Correlação indica associação, não\nprova causalidade. Uma média agregada pode ocultar diferenças entre\ngrupos e períodos. Comparações devem manter a mesma definição, base e\nintervalo. Um indicador maior pode ser bom (resolução) ou ruim\n(reclamação), conforme objetivo.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Média ponderada de indicadores<\/strong><\/p>\n<p>Agência A: 20 inadimplentes em 100 contratos (20%); B: 30 em 900\n(3,33%). No conjunto,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>50<\/mn><mi>/<\/mi><mn>1000<\/mn><mo>=<\/mo><mn>5<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">50/1000=5\\%<\/annotation><\/semantics><\/math>,\nnão a média simples de 20% e 3,33%. A ponderação correta usa tamanho da\ncarteira em número de contratos neste exemplo.<\/p>\n<\/div>\n", "id": "estatistica-09", "number": 9, "examples": 1, "exercises": 0, "search": "Taxa de inadimplência depende da definição de atraso, carteira e denominador; taxa de conversão é contratos/contatos elegíveis; satisfação pode ser medida por proporções; tempo médio deve ser analisado com dispersão e mediana. Correlação indica associação, não prova causalidade. Uma média agregada pode ocultar diferenças entre grupos e períodos. Comparações devem manter a mesma definição, base e intervalo. Um indicador maior pode ser bom (resolução) ou ruim (reclamação), conforme objetivo. Exemplo resolvido · Média ponderada de indicadores Agência A: 20 inadimplentes em 100 contratos (20%); B: 30 em 900 (3,33%). No conjunto, 50 / 1000 = 5 % 50/1000=5\\% , não a média simples de 20% e 3,33%. A ponderação correta usa tamanho da carteira em número de contratos neste exemplo."}, {"title": "Fixação comentada", "html": "<div class=\"exercise\">\n<p><strong>Questão 1.<\/strong> Qual amostragem seleciona aleatoriamente\nalguns bairros e analisa clientes nesses bairros?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Por conglomerados.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 2.<\/strong> Qual a mediana de 1, 3, 8, 9?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>3<\/mn><mo>+<\/mo><mn>8<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mn>2<\/mn><mo>=<\/mo><mn>5<\/mn><mo>,<\/mo><mn>5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">(3+8)/2=5{,}5<\/annotation><\/semantics><\/math>.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 3.<\/strong> Se\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(A)=0{,}3<\/annotation><\/semantics><\/math>,\nqual\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><msup><mi>A<\/mi><mi>c<\/mi><\/msup><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">P(A^c)<\/annotation><\/semantics><\/math>?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> 0,7.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 4.<\/strong> Se\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><annotation encoding=\"application/x-tex\">A<\/annotation><\/semantics><\/math>\ne\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B<\/mi><annotation encoding=\"application/x-tex\">B<\/annotation><\/semantics><\/math>\nsão independentes, com probabilidades 0,4 e 0,5, qual a interseção?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>,<\/mo><mn>4<\/mn><mo>⋅<\/mo><mn>0<\/mn><mo>,<\/mo><mn>5<\/mn><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0{,}4\\cdot0{,}5=0{,}2<\/annotation><\/semantics><\/math>.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 5.<\/strong> Para normal de média 100 e desvio 15, qual\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>z<\/mi><annotation encoding=\"application/x-tex\">z<\/annotation><\/semantics><\/math>\nde 130?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">z=2<\/annotation><\/semantics><\/math>.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 6.<\/strong> Um conjunto de valores é multiplicado por\n3. Como mudam média, desvio padrão e variância?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Média e desvio são multiplicados por 3;\nvariância por 9.<\/p><\/details>\n<\/div>\n", "id": "estatistica-10", "number": 10, "examples": 0, "exercises": 6, "search": "Questão 1. Qual amostragem seleciona aleatoriamente alguns bairros e analisa clientes nesses bairros? Ver resposta comentada Por conglomerados. Questão 2. Qual a mediana de 1, 3, 8, 9? Ver resposta comentada ( 3 + 8 ) / 2 = 5 , 5 (3+8)/2=5{,}5 . Questão 3. Se P ( A ) = 0 , 3 P(A)=0{,}3 , qual P ( A c ) P(A^c) ? Ver resposta comentada 0,7. Questão 4. Se A A e B B são independentes, com probabilidades 0,4 e 0,5, qual a interseção? Ver resposta comentada 0 , 4 ⋅ 0 , 5 = 0 , 2 0{,}4\\cdot0{,}5=0{,}2 . Questão 5. Para normal de média 100 e desvio 15, qual z z de 130? Ver resposta comentada z = 2 z=2 . Questão 6. Um conjunto de valores é multiplicado por 3. Como mudam média, desvio padrão e variância? Ver resposta comentada Média e desvio são multiplicados por 3; variância por 9."}], "id": "estatistica", "short": "Probabilidade e Estatística", "icon": "σ", "questions": 5, "description": "Dados, distribuições e probabilidades.", "group": "especificos"}, {"title": "Informática e Comportamentos Digitais", "intro": "", "sections": [{"title": "Fundamentos de informática: hardware e software", "html": "<p>Hardware são componentes físicos: CPU executa instruções; RAM\narmazena dados temporários de trabalho (volátil); SSD/HDD armazenam\narquivos de forma persistente; placa-mãe conecta componentes;\nperiféricos permitem entrada (teclado, scanner) e saída (monitor,\nimpressora). Bit é unidade binária, byte tem 8 bits. Unidades decimais\n(GB) e binárias (GiB) usam bases diferentes. Software é conjunto de\ninstruções: sistema operacional gerencia recursos; aplicativos executam\ntarefas; drivers permitem comunicação com dispositivos; firmware integra\ncontrole de hardware. Backup não é equivalente a RAM ou cache.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Memória e armazenamento<\/strong><\/p>\n<p>Ao desligar computador normalmente, conteúdo de trabalho não salvo na\nRAM pode ser perdido, enquanto arquivo salvo em SSD permanece. RAM é\nvolátil; SSD é armazenamento não volátil. Mais RAM pode melhorar\nmultitarefa, mas não substitui armazenamento permanente.<\/p>\n<\/div>\n", "id": "informatica-01", "number": 1, "examples": 1, "exercises": 0, "search": "Hardware são componentes físicos: CPU executa instruções; RAM armazena dados temporários de trabalho (volátil); SSD/HDD armazenam arquivos de forma persistente; placa-mãe conecta componentes; periféricos permitem entrada (teclado, scanner) e saída (monitor, impressora). Bit é unidade binária, byte tem 8 bits. Unidades decimais (GB) e binárias (GiB) usam bases diferentes. Software é conjunto de instruções: sistema operacional gerencia recursos; aplicativos executam tarefas; drivers permitem comunicação com dispositivos; firmware integra controle de hardware. Backup não é equivalente a RAM ou cache. Exemplo resolvido · Memória e armazenamento Ao desligar computador normalmente, conteúdo de trabalho não salvo na RAM pode ser perdido, enquanto arquivo salvo em SSD permanece. RAM é volátil; SSD é armazenamento não volátil. Mais RAM pode melhorar multitarefa, mas não substitui armazenamento permanente."}, {"title": "Windows e Linux: operações básicas", "html": "<p>Sistemas operacionais gerenciam arquivos, processos, contas,\npermissões e dispositivos. No Windows, Explorador de Arquivos organiza\npastas; Gerenciador de Tarefas exibe processos e recursos; Lixeira pode\npermitir restauração de certos arquivos excluídos. Ctrl+C copia, Ctrl+X\nrecorta, Ctrl+V cola, Ctrl+Z desfaz, Alt+Tab alterna janelas. Extensões\ncomo .pdf, .xlsx, .docx e .exe indicam formatos ou executáveis; alterar\nextensão não converte conteúdo.<\/p>\n<p>Linux é família de sistemas baseada no kernel Linux; distribuições\nincluem interfaces gráficas e terminal. Diretórios organizam-se a partir\nde /; caminhos são geralmente sensíveis a maiúsculas. Comandos básicos:\n<code>pwd<\/code> mostra diretório atual; <code>ls<\/code> lista;\n<code>cd<\/code> navega; <code>mkdir<\/code> cria diretório;\n<code>cp<\/code> copia; <code>mv<\/code> move ou renomeia; <code>rm<\/code>\nremove; <code>chmod<\/code> altera permissões; <code>cat<\/code> exibe\nconteúdo textual. Use comandos de remoção com cuidado. Permissões de\nleitura, escrita e execução delimitam ações. Menor privilégio reduz\ndanos.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Arquivos e permissões<\/strong><\/p>\n<p>Um usuário quer copiar um relatório Linux de pasta sem alterar\noriginal: use <code>cp relatorio.pdf copia.pdf<\/code>. <code>mv<\/code>\nmudaria nome ou localização do arquivo, e <code>rm<\/code> o removeria. A\ncópia depende de permissões de leitura e escrita nos locais\nrespectivos.<\/p>\n<\/div>\n", "id": "informatica-02", "number": 2, "examples": 1, "exercises": 0, "search": "Sistemas operacionais gerenciam arquivos, processos, contas, permissões e dispositivos. No Windows, Explorador de Arquivos organiza pastas; Gerenciador de Tarefas exibe processos e recursos; Lixeira pode permitir restauração de certos arquivos excluídos. Ctrl+C copia, Ctrl+X recorta, Ctrl+V cola, Ctrl+Z desfaz, Alt+Tab alterna janelas. Extensões como .pdf, .xlsx, .docx e .exe indicam formatos ou executáveis; alterar extensão não converte conteúdo. Linux é família de sistemas baseada no kernel Linux; distribuições incluem interfaces gráficas e terminal. Diretórios organizam-se a partir de /; caminhos são geralmente sensíveis a maiúsculas. Comandos básicos: pwd mostra diretório atual; ls lista; cd navega; mkdir cria diretório; cp copia; mv move ou renomeia; rm remove; chmod altera permissões; cat exibe conteúdo textual. Use comandos de remoção com cuidado. Permissões de leitura, escrita e execução delimitam ações. Menor privilégio reduz danos. Exemplo resolvido · Arquivos e permissões Um usuário quer copiar um relatório Linux de pasta sem alterar original: use cp relatorio.pdf copia.pdf . mv mudaria nome ou localização do arquivo, e rm o removeria. A cópia depende de permissões de leitura e escrita nos locais respectivos."}, {"title": "Redes, internet, intranet, navegadores e busca", "html": "<p>Rede LAN cobre ambiente local; WAN interliga áreas maiores; internet\né rede global de redes; intranet é rede ou conjunto de serviços privados\nde organização; extranet permite acesso controlado a terceiros. IP\nidentifica interface na rede; DNS resolve nomes; roteador encaminha\npacotes; TCP oferece transporte confiável e ordenado, UDP não possui as\nmesmas garantias. HTTP é protocolo de comunicação web; HTTPS usa TLS\npara proteger comunicação, mas cadeado não prova que o site é legítimo.\nNavegador interpreta páginas (Chrome, Firefox, Edge); buscador indexa e\nlocaliza resultados. Pesquisas com aspas procuram expressão exata;\noperador <code>site:<\/code> restringe domínio em buscadores compatíveis.\nVerifique URL, fonte e data.<\/p>\n<p>Correio eletrônico: Para identifica destinatários principais, Cc\nenvia cópia visível e Cco oculta os destinatários de outros\ndestinatários. SMTP é associado ao envio; IMAP sincroniza mensagens no\nservidor; POP3 é usado para recuperar mensagens. Anexos podem\ntransportar malware. Responder a todos deve ser decisão consciente,\nespecialmente com dados pessoais.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Segurança web e e-mail<\/strong><\/p>\n<p>Um site falso apresenta HTTPS e endereço parecido com banco. O HTTPS\nprotege conexão com aquele domínio, não garante autenticidade da\ninstituição. Não forneça credenciais; acesse o domínio conhecido por\ncanal oficial. Em comunicado a clientes sem relação entre si, Cco pode\npreservar endereços, mas use ferramenta autorizada e política de\nprivacidade.<\/p>\n<\/div>\n", "id": "informatica-03", "number": 3, "examples": 1, "exercises": 0, "search": "Rede LAN cobre ambiente local; WAN interliga áreas maiores; internet é rede global de redes; intranet é rede ou conjunto de serviços privados de organização; extranet permite acesso controlado a terceiros. IP identifica interface na rede; DNS resolve nomes; roteador encaminha pacotes; TCP oferece transporte confiável e ordenado, UDP não possui as mesmas garantias. HTTP é protocolo de comunicação web; HTTPS usa TLS para proteger comunicação, mas cadeado não prova que o site é legítimo. Navegador interpreta páginas (Chrome, Firefox, Edge); buscador indexa e localiza resultados. Pesquisas com aspas procuram expressão exata; operador site: restringe domínio em buscadores compatíveis. Verifique URL, fonte e data. Correio eletrônico: Para identifica destinatários principais, Cc envia cópia visível e Cco oculta os destinatários de outros destinatários. SMTP é associado ao envio; IMAP sincroniza mensagens no servidor; POP3 é usado para recuperar mensagens. Anexos podem transportar malware. Responder a todos deve ser decisão consciente, especialmente com dados pessoais. Exemplo resolvido · Segurança web e e-mail Um site falso apresenta HTTPS e endereço parecido com banco. O HTTPS protege conexão com aquele domínio, não garante autenticidade da instituição. Não forneça credenciais; acesse o domínio conhecido por canal oficial. Em comunicado a clientes sem relação entre si, Cco pode preservar endereços, mas use ferramenta autorizada e política de privacidade."}, {"title": "Computação em nuvem e colaboração", "html": "<p>Nuvem oferece recursos remotos sob demanda. SaaS é software como\nserviço (aplicativo online); PaaS fornece plataforma de desenvolvimento;\nIaaS fornece infraestrutura. Nuvem pública, privada e híbrida diferem na\nforma de disponibilização. Sincronização mantém arquivos coerentes entre\ndispositivos, mas pode replicar exclusão ou corrupção; backup mantém\ncópias recuperáveis e deve ter testes. Colaboração permite coedição,\ncomentários, controle de versões e permissões. Aplicativos corporativos\nincluem editor de textos, planilha, apresentações e comunicação. Não\ncompartilhe arquivo de cliente com “qualquer pessoa com link” sem\nautorização.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Sincronização e backup<\/strong><\/p>\n<p>Um arquivo sincronizado é apagado e a exclusão se replica. A\nsincronização não garantiu cópia independente. Histórico de versões e\nretenção podem ajudar, mas uma política de backup com restauração\ntestada é necessária.<\/p>\n<\/div>\n", "id": "informatica-04", "number": 4, "examples": 1, "exercises": 0, "search": "Nuvem oferece recursos remotos sob demanda. SaaS é software como serviço (aplicativo online); PaaS fornece plataforma de desenvolvimento; IaaS fornece infraestrutura. Nuvem pública, privada e híbrida diferem na forma de disponibilização. Sincronização mantém arquivos coerentes entre dispositivos, mas pode replicar exclusão ou corrupção; backup mantém cópias recuperáveis e deve ter testes. Colaboração permite coedição, comentários, controle de versões e permissões. Aplicativos corporativos incluem editor de textos, planilha, apresentações e comunicação. Não compartilhe arquivo de cliente com “qualquer pessoa com link” sem autorização. Exemplo resolvido · Sincronização e backup Um arquivo sincronizado é apagado e a exclusão se replica. A sincronização não garantiu cópia independente. Histórico de versões e retenção podem ajudar, mas uma política de backup com restauração testada é necessária."}, {"title": "Google Workspace: ferramentas e uso prático", "html": "<div class=\"center\">\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Ferramenta<\/th>\n<th style=\"text-align: left;\">Função e pontos de prova<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Gmail<\/td>\n<td style=\"text-align: left;\">Correio eletrônico: filtros, marcadores,\npesquisa, anexos, Cc/Cco.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Drive<\/td>\n<td style=\"text-align: left;\">Armazenamento, organização,\ncompartilhamento, permissões e histórico.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Docs<\/td>\n<td style=\"text-align: left;\">Editor de texto colaborativo, comentários,\nsugestões e versões.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Sheets<\/td>\n<td style=\"text-align: left;\">Planilhas: células, fórmulas, filtros,\ngráficos, referências.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Slides<\/td>\n<td style=\"text-align: left;\">Apresentações, layouts, colaboração e\nnotas do apresentador.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Forms<\/td>\n<td style=\"text-align: left;\">Formulários, questionários, validação e\ncoleta de respostas.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Calendar<\/td>\n<td style=\"text-align: left;\">Agendamento, calendários, convidados,\ndisponibilidade e recorrência.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Meet<\/td>\n<td style=\"text-align: left;\">Videoconferência, compartilhamento de tela\ne controles de reunião.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Chat<\/td>\n<td style=\"text-align: left;\">Mensagens, espaços de colaboração e\nintegração com arquivos.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<p>Em Drive, visualizador lê, comentador comenta e editor altera\nconforme permissões; proprietários/administradores têm controles\nadicionais. Em Docs, modo de sugestões propõe alterações sem\nincorporá-las definitivamente até aceite. Histórico identifica versões e\nfacilita recuperação. Forms pode vincular respostas a Sheets; colete\napenas dados necessários e limite acesso. Calendar permite convidar\nparticipantes; convite não significa aceitação. Meet serve a reuniões\nsíncronas; Chat permite comunicação e colaboração assíncrona.<\/p>\n<p>Em Sheets, fórmula começa com =. Referência relativa A1 muda ao\ncopiar; absoluta <code>$A$1<\/code> permanece; mista fixa linha ou\ncoluna. Funções usuais em configuração pt-BR: <code>SOMA<\/code>,\n<code>MÉDIA<\/code>, <code>SE<\/code>, <code>CONT.SE<\/code>,\n<code>SOMASE<\/code>, <code>MÁXIMO<\/code>, <code>MÍNIMO<\/code>; nomes e\nseparadores dependem da configuração regional. Filtros ocultam linhas\nque não atendem critério; ordenar altera disposição; gráficos\nrepresentam dados. Validação limita entradas; proteção de intervalo\nlimita edição, não substitui controle de compartilhamento.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Planilha de comissões<\/strong><\/p>\n<p>A2 contém vendas de R$ 5.000 e B1 taxa de 2%. Use\n<code>=A2*$B$1<\/code>. Resultado R$ 100. Ao copiar para linha 3, A2 vira\nA3, mas B1 fica fixo. Para classificar meta de 5.000,\n<code>=SE(A2&gt;=5000;\"Atingida\";\"Não atingida\")<\/code>, em configuração\ncompatível.<\/p>\n<\/div>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Permissões<\/strong><\/p>\n<p>Um colega precisa revisar texto sem modificar original. Compartilhe\ncomo comentador se bastam comentários; em ambiente autorizado, sugestões\npodem ser adequadas. Evite conceder edição ou acesso público por padrão.\nPrincípio: menor privilégio necessário.<\/p>\n<\/div>\n", "id": "informatica-05", "number": 5, "examples": 2, "exercises": 0, "search": "Ferramenta Função e pontos de prova Gmail Correio eletrônico: filtros, marcadores, pesquisa, anexos, Cc/Cco. Drive Armazenamento, organização, compartilhamento, permissões e histórico. Docs Editor de texto colaborativo, comentários, sugestões e versões. Sheets Planilhas: células, fórmulas, filtros, gráficos, referências. Slides Apresentações, layouts, colaboração e notas do apresentador. Forms Formulários, questionários, validação e coleta de respostas. Calendar Agendamento, calendários, convidados, disponibilidade e recorrência. Meet Videoconferência, compartilhamento de tela e controles de reunião. Chat Mensagens, espaços de colaboração e integração com arquivos. Em Drive, visualizador lê, comentador comenta e editor altera conforme permissões; proprietários/administradores têm controles adicionais. Em Docs, modo de sugestões propõe alterações sem incorporá-las definitivamente até aceite. Histórico identifica versões e facilita recuperação. Forms pode vincular respostas a Sheets; colete apenas dados necessários e limite acesso. Calendar permite convidar participantes; convite não significa aceitação. Meet serve a reuniões síncronas; Chat permite comunicação e colaboração assíncrona. Em Sheets, fórmula começa com =. Referência relativa A1 muda ao copiar; absoluta $A$1 permanece; mista fixa linha ou coluna. Funções usuais em configuração pt-BR: SOMA , MÉDIA , SE , CONT.SE , SOMASE , MÁXIMO , MÍNIMO ; nomes e separadores dependem da configuração regional. Filtros ocultam linhas que não atendem critério; ordenar altera disposição; gráficos representam dados. Validação limita entradas; proteção de intervalo limita edição, não substitui controle de compartilhamento. Exemplo resolvido · Planilha de comissões A2 contém vendas de R$ 5.000 e B1 taxa de 2%. Use =A2*$B$1 . Resultado R$ 100. Ao copiar para linha 3, A2 vira A3, mas B1 fica fixo. Para classificar meta de 5.000, =SE(A2>=5000;\"Atingida\";\"Não atingida\") , em configuração compatível. Exemplo resolvido · Permissões Um colega precisa revisar texto sem modificar original. Compartilhe como comentador se bastam comentários; em ambiente autorizado, sugestões podem ser adequadas. Evite conceder edição ou acesso público por padrão. Princípio: menor privilégio necessário."}, {"title": "Segurança da informação e comportamento digital", "html": "<p>A tríade CID: confidencialidade restringe acesso a autorizados;\nintegridade protege exatidão e contra alterações indevidas;\ndisponibilidade assegura acesso quando necessário. Autenticidade\nconfirma identidade/origem; não repúdio auxilia comprovar autoria.\nAutenticação verifica identidade; autorização define permissões. MFA\ncombina fatores distintos: algo que se sabe (senha), possui (token) ou é\n(biometria). Duas senhas não constituem necessariamente dois fatores.\nSenhas longas, únicas, gerenciador aprovado e MFA reduzem risco.<\/p>\n<p>Malware é software malicioso; vírus depende de hospedeiro e se\nreplica; worm propaga-se por redes; trojan disfarça-se de legítimo;\nransomware bloqueia ou cifra dados e exige pagamento; spyware coleta\ndados indevidamente. Phishing usa mensagens/sites enganosos; smishing\nusa SMS; vishing usa voz. Engenharia social explora confiança, urgência\ne autoridade. Firewall controla tráfego segundo regras; antivírus\ndetecta ameaças; criptografia protege conteúdo; hash gera resumo\nunidirecional usado em verificação de integridade, não é criptografia\nreversível. Atualizações corrigem vulnerabilidades. Use Wi-Fi e\ndispositivos conforme política, bloqueie tela, reporte incidentes e não\ninstale software não autorizado.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Phishing bancário<\/strong><\/p>\n<p>E-mail urgente pede senha e código MFA para impedir bloqueio. Não\nclique, não responda com dados, não forneça código. Verifique por canal\nindependente oficial e reporte ao time de segurança. O senso de urgência\nnão comprova legitimidade. Em suspeita de incidente corporativo,\npreserve evidências e siga o procedimento interno.<\/p>\n<\/div>\n", "id": "informatica-06", "number": 6, "examples": 1, "exercises": 0, "search": "A tríade CID: confidencialidade restringe acesso a autorizados; integridade protege exatidão e contra alterações indevidas; disponibilidade assegura acesso quando necessário. Autenticidade confirma identidade/origem; não repúdio auxilia comprovar autoria. Autenticação verifica identidade; autorização define permissões. MFA combina fatores distintos: algo que se sabe (senha), possui (token) ou é (biometria). Duas senhas não constituem necessariamente dois fatores. Senhas longas, únicas, gerenciador aprovado e MFA reduzem risco. Malware é software malicioso; vírus depende de hospedeiro e se replica; worm propaga-se por redes; trojan disfarça-se de legítimo; ransomware bloqueia ou cifra dados e exige pagamento; spyware coleta dados indevidamente. Phishing usa mensagens/sites enganosos; smishing usa SMS; vishing usa voz. Engenharia social explora confiança, urgência e autoridade. Firewall controla tráfego segundo regras; antivírus detecta ameaças; criptografia protege conteúdo; hash gera resumo unidirecional usado em verificação de integridade, não é criptografia reversível. Atualizações corrigem vulnerabilidades. Use Wi-Fi e dispositivos conforme política, bloqueie tela, reporte incidentes e não instale software não autorizado. Exemplo resolvido · Phishing bancário E-mail urgente pede senha e código MFA para impedir bloqueio. Não clique, não responda com dados, não forneça código. Verifique por canal independente oficial e reporte ao time de segurança. O senso de urgência não comprova legitimidade. Em suspeita de incidente corporativo, preserve evidências e siga o procedimento interno."}, {"title": "LGPD: conceitos, princípios, bases legais e agentes", "html": "<p>A Lei 13.709/2018 protege direitos fundamentais de liberdade,\nprivacidade e livre desenvolvimento da personalidade e disciplina\ntratamento de dados pessoais. Titular é pessoa natural a quem dados se\nreferem. Tratamento inclui coleta, acesso, armazenamento, utilização,\ncompartilhamento e eliminação. Dado pessoal permite identificar pessoa\nnatural; sensível abrange origem racial/étnica, convicção religiosa,\nopinião política, filiação sindical ou a organização religiosa,\nfilosófica ou política, saúde, vida sexual, dado genético ou biométrico\nvinculado à pessoa. Anonimização efetiva remove possibilidade de\nidentificação por meios razoáveis; pseudonimização reduz associação\ndireta, mas dados podem continuar pessoais.<\/p>\n<p>Princípios do art. 6º: finalidade, adequação, necessidade, livre\nacesso, qualidade dos dados, transparência, segurança, prevenção, não\ndiscriminação e responsabilização/prestação de contas. Bases legais do\nart. 7º incluem consentimento, obrigação legal/regulatória, execução de\npolíticas públicas, estudos por órgão de pesquisa, execução de contrato\nou procedimentos preliminares a pedido do titular, exercício regular de\ndireitos, proteção da vida, tutela da saúde, legítimo interesse e\nproteção do crédito. Bases de dados sensíveis são próprias no art. 11;\nnão aplique automaticamente legítimo interesse a dado sensível.\nConsentimento deve ser livre, informado e inequívoco para finalidade\ndeterminada, quando usado; não é sempre obrigatório. Revogação não\nimpede tratamento amparado por outra base cabível.<\/p>\n<p>Controlador toma decisões sobre tratamento; operador trata em nome do\ncontrolador; encarregado atua como canal entre controlador, titulares e\nANPD, conforme legislação. ANPD orienta, regulamenta e fiscaliza dentro\ndas competências. O titular possui direitos de confirmação, acesso,\ncorreção, anonimização/bloqueio/eliminação de dados desnecessários ou\ntratados irregularmente, portabilidade conforme regras, informação sobre\ncompartilhamento, informação sobre possibilidade de negar consentimento\ne consequências, revogação, entre outros. Eliminação não é absoluta:\nretenção pode decorrer de obrigação legal. A lei prevê responsabilidade\ne sanções administrativas, incluindo advertência, multa nas hipóteses\nlegais, publicização, bloqueio e eliminação, entre outras. Consulte os\nartigos 5º a 20, 37 a 49 e 52 da lei para detalhes e exceções.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Base legal e minimização<\/strong><\/p>\n<p>O banco coleta CPF e documentos necessários para cumprir obrigação de\nidentificação. Não precisa forçar consentimento genérico se a base\nadequada for obrigação legal/regulatória. Coletar dados de saúde sem\nrelação com a finalidade viola minimização, salvo justificativa e base\nespecífica aplicável. Cada finalidade deve ter fundamento.<\/p>\n<\/div>\n", "id": "informatica-07", "number": 7, "examples": 1, "exercises": 0, "search": "A Lei 13.709/2018 protege direitos fundamentais de liberdade, privacidade e livre desenvolvimento da personalidade e disciplina tratamento de dados pessoais. Titular é pessoa natural a quem dados se referem. Tratamento inclui coleta, acesso, armazenamento, utilização, compartilhamento e eliminação. Dado pessoal permite identificar pessoa natural; sensível abrange origem racial/étnica, convicção religiosa, opinião política, filiação sindical ou a organização religiosa, filosófica ou política, saúde, vida sexual, dado genético ou biométrico vinculado à pessoa. Anonimização efetiva remove possibilidade de identificação por meios razoáveis; pseudonimização reduz associação direta, mas dados podem continuar pessoais. Princípios do art. 6º: finalidade, adequação, necessidade, livre acesso, qualidade dos dados, transparência, segurança, prevenção, não discriminação e responsabilização/prestação de contas. Bases legais do art. 7º incluem consentimento, obrigação legal/regulatória, execução de políticas públicas, estudos por órgão de pesquisa, execução de contrato ou procedimentos preliminares a pedido do titular, exercício regular de direitos, proteção da vida, tutela da saúde, legítimo interesse e proteção do crédito. Bases de dados sensíveis são próprias no art. 11; não aplique automaticamente legítimo interesse a dado sensível. Consentimento deve ser livre, informado e inequívoco para finalidade determinada, quando usado; não é sempre obrigatório. Revogação não impede tratamento amparado por outra base cabível. Controlador toma decisões sobre tratamento; operador trata em nome do controlador; encarregado atua como canal entre controlador, titulares e ANPD, conforme legislação. ANPD orienta, regulamenta e fiscaliza dentro das competências. O titular possui direitos de confirmação, acesso, correção, anonimização/bloqueio/eliminação de dados desnecessários ou tratados irregularmente, portabilidade conforme regras, informação sobre compartilhamento, informação sobre possibilidade de negar consentimento e consequências, revogação, entre outros. Eliminação não é absoluta: retenção pode decorrer de obrigação legal. A lei prevê responsabilidade e sanções administrativas, incluindo advertência, multa nas hipóteses legais, publicização, bloqueio e eliminação, entre outras. Consulte os artigos 5º a 20, 37 a 49 e 52 da lei para detalhes e exceções. Exemplo resolvido · Base legal e minimização O banco coleta CPF e documentos necessários para cumprir obrigação de identificação. Não precisa forçar consentimento genérico se a base adequada for obrigação legal/regulatória. Coletar dados de saúde sem relação com a finalidade viola minimização, salvo justificativa e base específica aplicável. Cada finalidade deve ter fundamento."}, {"title": "LGPD aplicada a bancos e decisões automatizadas", "html": "<p>Cadastro exige dados proporcionais à identificação e à execução do\nserviço. Análise de crédito pode usar proteção do crédito e outras bases\npertinentes, observando transparência, qualidade e não discriminação.\nPrevenção à fraude e segurança podem justificar tratamentos específicos\nconforme base aplicável, incluindo hipóteses previstas para dados\nsensíveis em identificação/autenticação. Compartilhamento entre empresas\nexige base, finalidade, controles e respeito a sigilo bancário; não é\nlivre apenas por integrarem mesmo grupo. Mantenha registro das\noperações, política de retenção, acesso por perfil, criptografia,\ntreinamento e plano de resposta a incidentes. Incidente com risco ou\ndano relevante deve ser comunicado nos termos da LGPD e regulamentação\nda ANPD.<\/p>\n<p>Art. 20: titular pode solicitar revisão de decisão tomada unicamente\ncom base em tratamento automatizado de dados pessoais que afete\ninteresses, inclusive perfil de crédito. Controlador deve fornecer\ninformações claras sobre critérios e procedimentos quando solicitado,\nrespeitados segredos comercial e industrial conforme lei. O artigo não\nimpõe genericamente revisão por pessoa natural em todos os casos.\nSistemas devem ser avaliados quanto a vieses e erros.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Crédito negado automaticamente<\/strong><\/p>\n<p>Cliente tem proposta negada exclusivamente por sistema automatizado.\nEle pode solicitar revisão nos termos do art. 20. O banco deve tratar a\nsolicitação conforme legislação, informar critérios e procedimentos na\nextensão cabível, verificar dados e riscos discriminatórios, sem\ndivulgar dados de terceiros ou segredos protegidos indevidamente.<\/p>\n<\/div>\n", "id": "informatica-08", "number": 8, "examples": 1, "exercises": 0, "search": "Cadastro exige dados proporcionais à identificação e à execução do serviço. Análise de crédito pode usar proteção do crédito e outras bases pertinentes, observando transparência, qualidade e não discriminação. Prevenção à fraude e segurança podem justificar tratamentos específicos conforme base aplicável, incluindo hipóteses previstas para dados sensíveis em identificação/autenticação. Compartilhamento entre empresas exige base, finalidade, controles e respeito a sigilo bancário; não é livre ap
