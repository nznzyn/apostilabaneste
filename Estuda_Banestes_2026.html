os CNSP/Susep pertinentes. O cálculo abaixo é ilustrativo e\npressupõe franquia dedutível e dano integralmente coberto.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Franquia e indenização<\/strong><\/p>\n<p>Dano coberto de R$ 8.000, franquia de R$ 1.200 e limite de cobertura\nsuficiente. Indenização ilustrativa\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>8000<\/mn><mo>−<\/mo><mn>1200<\/mn><mo>=<\/mo><mtext mathvariant=\"normal\">R$<\/mtext><mspace width=\"0.167em\"><\/mspace><mn>6800<\/mn><\/mrow><annotation encoding=\"application/x-tex\">=8000-1200=\\text{R\\$}\\,6800<\/annotation><\/semantics><\/math>.\nO prêmio pago pelo cliente não é a franquia. Se o evento estiver\nexcluído, esse cálculo não se aplica.<\/p>\n<\/div>\n", "id": "bancarios-12", "number": 12, "examples": 1, "exercises": 0, "search": "Seguro é mecanismo de transferência de riscos delimitados mediante prêmio, com obrigação da seguradora conforme cobertura e contrato. Segurado é pessoa ou interesse protegido; estipulante contrata seguro coletivo em nome de grupo, conforme regras; beneficiário recebe prestação quando cabível; corretor intermedeia; seguradora assume riscos; resseguradora assume riscos transferidos pela seguradora. Apólice ou documento contratual formaliza condições; sinistro é ocorrência de evento coberto; indenização ou capital segurado é prestação prevista; franquia é parcela suportada pelo segurado em coberturas aplicáveis; carência é intervalo durante o qual determinada cobertura não produz efeito, quando permitido; exclusão delimita risco não coberto. Vigência é período de cobertura. Mutualismo distribui perdas entre participantes mediante técnica atuarial; boa-fé e informações relevantes sustentam avaliação do risco; indenização nos seguros de danos em regra recompõe prejuízo coberto até os limites, sem enriquecimento indevido; seguros de pessoas seguem lógica de capital/benefício pactuado. A Lei 15.040/2024 estabelece normas de seguro privado e entrou em vigor em dezembro de 2025; consulte também atos CNSP/Susep pertinentes. O cálculo abaixo é ilustrativo e pressupõe franquia dedutível e dano integralmente coberto. Exemplo resolvido · Franquia e indenização Dano coberto de R$ 8.000, franquia de R$ 1.200 e limite de cobertura suficiente. Indenização ilustrativa = 8000 − 1200 = R$ 6800 =8000-1200=\\text{R\\$}\\,6800 . O prêmio pago pelo cliente não é a franquia. Se o evento estiver excluído, esse cálculo não se aplica."}, {"title": "Modalidades de seguros pessoais e empresariais", "html": "<p>Seguro de vida pode cobrir morte e outras garantias contratadas, como\ninvalidez; acidentes pessoais cobre riscos acidentais definidos;\nprestamista pode amortizar ou quitar dívida em eventos cobertos,\nrespeitando condições. Seguro residencial protege patrimônio em riscos\ndefinidos (incêndio, danos elétricos etc., conforme apólice); automóvel\npode incluir casco, responsabilidade civil e assistência; empresarial\npode cobrir instalações, equipamentos, estoques, responsabilidade civil\ne interrupção de negócios, se contratados. Seguro de responsabilidade\ncivil protege contra consequências de danos a terceiros nos termos da\ncobertura. Seguro garantia protege interesse do segurado quanto ao\ncumprimento de obrigação pelo tomador conforme contrato.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Adequação do seguro<\/strong><\/p>\n<p>Uma família depende da renda de uma pessoa e deseja proteção para\nseus dependentes em caso de morte. Seguro de vida é mais diretamente\nrelacionado a essa finalidade do que título de capitalização. Verifique\ncapital segurado, beneficiários, exclusões, custo e necessidades\nfamiliares.<\/p>\n<\/div>\n", "id": "bancarios-13", "number": 13, "examples": 1, "exercises": 0, "search": "Seguro de vida pode cobrir morte e outras garantias contratadas, como invalidez; acidentes pessoais cobre riscos acidentais definidos; prestamista pode amortizar ou quitar dívida em eventos cobertos, respeitando condições. Seguro residencial protege patrimônio em riscos definidos (incêndio, danos elétricos etc., conforme apólice); automóvel pode incluir casco, responsabilidade civil e assistência; empresarial pode cobrir instalações, equipamentos, estoques, responsabilidade civil e interrupção de negócios, se contratados. Seguro de responsabilidade civil protege contra consequências de danos a terceiros nos termos da cobertura. Seguro garantia protege interesse do segurado quanto ao cumprimento de obrigação pelo tomador conforme contrato. Exemplo resolvido · Adequação do seguro Uma família depende da renda de uma pessoa e deseja proteção para seus dependentes em caso de morte. Seguro de vida é mais diretamente relacionado a essa finalidade do que título de capitalização. Verifique capital segurado, beneficiários, exclusões, custo e necessidades familiares."}, {"title": "Previdência complementar aberta: PGBL e VGBL", "html": "<p>Previdência complementar aberta permite planejamento de longo prazo\ncom aportes, acumulação e recebimento futuro ou resgate conforme plano.\nÉ distinta da previdência social e da previdência complementar fechada,\ndestinada a grupos vinculados. Planos abertos são operados por entidades\nautorizadas e supervisionadas pela Susep. Durante acumulação, recursos\nde planos de contribuição variável acompanham a carteira vinculada, sem\ngarantia geral de rentabilidade mínima no PGBL/VGBL. Avalie taxa de\nadministração, carregamento quando houver, regime tributário,\nportabilidade, prazo e forma de benefício.<\/p>\n<p>PGBL (Plano Gerador de Benefício Livre) é previdência aberta. Para\ncontribuinte que atende requisitos legais e usa deduções legais,\ncontribuições podem ser dedutíveis até 12% da renda bruta tributável\nanual, observadas condições; IR no resgate incide sobre o valor\ntributável total. VGBL (Vida Gerador de Benefício Livre) é seguro de\npessoas com cobertura por sobrevivência; aportes não geram aquela\ndedução, e IR no resgate incide sobre rendimentos. Regimes progressivo e\nregressivo possuem regras distintas; a Lei 14.803/2024 permite escolha\nem momento legalmente previsto de obtenção de benefício ou primeiro\nresgate, conforme regras. Não confunda benefício fiscal com isenção\ndefinitiva.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Base de imposto<\/strong><\/p>\n<p>Uma pessoa aportou R$ 30.000 e possui R$ 40.000 no plano. Em resgate\nintegral ilustrativo, no PGBL a base de IR é R$ 40.000; no VGBL, R$\n10.000 de rendimentos. A alíquota dependerá do regime e condições. Não\nconclua qual é melhor sem analisar o benefício fiscal anterior e o\nperfil.<\/p>\n<\/div>\n", "id": "bancarios-14", "number": 14, "examples": 1, "exercises": 0, "search": "Previdência complementar aberta permite planejamento de longo prazo com aportes, acumulação e recebimento futuro ou resgate conforme plano. É distinta da previdência social e da previdência complementar fechada, destinada a grupos vinculados. Planos abertos são operados por entidades autorizadas e supervisionadas pela Susep. Durante acumulação, recursos de planos de contribuição variável acompanham a carteira vinculada, sem garantia geral de rentabilidade mínima no PGBL/VGBL. Avalie taxa de administração, carregamento quando houver, regime tributário, portabilidade, prazo e forma de benefício. PGBL (Plano Gerador de Benefício Livre) é previdência aberta. Para contribuinte que atende requisitos legais e usa deduções legais, contribuições podem ser dedutíveis até 12% da renda bruta tributável anual, observadas condições; IR no resgate incide sobre o valor tributável total. VGBL (Vida Gerador de Benefício Livre) é seguro de pessoas com cobertura por sobrevivência; aportes não geram aquela dedução, e IR no resgate incide sobre rendimentos. Regimes progressivo e regressivo possuem regras distintas; a Lei 14.803/2024 permite escolha em momento legalmente previsto de obtenção de benefício ou primeiro resgate, conforme regras. Não confunda benefício fiscal com isenção definitiva. Exemplo resolvido · Base de imposto Uma pessoa aportou R$ 30.000 e possui R$ 40.000 no plano. Em resgate integral ilustrativo, no PGBL a base de IR é R$ 40.000; no VGBL, R$ 10.000 de rendimentos. A alíquota dependerá do regime e condições. Não conclua qual é melhor sem analisar o benefício fiscal anterior e o perfil."}, {"title": "Títulos de capitalização", "html": "<p>Título de capitalização é produto regulado por CNSP e supervisionado\npela Susep. Pagamentos podem ser divididos em quota de capitalização, de\nsorteio e de carregamento, conforme condições. A primeira forma o\ncapital resgatável; a de sorteio financia premiações; a de carregamento\ncusteia operação. Pode haver pagamento único, mensal ou periódico. O\nresgate antecipado pode ser inferior ao total pago; o sorteio não\ngarante prêmio. Modalidades incluem tradicional, popular, incentivo,\ncompra programada, instrumento de garantia e filantropia premiável,\nconforme regras. Não é poupança nem investimento de alta rentabilidade\npor definição.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Composição de pagamento<\/strong><\/p>\n<p>Em título hipotético, R$ 100 mensais são divididos em R$ 70 de\ncapitalização, R$ 20 de sorteio e R$ 10 de carregamento. Apenas R$ 70\nsão destinados diretamente à formação do capital naquele pagamento. Não\né correto supor que todos os R$ 100 rendem como depósito de\npoupança.<\/p>\n<\/div>\n", "id": "bancarios-15", "number": 15, "examples": 1, "exercises": 0, "search": "Título de capitalização é produto regulado por CNSP e supervisionado pela Susep. Pagamentos podem ser divididos em quota de capitalização, de sorteio e de carregamento, conforme condições. A primeira forma o capital resgatável; a de sorteio financia premiações; a de carregamento custeia operação. Pode haver pagamento único, mensal ou periódico. O resgate antecipado pode ser inferior ao total pago; o sorteio não garante prêmio. Modalidades incluem tradicional, popular, incentivo, compra programada, instrumento de garantia e filantropia premiável, conforme regras. Não é poupança nem investimento de alta rentabilidade por definição. Exemplo resolvido · Composição de pagamento Em título hipotético, R$ 100 mensais são divididos em R$ 70 de capitalização, R$ 20 de sorteio e R$ 10 de carregamento. Apenas R$ 70 são destinados diretamente à formação do capital naquele pagamento. Não é correto supor que todos os R$ 100 rendem como depósito de poupança."}, {"title": "Bancassurance, consórcio e portabilidade", "html": "<p>Bancassurance integra distribuição bancária com seguros, previdência\ne capitalização, usando relacionamento e canais do banco. Pode aumentar\nconveniência, mas exige adequação, liberdade de escolha, clareza sobre\nfornecedor e condições e prevenção de conflito de interesses. Banco\ndistribuidor, corretora e seguradora exercem funções distintas.<\/p>\n<p>Consórcio é grupo de autofinanciamento administrado por empresa\nautorizada pelo BCB (Lei 11.795/2008). Participantes contribuem para\nfundo comum; contemplação por sorteio ou lance dá acesso ao crédito\nconforme contrato, disponibilidade de recursos e demais requisitos. Há\ntaxa de administração e possivelmente fundo de reserva, seguros e\natualizações contratuais. Não é empréstimo tradicional e não garante\ncontemplação imediata. Ausência de juros remuneratórios típicos de\nfinanciamento não significa custo zero.<\/p>\n<p>Portabilidade transfere operação ou serviço nas modalidades\nreguladas, sem confundir com resgate. No crédito, possibilita\ntransferência de dívida a outra instituição mediante procedimentos\npróprios; compare CET e condições. Na conta-salário, transfere créditos\nsalariais para conta indicada segundo regras. Na previdência aberta,\npermite transferir reservas entre planos compatíveis, observadas regras,\nsem entregar dinheiro ao participante como resgate; não se deve presumir\nportabilidade entre PGBL e VGBL.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Consórcio ou financiamento?<\/strong><\/p>\n<p>Cliente necessita de veículo nesta semana. Consórcio não assegura\ncontemplação imediata; financiamento pode viabilizar compra imediata se\naprovado, mas terá custo e obrigações. O atendente deve explicar as\nalternativas em vez de afirmar que consórcio é sempre melhor por não\ncobrar juros típicos.<\/p>\n<\/div>\n", "id": "bancarios-16", "number": 16, "examples": 1, "exercises": 0, "search": "Bancassurance integra distribuição bancária com seguros, previdência e capitalização, usando relacionamento e canais do banco. Pode aumentar conveniência, mas exige adequação, liberdade de escolha, clareza sobre fornecedor e condições e prevenção de conflito de interesses. Banco distribuidor, corretora e seguradora exercem funções distintas. Consórcio é grupo de autofinanciamento administrado por empresa autorizada pelo BCB (Lei 11.795/2008). Participantes contribuem para fundo comum; contemplação por sorteio ou lance dá acesso ao crédito conforme contrato, disponibilidade de recursos e demais requisitos. Há taxa de administração e possivelmente fundo de reserva, seguros e atualizações contratuais. Não é empréstimo tradicional e não garante contemplação imediata. Ausência de juros remuneratórios típicos de financiamento não significa custo zero. Portabilidade transfere operação ou serviço nas modalidades reguladas, sem confundir com resgate. No crédito, possibilita transferência de dívida a outra instituição mediante procedimentos próprios; compare CET e condições. Na conta-salário, transfere créditos salariais para conta indicada segundo regras. Na previdência aberta, permite transferir reservas entre planos compatíveis, observadas regras, sem entregar dinheiro ao participante como resgate; não se deve presumir portabilidade entre PGBL e VGBL. Exemplo resolvido · Consórcio ou financiamento? Cliente necessita de veículo nesta semana. Consórcio não assegura contemplação imediata; financiamento pode viabilizar compra imediata se aprovado, mas terá custo e obrigações. O atendente deve explicar as alternativas em vez de afirmar que consórcio é sempre melhor por não cobrar juros típicos."}, {"title": "Resolução CMN nº 4.966/2021: instrumentos financeiros", "html": "<p>A resolução estabelece conceitos e critérios contábeis de\ninstrumentos financeiros e relações de proteção (hedge) para\ninstituições abrangidas. O núcleo do novo tratamento entrou em vigor em\n2025, com regras de transição e alterações posteriores. Leia a versão\nconsolidada do BCB; as sínteses seguintes são conceituais e não\nsubstituem artigos, exceções e regras específicas.<\/p>\n<p>Instrumento financeiro é contrato que gera ativo financeiro para uma\nentidade e passivo financeiro ou instrumento patrimonial para outra.\nExemplo: empréstimo gera direito de receber para credor e obrigação de\npagar para devedor. Reconhecimento inicial ocorre quando a instituição\nse torna parte das disposições contratuais; desreconhecimento depende da\nextinção ou transferência que cumpra os critérios. Mensuração depende\ndas características e classificação do instrumento.<\/p>\n<p>As categorias centrais de ativos financeiros são custo amortizado,\nvalor justo em outros resultados abrangentes (VJORA) e valor justo no\nresultado (VJR). A classificação considera o modelo de negócios para\ngerir o ativo e as características dos fluxos contratuais (pagamentos de\nprincipal e juros, quando aplicável). Custo amortizado aplica método da\ntaxa efetiva, considerando amortização e, quando pertinente, perdas\nesperadas. Valor justo representa preço de saída numa transação não\nforçada entre participantes do mercado na data de mensuração. VJORA e\nVJR diferem pelo reconhecimento das variações segundo regras da\ncategoria. A contabilidade de hedge busca refletir relações de proteção\nelegíveis e documentadas; não significa eliminar todos os riscos.<\/p>\n<p>O modelo de perdas esperadas reconhece provisão associada ao risco de\ncrédito sem esperar a perda efetivamente ocorrer. A avaliação incorpora\ninformações razoáveis e sustentáveis, históricas, atuais e prospectivas.\nDe forma didática, os três estágios correspondem a: (1) risco de crédito\nsem aumento significativo desde reconhecimento inicial, com horizonte de\nperda esperada de 12 meses (ou vida remanescente menor); (2) aumento\nsignificativo de risco, com perda esperada para vida do instrumento; (3)\nativo com problema de recuperação de crédito, com perda esperada apurada\nconsiderando a existência de problema de recuperação de crédito. Existem\ncritérios específicos, exceções e metodologias regulamentares; verifique\ndiretamente os arts. aplicáveis, inclusive tratamento de ativos\nadquiridos ou originados com problema de recuperação.<\/p>\n<p>Um modelo simplificado de risco usa\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mi>D<\/mi><\/mrow><annotation encoding=\"application/x-tex\">PD<\/annotation><\/semantics><\/math>\n(probabilidade de inadimplência),\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L<\/mi><mi>G<\/mi><mi>D<\/mi><\/mrow><annotation encoding=\"application/x-tex\">LGD<\/annotation><\/semantics><\/math>\n(fração perdida dado inadimplemento) e\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E<\/mi><mi>A<\/mi><mi>D<\/mi><\/mrow><annotation encoding=\"application/x-tex\">EAD<\/annotation><\/semantics><\/math>\n(exposição no inadimplemento):\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mi>E<\/mi><mo>≈<\/mo><mi>P<\/mi><mi>D<\/mi><mspace width=\"0.167em\"><\/mspace><mi>L<\/mi><mi>G<\/mi><mi>D<\/mi><mspace width=\"0.167em\"><\/mspace><mi>E<\/mi><mi>A<\/mi><mi>D<\/mi><\/mrow><annotation encoding=\"application/x-tex\">PE\\approx PD\\,LGD\\,EAD<\/annotation><\/semantics><\/math>.\nA provisão regulatória real exige critérios, horizontes, projeções e\ndesconto apropriados; a expressão não é fórmula universal da\nresolução.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Perda esperada didática<\/strong><\/p>\n<p>Exposição de R$ 100.000, probabilidade de inadimplência de 4% e perda\ncondicional de 50%.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mi>E<\/mi><mo>=<\/mo><mn>100000<\/mn><mo>⋅<\/mo><mn>0<\/mn><mo>,<\/mo><mn>04<\/mn><mo>⋅<\/mo><mn>0<\/mn><mo>,<\/mo><mn>50<\/mn><mo>=<\/mo><mtext mathvariant=\"normal\">R$<\/mtext><mspace width=\"0.167em\"><\/mspace><mn>2000<\/mn><\/mrow><annotation encoding=\"application/x-tex\">PE=100000\\cdot0{,}04\\cdot0{,}50=\\text{R\\$}\\,2000<\/annotation><\/semantics><\/math>.\nSe a probabilidade sobe para 8%, mantidas outras hipóteses, a perda\nesperada dobra. O banco não precisa aguardar inadimplência efetiva para\navaliar a perda esperada.<\/p>\n<\/div>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Classificação conceitual<\/strong><\/p>\n<p>Uma instituição mantém ativo de dívida exclusivamente para receber\nfluxos contratuais de principal e juros, e os fluxos satisfazem os\ncritérios pertinentes. Custo amortizado pode ser a classificação\napropriada. Uma carteira de negociação tende a valor justo no resultado.\nA intenção isolada de manter um ativo não basta se os demais critérios\nnão forem atendidos.<\/p>\n<\/div>\n<div class=\"notice\">\n<p><strong>Atenção na prova.<\/strong> A Resolução 4.966/2021 é mencionada\nnominalmente no edital. Leia conceitos, classificação, reconhecimento,\nmensuração, perdas esperadas e disposições sobre hedge no normativo\nconsolidado; confira as modificações vigentes, inclusive Resoluções CMN\n5.100/2023 e 5.244/2025 quando pertinentes.<\/p>\n<\/div>\n", "id": "bancarios-17", "number": 17, "examples": 2, "exercises": 0, "search": "A resolução estabelece conceitos e critérios contábeis de instrumentos financeiros e relações de proteção (hedge) para instituições abrangidas. O núcleo do novo tratamento entrou em vigor em 2025, com regras de transição e alterações posteriores. Leia a versão consolidada do BCB; as sínteses seguintes são conceituais e não substituem artigos, exceções e regras específicas. Instrumento financeiro é contrato que gera ativo financeiro para uma entidade e passivo financeiro ou instrumento patrimonial para outra. Exemplo: empréstimo gera direito de receber para credor e obrigação de pagar para devedor. Reconhecimento inicial ocorre quando a instituição se torna parte das disposições contratuais; desreconhecimento depende da extinção ou transferência que cumpra os critérios. Mensuração depende das características e classificação do instrumento. As categorias centrais de ativos financeiros são custo amortizado, valor justo em outros resultados abrangentes (VJORA) e valor justo no resultado (VJR). A classificação considera o modelo de negócios para gerir o ativo e as características dos fluxos contratuais (pagamentos de principal e juros, quando aplicável). Custo amortizado aplica método da taxa efetiva, considerando amortização e, quando pertinente, perdas esperadas. Valor justo representa preço de saída numa transação não forçada entre participantes do mercado na data de mensuração. VJORA e VJR diferem pelo reconhecimento das variações segundo regras da categoria. A contabilidade de hedge busca refletir relações de proteção elegíveis e documentadas; não significa eliminar todos os riscos. O modelo de perdas esperadas reconhece provisão associada ao risco de crédito sem esperar a perda efetivamente ocorrer. A avaliação incorpora informações razoáveis e sustentáveis, históricas, atuais e prospectivas. De forma didática, os três estágios correspondem a: (1) risco de crédito sem aumento significativo desde reconhecimento inicial, com horizonte de perda esperada de 12 meses (ou vida remanescente menor); (2) aumento significativo de risco, com perda esperada para vida do instrumento; (3) ativo com problema de recuperação de crédito, com perda esperada apurada considerando a existência de problema de recuperação de crédito. Existem critérios específicos, exceções e metodologias regulamentares; verifique diretamente os arts. aplicáveis, inclusive tratamento de ativos adquiridos ou originados com problema de recuperação. Um modelo simplificado de risco usa P D PD (probabilidade de inadimplência), L G D LGD (fração perdida dado inadimplemento) e E A D EAD (exposição no inadimplemento): P E ≈ P D L G D E A D PE\\approx PD\\,LGD\\,EAD . A provisão regulatória real exige critérios, horizontes, projeções e desconto apropriados; a expressão não é fórmula universal da resolução. Exemplo resolvido · Perda esperada didática Exposição de R$ 100.000, probabilidade de inadimplência de 4% e perda condicional de 50%. P E = 100000 ⋅ 0 , 04 ⋅ 0 , 50 = R$ 2000 PE=100000\\cdot0{,}04\\cdot0{,}50=\\text{R\\$}\\,2000 . Se a probabilidade sobe para 8%, mantidas outras hipóteses, a perda esperada dobra. O banco não precisa aguardar inadimplência efetiva para avaliar a perda esperada. Exemplo resolvido · Classificação conceitual Uma instituição mantém ativo de dívida exclusivamente para receber fluxos contratuais de principal e juros, e os fluxos satisfazem os critérios pertinentes. Custo amortizado pode ser a classificação apropriada. Uma carteira de negociação tende a valor justo no resultado. A intenção isolada de manter um ativo não basta se os demais critérios não forem atendidos. Atenção na prova. A Resolução 4.966/2021 é mencionada nominalmente no edital. Leia conceitos, classificação, reconhecimento, mensuração, perdas esperadas e disposições sobre hedge no normativo consolidado; confira as modificações vigentes, inclusive Resoluções CMN 5.100/2023 e 5.244/2025 quando pertinentes."}, {"title": "Fixação comentada", "html": "<div class=\"exercise\">\n<p><strong>Questão 1.<\/strong> Quem supervisiona administradoras de\nconsórcio?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Banco Central do Brasil, não Susep.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 2.<\/strong> Uma ação é garantida pelo FGC?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não; participação acionária envolve risco\nde mercado.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 3.<\/strong> O Coaf condena criminalmente envolvidos em\nlavagem?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não; sua função é inteligência financeira\nnos termos legais.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 4.<\/strong> Seguro de vida e título de capitalização\ntêm finalidade idêntica?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não. Seguro protege contra riscos\ncontratados; capitalização forma capital e pode envolver sorteios.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 5.<\/strong> Uma seguradora cobra prêmio de R$ 90. O\nsegurado sempre recebe R$ 90 após sinistro?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não; prêmio é preço do seguro. A prestação\nsegue capital, cobertura e condições.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 6.<\/strong> Em empréstimo de taxa prefixada, a\nexistência de garantia elimina risco de crédito?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não. Pode reduzir a perda em caso de\ninadimplência.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 7.<\/strong> A provisão de perda esperada exige\ninadimplência consumada?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não, o modelo é prospectivo.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 8.<\/strong> Qual a diferença entre portabilidade de\nprevidência e resgate?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Portabilidade transfere recursos entre\nplanos elegíveis; resgate entrega recursos ao titular e tem\nconsequências próprias.<\/p><\/details>\n<\/div>\n", "id": "bancarios-18", "number": 18, "examples": 0, "exercises": 8, "search": "Questão 1. Quem supervisiona administradoras de consórcio? Ver resposta comentada Banco Central do Brasil, não Susep. Questão 2. Uma ação é garantida pelo FGC? Ver resposta comentada Não; participação acionária envolve risco de mercado. Questão 3. O Coaf condena criminalmente envolvidos em lavagem? Ver resposta comentada Não; sua função é inteligência financeira nos termos legais. Questão 4. Seguro de vida e título de capitalização têm finalidade idêntica? Ver resposta comentada Não. Seguro protege contra riscos contratados; capitalização forma capital e pode envolver sorteios. Questão 5. Uma seguradora cobra prêmio de R$ 90. O segurado sempre recebe R$ 90 após sinistro? Ver resposta comentada Não; prêmio é preço do seguro. A prestação segue capital, cobertura e condições. Questão 6. Em empréstimo de taxa prefixada, a existência de garantia elimina risco de crédito? Ver resposta comentada Não. Pode reduzir a perda em caso de inadimplência. Questão 7. A provisão de perda esperada exige inadimplência consumada? Ver resposta comentada Não, o modelo é prospectivo. Questão 8. Qual a diferença entre portabilidade de previdência e resgate? Ver resposta comentada Portabilidade transfere recursos entre planos elegíveis; resgate entrega recursos ao titular e tem consequências próprias."}], "id": "bancarios", "short": "Conhecimentos Bancários e Securitários", "icon": "▤", "questions": 15, "description": "Sistema financeiro, crédito, investimentos e seguros.", "group": "especificos"}, {"title": "Matemática Financeira", "intro": "", "sections": [{"title": "Conceitos iniciais e notação", "html": "<p>O dinheiro possui valor no tempo devido à oportunidade de rendimento,\ninflação e risco. Capital\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C<\/mi><annotation encoding=\"application/x-tex\">C<\/annotation><\/semantics><\/math>\nou valor presente\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">VP<\/annotation><\/semantics><\/math>\né a quantia inicial; montante\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math>\nou valor futuro\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mi>F<\/mi><\/mrow><annotation encoding=\"application/x-tex\">VF<\/annotation><\/semantics><\/math>\né a final; juros\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>J<\/mi><mo>=<\/mo><mi>M<\/mi><mo>−<\/mo><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">J=M-C<\/annotation><\/semantics><\/math>;\ntaxa\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>i<\/mi><annotation encoding=\"application/x-tex\">i<\/annotation><\/semantics><\/math>\ndeve estar na forma decimal e na mesma unidade temporal que o número de\nperíodos\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><annotation encoding=\"application/x-tex\">n<\/annotation><\/semantics><\/math>.\nExemplo: 2% ao mês = 0,02 ao mês. Razão, proporção e porcentagem seguem\no capítulo 2. Em um fluxo de caixa, entradas e saídas recebem sinais\nopostos e devem ser comparadas na mesma data focal.<\/p>\n", "id": "financeira-01", "number": 1, "examples": 0, "exercises": 0, "search": "O dinheiro possui valor no tempo devido à oportunidade de rendimento, inflação e risco. Capital C C ou valor presente V P VP é a quantia inicial; montante M M ou valor futuro V F VF é a final; juros J = M − C J=M-C ; taxa i i deve estar na forma decimal e na mesma unidade temporal que o número de períodos n n . Exemplo: 2% ao mês = 0,02 ao mês. Razão, proporção e porcentagem seguem o capítulo 2. Em um fluxo de caixa, entradas e saídas recebem sinais opostos e devem ser comparadas na mesma data focal."}, {"title": "Juros simples", "html": "<p>No regime simples, juros incidem sempre sobre o capital original. A\ncada período, o acréscimo é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>i<\/mi><\/mrow><annotation encoding=\"application/x-tex\">Ci<\/annotation><\/semantics><\/math>,\nentão\n<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>J<\/mi><mo>=<\/mo><mi>C<\/mi><mi>i<\/mi><mi>n<\/mi><mo>,<\/mo><mspace width=\"2.0em\"><\/mspace><mi>M<\/mi><mo>=<\/mo><mi>C<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mi>n<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">J=Cin,\\qquad M=C(1+in).<\/annotation><\/semantics><\/math>\nO crescimento é linear. Para encontrar taxa,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>i<\/mi><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>M<\/mi><mi>/<\/mi><mi>C<\/mi><mo>−<\/mo><mn>1<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">i=(M/C-1)/n<\/annotation><\/semantics><\/math>;\npara prazo,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>M<\/mi><mi>/<\/mi><mi>C<\/mi><mo>−<\/mo><mn>1<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mi>i<\/mi><\/mrow><annotation encoding=\"application/x-tex\">n=(M/C-1)/i<\/annotation><\/semantics><\/math>.\nTaxa e período devem ser compatíveis. Se o enunciado adota mês comercial\nde 30 dias, 45 dias equivalem a 1,5 mês; não suponha essa convenção\nquando houver outra indicada.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Capitalização simples<\/strong><\/p>\n<p>Aplicação de R$ 4.000, 2,5% a.m., durante 6 meses.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>J<\/mi><mo>=<\/mo><mn>4000<\/mn><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>025<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>6<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>600<\/mn><\/mrow><annotation encoding=\"application/x-tex\">J=4000(0{,}025)(6)=600<\/annotation><\/semantics><\/math>.\nMontante\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mo>=<\/mo><mn>4000<\/mn><mo>+<\/mo><mn>600<\/mn><mo>=<\/mo><mtext mathvariant=\"normal\">R$<\/mtext><mspace width=\"0.167em\"><\/mspace><mn>4600<\/mn><\/mrow><annotation encoding=\"application/x-tex\">M=4000+600=\\text{R\\$}\\,4600<\/annotation><\/semantics><\/math>.\nO ganho é R$ 100 a cada mês.<\/p>\n<\/div>\n", "id": "financeira-02", "number": 2, "examples": 1, "exercises": 0, "search": "No regime simples, juros incidem sempre sobre o capital original. A cada período, o acréscimo é C i Ci , então J = C i n , M = C ( 1 + i n ) . J=Cin,\\qquad M=C(1+in). O crescimento é linear. Para encontrar taxa, i = ( M / C − 1 ) / n i=(M/C-1)/n ; para prazo, n = ( M / C − 1 ) / i n=(M/C-1)/i . Taxa e período devem ser compatíveis. Se o enunciado adota mês comercial de 30 dias, 45 dias equivalem a 1,5 mês; não suponha essa convenção quando houver outra indicada. Exemplo resolvido · Capitalização simples Aplicação de R$ 4.000, 2,5% a.m., durante 6 meses. J = 4000 ( 0 , 025 ) ( 6 ) = 600 J=4000(0{,}025)(6)=600 . Montante M = 4000 + 600 = R$ 4600 M=4000+600=\\text{R\\$}\\,4600 . O ganho é R$ 100 a cada mês."}, {"title": "Juros compostos", "html": "<p>No regime composto, juros incorporam-se ao saldo e também rendem\njuros. Após um período\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">C(1+i)<\/annotation><\/semantics><\/math>;\napós dois,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><annotation encoding=\"application/x-tex\">C(1+i)^2<\/annotation><\/semantics><\/math>;\nem geral,\n<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mo>=<\/mo><mi>C<\/mi><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>n<\/mi><\/msup><mo>,<\/mo><mspace width=\"1.0em\"><\/mspace><mi>J<\/mi><mo>=<\/mo><mi>C<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">[<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>n<\/mi><\/msup><mo>−<\/mo><mn>1<\/mn><mo form=\"postfix\" stretchy=\"true\">]<\/mo><\/mrow><mo>,<\/mo><mspace width=\"1.0em\"><\/mspace><mi>C<\/mi><mo>=<\/mo><mfrac><mi>M<\/mi><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>n<\/mi><\/msup><\/mfrac><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">M=C(1+i)^n,\\quad J=C[(1+i)^n-1],\\quad C=\\frac{M}{(1+i)^n}.<\/annotation><\/semantics><\/math>\nIsolando\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>i<\/mi><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>M<\/mi><mi>/<\/mi><mi>C<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mn>1<\/mn><mi>/<\/mi><mi>n<\/mi><\/mrow><\/msup><mo>−<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">i=(M/C)^{1/n}-1<\/annotation><\/semantics><\/math>;\npara prazo\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mo>ln<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>M<\/mi><mi>/<\/mi><mi>C<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mo>ln<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">n=\\ln(M/C)/\\ln(1+i)<\/annotation><\/semantics><\/math>,\nquando aplicável. Em prova sem calculadora, procure potências conhecidas\ne aproximações fornecidas.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Composição de juros<\/strong><\/p>\n<p>R$ 5.000 a 2% a.m. por 3 meses. Fator\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>,<\/mo><msup><mn>02<\/mn><mn>3<\/mn><\/msup><mo>=<\/mo><mn>1<\/mn><mo>,<\/mo><mn>061208<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1{,}02^3=1{,}061208<\/annotation><\/semantics><\/math>.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mo>=<\/mo><mn>5306<\/mn><mo>,<\/mo><mn>04<\/mn><\/mrow><annotation encoding=\"application/x-tex\">M=5306{,}04<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>J<\/mi><mo>=<\/mo><mn>306<\/mn><mo>,<\/mo><mn>04<\/mn><\/mrow><annotation encoding=\"application/x-tex\">J=306{,}04<\/annotation><\/semantics><\/math>.\nEm simples,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>J<\/mi><mo>=<\/mo><mn>5000<\/mn><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>02<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>3<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>300<\/mn><\/mrow><annotation encoding=\"application/x-tex\">J=5000(0{,}02)(3)=300<\/annotation><\/semantics><\/math>.\nDiferença de R$ 6,04 representa juros sobre juros.<\/p>\n<\/div>\n", "id": "financeira-03", "number": 3, "examples": 1, "exercises": 0, "search": "No regime composto, juros incorporam-se ao saldo e também rendem juros. Após um período C ( 1 + i ) C(1+i) ; após dois, C ( 1 + i ) 2 C(1+i)^2 ; em geral, M = C ( 1 + i ) n , J = C [ ( 1 + i ) n − 1 ] , C = M ( 1 + i ) n . M=C(1+i)^n,\\quad J=C[(1+i)^n-1],\\quad C=\\frac{M}{(1+i)^n}. Isolando i = ( M / C ) 1 / n − 1 i=(M/C)^{1/n}-1 ; para prazo n = ln ( M / C ) / ln ( 1 + i ) n=\\ln(M/C)/\\ln(1+i) , quando aplicável. Em prova sem calculadora, procure potências conhecidas e aproximações fornecidas. Exemplo resolvido · Composição de juros R$ 5.000 a 2% a.m. por 3 meses. Fator 1 , 02 3 = 1 , 061208 1{,}02^3=1{,}061208 . M = 5306 , 04 M=5306{,}04 , J = 306 , 04 J=306{,}04 . Em simples, J = 5000 ( 0 , 02 ) ( 3 ) = 300 J=5000(0{,}02)(3)=300 . Diferença de R$ 6,04 representa juros sobre juros."}, {"title": "Taxas nominais, efetivas, proporcionais e equivalentes", "html": "<p>Taxas proporcionais se relacionam linearmente: 2% a.m. é proporcional\na 24% a.a. Taxas equivalentes geram o mesmo montante no mesmo intervalo.\nNo composto, se\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>m<\/mi><annotation encoding=\"application/x-tex\">m<\/annotation><\/semantics><\/math>\nperíodos menores equivalem a um maior,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>+<\/mo><msub><mi>i<\/mi><mrow><mi>m<\/mi><mi>a<\/mi><mi>i<\/mi><mi>o<\/mi><mi>r<\/mi><\/mrow><\/msub><mo>=<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><msub><mi>i<\/mi><mrow><mi>m<\/mi><mi>e<\/mi><mi>n<\/mi><mi>o<\/mi><mi>r<\/mi><\/mrow><\/msub><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>m<\/mi><\/msup><\/mrow><annotation encoding=\"application/x-tex\">1+i_{maior}=(1+i_{menor})^m<\/annotation><\/semantics><\/math>.\nUma taxa nominal anual de 24% com capitalização mensal tem taxa\nperiódica proporcional de 2% a.m. e efetiva anual de\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>,<\/mo><msup><mn>02<\/mn><mn>12<\/mn><\/msup><mo>−<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1{,}02^{12}-1<\/annotation><\/semantics><\/math>.\nA taxa efetiva corresponde ao período de capitalização ou resultado\nefetivo no intervalo considerado.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Conversão de taxa<\/strong><\/p>\n<p>Taxa nominal de 24% a.a. capitalizada mensalmente. Divida por 12:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>i<\/mi><mi>m<\/mi><\/msub><mo>=<\/mo><mn>2<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">i_m=2\\%<\/annotation><\/semantics><\/math>.\nLogo\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>i<\/mi><mi>a<\/mi><\/msub><mo>=<\/mo><mn>1<\/mn><mo>,<\/mo><msup><mn>02<\/mn><mn>12<\/mn><\/msup><mo>−<\/mo><mn>1<\/mn><mo>≈<\/mo><mn>26<\/mn><mo>,<\/mo><mn>824<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">i_a=1{,}02^{12}-1\\approx26{,}824\\%<\/annotation><\/semantics><\/math>.\nNão use 24% como taxa efetiva anual. Se taxa efetiva anual for 24%, a\nmensal equivalente será\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>,<\/mo><msup><mn>24<\/mn><mrow><mn>1<\/mn><mi>/<\/mi><mn>12<\/mn><\/mrow><\/msup><mo>−<\/mo><mn>1<\/mn><mo>≈<\/mo><mn>1<\/mn><mo>,<\/mo><mn>809<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">1{,}24^{1/12}-1\\approx1{,}809\\%<\/annotation><\/semantics><\/math>.<\/p>\n<\/div>\n", "id": "financeira-04", "number": 4, "examples": 1, "exercises": 0, "search": "Taxas proporcionais se relacionam linearmente: 2% a.m. é proporcional a 24% a.a. Taxas equivalentes geram o mesmo montante no mesmo intervalo. No composto, se m m períodos menores equivalem a um maior, 1 + i m a i o r = ( 1 + i m e n o r ) m 1+i_{maior}=(1+i_{menor})^m . Uma taxa nominal anual de 24% com capitalização mensal tem taxa periódica proporcional de 2% a.m. e efetiva anual de 1 , 02 12 − 1 1{,}02^{12}-1 . A taxa efetiva corresponde ao período de capitalização ou resultado efetivo no intervalo considerado. Exemplo resolvido · Conversão de taxa Taxa nominal de 24% a.a. capitalizada mensalmente. Divida por 12: i m = 2 % i_m=2\\% . Logo i a = 1 , 02 12 − 1 ≈ 26 , 824 % i_a=1{,}02^{12}-1\\approx26{,}824\\% . Não use 24% como taxa efetiva anual. Se taxa efetiva anual for 24%, a mensal equivalente será 1 , 24 1 / 12 − 1 ≈ 1 , 809 % 1{,}24^{1/12}-1\\approx1{,}809\\% ."}, {"title": "Taxa real e inflação", "html": "<p>Se\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>i<\/mi><mi>n<\/mi><\/msub><annotation encoding=\"application/x-tex\">i_n<\/annotation><\/semantics><\/math>\né taxa nominal e\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>π<\/mi><annotation encoding=\"application/x-tex\">\\pi<\/annotation><\/semantics><\/math>\ninflação no mesmo período, a taxa real\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>i<\/mi><mi>r<\/mi><\/msub><annotation encoding=\"application/x-tex\">i_r<\/annotation><\/semantics><\/math>\nsatisfaz\n<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>+<\/mo><msub><mi>i<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><msub><mi>i<\/mi><mi>r<\/mi><\/msub><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>π<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>,<\/mo><mspace width=\"2.0em\"><\/mspace><msub><mi>i<\/mi><mi>r<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mn>1<\/mn><mo>+<\/mo><msub><mi>i<\/mi><mi>n<\/mi><\/msub><\/mrow><mrow><mn>1<\/mn><mo>+<\/mo><mi>π<\/mi><\/mrow><\/mfrac><mo>−<\/mo><mn>1<\/mn><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">1+i_n=(1+i_r)(1+\\pi),\\qquad i_r=\\frac{1+i_n}{1+\\pi}-1.<\/annotation><\/semantics><\/math>\nDiferença\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>i<\/mi><mi>n<\/mi><\/msub><mo>−<\/mo><mi>π<\/mi><\/mrow><annotation encoding=\"application/x-tex\">i_n-\\pi<\/annotation><\/semantics><\/math>\né aproximação quando taxas são pequenas. Uma aplicação pode ter ganho\nnominal e perda real.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Poder de compra<\/strong><\/p>\n<p>Rendimento nominal de 12% e inflação de 5% a.a.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>i<\/mi><mi>r<\/mi><\/msub><mo>=<\/mo><mn>1<\/mn><mo>,<\/mo><mn>12<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><mn>05<\/mn><mo>−<\/mo><mn>1<\/mn><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mn>066666<\/mn><mi>…<\/mi><mo>=<\/mo><mn>6<\/mn><mo>,<\/mo><mn>67<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">i_r=1{,}12/1{,}05-1=0{,}066666\\ldots=6{,}67\\%<\/annotation><\/semantics><\/math>.\nSubtrair 12-5 daria 7%, aproximação não exata.<\/p>\n<\/div>\n", "id": "financeira-05", "number": 5, "examples": 1, "exercises": 0, "search": "Se i n i_n é taxa nominal e π \\pi inflação no mesmo período, a taxa real i r i_r satisfaz 1 + i n = ( 1 + i r ) ( 1 + π ) , i r = 1 + i n 1 + π − 1 . 1+i_n=(1+i_r)(1+\\pi),\\qquad i_r=\\frac{1+i_n}{1+\\pi}-1. Diferença i n − π i_n-\\pi é aproximação quando taxas são pequenas. Uma aplicação pode ter ganho nominal e perda real. Exemplo resolvido · Poder de compra Rendimento nominal de 12% e inflação de 5% a.a. i r = 1 , 12 / 1 , 05 − 1 = 0 , 066666 … = 6 , 67 % i_r=1{,}12/1{,}05-1=0{,}066666\\ldots=6{,}67\\% . Subtrair 12-5 daria 7%, aproximação não exata."}, {"title": "Desconto simples e composto", "html": "<p>Desconto antecipa título de valor nominal\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>N<\/mi><annotation encoding=\"application/x-tex\">N<\/annotation><\/semantics><\/math>\ncom vencimento futuro; valor atual\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><annotation encoding=\"application/x-tex\">A<\/annotation><\/semantics><\/math>,\ndesconto\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D<\/mi><mo>=<\/mo><mi>N<\/mi><mo>−<\/mo><mi>A<\/mi><\/mrow><annotation encoding=\"application/x-tex\">D=N-A<\/annotation><\/semantics><\/math>.\nHá duas convenções. Desconto comercial simples (por fora) incide sobre\nnominal:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>D<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mi>N<\/mi><mi>d<\/mi><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">D_c=Ndn<\/annotation><\/semantics><\/math>\ne\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mi>N<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>d<\/mi><mi>n<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">A=N(1-dn)<\/annotation><\/semantics><\/math>.\nDesconto racional simples (por dentro) incide sobre atual:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N<\/mi><mo>=<\/mo><mi>A<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mi>n<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">N=A(1+in)<\/annotation><\/semantics><\/math>,\nportanto\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mi>N<\/mi><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mi>n<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">A=N/(1+in)<\/annotation><\/semantics><\/math>\ne\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>D<\/mi><mi>r<\/mi><\/msub><mo>=<\/mo><mi>N<\/mi><mi>i<\/mi><mi>n<\/mi><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mi>n<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">D_r=Nin/(1+in)<\/annotation><\/semantics><\/math>.\nNo desconto composto racional,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mi>N<\/mi><mi>/<\/mi><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>n<\/mi><\/msup><\/mrow><annotation encoding=\"application/x-tex\">A=N/(1+i)^n<\/annotation><\/semantics><\/math>;\nno composto comercial,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mi>N<\/mi><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>d<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>n<\/mi><\/msup><\/mrow><annotation encoding=\"application/x-tex\">A=N(1-d)^n<\/annotation><\/semantics><\/math>.\nIdentifique qual taxa e regime foram informados. Para comercial simples,\nexija condições economicamente válidas, como\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d<\/mi><mi>n<\/mi><mo>&lt;<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">dn&lt;1<\/annotation><\/semantics><\/math>\npara valor atual positivo.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Dois tipos de desconto<\/strong><\/p>\n<p>Título de R$ 10.000 antecipado 3 meses à taxa de 2% a.m. Comercial\nsimples:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>D<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mn>10000<\/mn><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>02<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>3<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>600<\/mn><\/mrow><annotation encoding=\"application/x-tex\">D_c=10000(0{,}02)(3)=600<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>A<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mn>9400<\/mn><\/mrow><annotation encoding=\"application/x-tex\">A_c=9400<\/annotation><\/semantics><\/math>.\nRacional simples:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>A<\/mi><mi>r<\/mi><\/msub><mo>=<\/mo><mn>10000<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><mn>06<\/mn><mo>≈<\/mo><mn>9433<\/mn><mo>,<\/mo><mn>96<\/mn><\/mrow><annotation encoding=\"application/x-tex\">A_r=10000/1{,}06\\approx9433{,}96<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>D<\/mi><mi>r<\/mi><\/msub><mo>≈<\/mo><mn>566<\/mn><mo>,<\/mo><mn>04<\/mn><\/mrow><annotation encoding=\"application/x-tex\">D_r\\approx566{,}04<\/annotation><\/semantics><\/math>.\nComposto racional:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mn>10000<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><msup><mn>02<\/mn><mn>3<\/mn><\/msup><mo>≈<\/mo><mn>9423<\/mn><mo>,<\/mo><mn>22<\/mn><\/mrow><annotation encoding=\"application/x-tex\">A=10000/1{,}02^3\\approx9423{,}22<\/annotation><\/semantics><\/math>.\nValores são diferentes porque as bases de incidência diferem.<\/p>\n<\/div>\n", "id": "financeira-06", "number": 6, "examples": 1, "exercises": 0, "search": "Desconto antecipa título de valor nominal N N com vencimento futuro; valor atual A A , desconto D = N − A D=N-A . Há duas convenções. Desconto comercial simples (por fora) incide sobre nominal: D c = N d n D_c=Ndn e A = N ( 1 − d n ) A=N(1-dn) . Desconto racional simples (por dentro) incide sobre atual: N = A ( 1 + i n ) N=A(1+in) , portanto A = N / ( 1 + i n ) A=N/(1+in) e D r = N i n / ( 1 + i n ) D_r=Nin/(1+in) . No desconto composto racional, A = N / ( 1 + i ) n A=N/(1+i)^n ; no composto comercial, A = N ( 1 − d ) n A=N(1-d)^n . Identifique qual taxa e regime foram informados. Para comercial simples, exija condições economicamente válidas, como d n < 1 dn<1 para valor atual positivo. Exemplo resolvido · Dois tipos de desconto Título de R$ 10.000 antecipado 3 meses à taxa de 2% a.m. Comercial simples: D c = 10000 ( 0 , 02 ) ( 3 ) = 600 D_c=10000(0{,}02)(3)=600 , A c = 9400 A_c=9400 . Racional simples: A r = 10000 / 1 , 06 ≈ 9433 , 96 A_r=10000/1{,}06\\approx9433{,}96 , D r ≈ 566 , 04 D_r\\approx566{,}04 . Composto racional: A = 10000 / 1 , 02 3 ≈ 9423 , 22 A=10000/1{,}02^3\\approx9423{,}22 . Valores são diferentes porque as bases de incidência diferem."}, {"title": "Equivalência de capitais e fluxo de caixa", "html": "<p>Capitais em datas distintas só são comparáveis após transporte para\ndata focal. No composto, valor no tempo\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>t<\/mi><mn>0<\/mn><\/msub><annotation encoding=\"application/x-tex\">t_0<\/annotation><\/semantics><\/math>\nde fluxo\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>F<\/mi><mi>t<\/mi><\/msub><annotation encoding=\"application/x-tex\">F_t<\/annotation><\/semantics><\/math>\né\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F<\/mi><mi>t<\/mi><\/msub><mi>/<\/mi><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mi>t<\/mi><mo>−<\/mo><msub><mi>t<\/mi><mn>0<\/mn><\/msub><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">F_t/(1+i)^{t-t_0}<\/annotation><\/semantics><\/math>;\nvalor futuro usa multiplicação. Valor presente líquido (VPL) é soma de\nfluxos descontados, incluindo investimento inicial com sinal negativo:\n<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mi>P<\/mi><mi>L<\/mi><mo>=<\/mo><munderover><mo>∑<\/mo><mrow><mi>t<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><mi>n<\/mi><\/munderover><mfrac><msub><mi>F<\/mi><mi>t<\/mi><\/msub><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>t<\/mi><\/msup><\/mfrac><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">VPL=\\sum_{t=0}^{n}\\frac{F_t}{(1+i)^t}.<\/annotation><\/semantics><\/math>\nPara alternativas mutuamente exclusivas, compare sob mesmas premissas de\ntaxa, horizonte, risco e valor. Um VPL positivo significa excedente à\ntaxa de desconto usada, não garantia de resultado realizado.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Pagamento à vista equivalente<\/strong><\/p>\n<p>Uma dívida de R$ 1.100 em 1 mês e R$ 1.210 em 2 meses será\nsubstituída por pagamento hoje, com taxa composta de 10% a.m.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mi>P<\/mi><mo>=<\/mo><mn>1100<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><mn>1<\/mn><mo>+<\/mo><mn>1210<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><msup><mn>1<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><mn>1000<\/mn><mo>+<\/mo><mn>1000<\/mn><mo>=<\/mo><mtext mathvariant=\"normal\">R$<\/mtext><mspace width=\"0.167em\"><\/mspace><mn>2000<\/mn><\/mrow><annotation encoding=\"application/x-tex\">VP=1100/1{,}1+1210/1{,}1^2=1000+1000=\\text{R\\$}\\,2000<\/annotation><\/semantics><\/math>.\nSome valores apenas após trazê-los à mesma data.<\/p>\n<\/div>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>VPL de investimento<\/strong><\/p>\n<p>Investimento inicial de R$ 1.000, retorno de R$ 600 no ano 1 e R$ 660\nno ano 2, taxa de 10% a.a.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mi>P<\/mi><mi>L<\/mi><mo>=<\/mo><mi>−<\/mi><mn>1000<\/mn><mo>+<\/mo><mn>600<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><mn>1<\/mn><mo>+<\/mo><mn>660<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><mn>21<\/mn><mo>≈<\/mo><mn>90<\/mn><mo>,<\/mo><mn>91<\/mn><\/mrow><annotation encoding=\"application/x-tex\">VPL=-1000+600/1{,}1+660/1{,}21\\approx90{,}91<\/annotation><\/semantics><\/math>.\nO valor é positivo na taxa adotada.<\/p>\n<\/div>\n", "id": "financeira-07", "number": 7, "examples": 2, "exercises": 0, "search": "Capitais em datas distintas só são comparáveis após transporte para data focal. No composto, valor no tempo t 0 t_0 de fluxo F t F_t é F t / ( 1 + i ) t − t 0 F_t/(1+i)^{t-t_0} ; valor futuro usa multiplicação. Valor presente líquido (VPL) é soma de fluxos descontados, incluindo investimento inicial com sinal negativo: V P L = ∑ t = 0 n F t ( 1 + i ) t . VPL=\\sum_{t=0}^{n}\\frac{F_t}{(1+i)^t}. Para alternativas mutuamente exclusivas, compare sob mesmas premissas de taxa, horizonte, risco e valor. Um VPL positivo significa excedente à taxa de desconto usada, não garantia de resultado realizado. Exemplo resolvido · Pagamento à vista equivalente Uma dívida de R$ 1.100 em 1 mês e R$ 1.210 em 2 meses será substituída por pagamento hoje, com taxa composta de 10% a.m. V P = 1100 / 1 , 1 + 1210 / 1 , 1 2 = 1000 + 1000 = R$ 2000 VP=1100/1{,}1+1210/1{,}1^2=1000+1000=\\text{R\\$}\\,2000 . Some valores apenas após trazê-los à mesma data. Exemplo resolvido · VPL de investimento Investimento inicial de R$ 1.000, retorno de R$ 600 no ano 1 e R$ 660 no ano 2, taxa de 10% a.a. V P L = − 1000 + 600 / 1 , 1 + 660 / 1 , 21 ≈ 90 , 91 VPL=-1000+600/1{,}1+660/1{,}21\\approx90{,}91 . O valor é positivo na taxa adotada."}, {"title": "Séries de pagamentos e anuidades", "html": "<p>Anuidade é série de pagamentos periódicos; na série uniforme, parcela\nconstante\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>R<\/mi><annotation encoding=\"application/x-tex\">R<\/annotation><\/semantics><\/math>.\nPara série postecipada (primeira parcela no fim do primeiro período),\nsoma de PG fornece\n<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mi>P<\/mi><mo>=<\/mo><mi>R<\/mi><mfrac><mrow><mn>1<\/mn><mo>−<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mi>−<\/mi><mi>n<\/mi><\/mrow><\/msup><\/mrow><mi>i<\/mi><\/mfrac><mo>,<\/mo><mspace width=\"2.0em\"><\/mspace><mi>V<\/mi><mi>F<\/mi><mo>=<\/mo><mi>R<\/mi><mfrac><mrow><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>n<\/mi><\/msup><mo>−<\/mo><mn>1<\/mn><\/mrow><mi>i<\/mi><\/mfrac><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">VP=R\\frac{1-(1+i)^{-n}}{i},\\qquad VF=R\\frac{(1+i)^n-1}{i}.<\/annotation><\/semantics><\/math>\nNa antecipada (primeira parcela no instante zero), multiplique a\nexpressão correspondente por\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">(1+i)<\/annotation><\/semantics><\/math>,\nconsiderando a mesma data focal. Na diferida, há carência; transporte o\nvalor da anuidade para data inicial, atentando ao primeiro pagamento. Se\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>i<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">i=0<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mi>P<\/mi><mo>=<\/mo><mi>V<\/mi><mi>F<\/mi><mo>=<\/mo><mi>n<\/mi><mi>R<\/mi><\/mrow><annotation encoding=\"application/x-tex\">VP=VF=nR<\/annotation><\/semantics><\/math>.\nPerpetuidade postecipada de parcela fixa e taxa positiva tem\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mi>P<\/mi><mo>=<\/mo><mi>R<\/mi><mi>/<\/mi><mi>i<\/mi><\/mrow><annotation encoding=\"application/x-tex\">VP=R/i<\/annotation><\/semantics><\/math>.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Anuidade postecipada e antecipada<\/strong><\/p>\n<p>Três parcelas de R$ 100 ao final de cada mês, taxa de 10% a.m.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mi>P<\/mi><mo>=<\/mo><mn>100<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><mn>1<\/mn><mo>+<\/mo><mn>100<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><mn>21<\/mn><mo>+<\/mo><mn>100<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><mn>331<\/mn><mo>≈<\/mo><mn>248<\/mn><mo>,<\/mo><mn>69<\/mn><\/mrow><annotation encoding=\"application/x-tex\">VP=100/1{,}1+100/1{,}21+100/1{,}331\\approx248{,}69<\/annotation><\/semantics><\/math>.\nSe o primeiro pagamento for hoje,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mi>P<\/mi><mo>≈<\/mo><mn>273<\/mn><mo>,<\/mo><mn>55<\/mn><\/mrow><annotation encoding=\"application/x-tex\">VP\\approx273{,}55<\/annotation><\/semantics><\/math>.\nO pagamento antecipado tem maior valor presente para taxa positiva.<\/p>\n<\/div>\n", "id": "financeira-08", "number": 8, "examples": 1, "exercises": 0, "search": "Anuidade é série de pagamentos periódicos; na série uniforme, parcela constante R R . Para série postecipada (primeira parcela no fim do primeiro período), soma de PG fornece V P = R 1 − ( 1 + i ) − n i , V F = R ( 1 + i ) n − 1 i . VP=R\\frac{1-(1+i)^{-n}}{i},\\qquad VF=R\\frac{(1+i)^n-1}{i}. Na antecipada (primeira parcela no instante zero), multiplique a expressão correspondente por ( 1 + i ) (1+i) , considerando a mesma data focal. Na diferida, há carência; transporte o valor da anuidade para data inicial, atentando ao primeiro pagamento. Se i = 0 i=0 , V P = V F = n R VP=VF=nR . Perpetuidade postecipada de parcela fixa e taxa positiva tem V P = R / i VP=R/i . Exemplo resolvido · Anuidade postecipada e antecipada Três parcelas de R$ 100 ao final de cada mês, taxa de 10% a.m. V P = 100 / 1 , 1 + 100 / 1 , 21 + 100 / 1 , 331 ≈ 248 , 69 VP=100/1{,}1+100/1{,}21+100/1{,}331\\approx248{,}69 . Se o primeiro pagamento for hoje, V P ≈ 273 , 55 VP\\approx273{,}55 . O pagamento antecipado tem maior valor presente para taxa positiva."}, {"title": "Sistemas de amortização: SAC e Price", "html": "<p>Amortização reduz principal; juros remuneram saldo; prestação\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P<\/mi><mi>k<\/mi><\/msub><mo>=<\/mo><msub><mi>A<\/mi><mi>k<\/mi><\/msub><mo>+<\/mo><msub><mi>J<\/mi><mi>k<\/mi><\/msub><\/mrow><annotation encoding=\"application/x-tex\">P_k=A_k+J_k<\/annotation><\/semantics><\/math>.\nSaldo inicial\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><msub><mi>D<\/mi><mn>0<\/mn><\/msub><mo>=<\/mo><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">SD_0=C<\/annotation><\/semantics><\/math>,\njuros do período\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>J<\/mi><mi>k<\/mi><\/msub><mo>=<\/mo><mi>i<\/mi><mi>S<\/mi><msub><mi>D<\/mi><mrow><mi>k<\/mi><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><annotation encoding=\"application/x-tex\">J_k=iSD_{k-1}<\/annotation><\/semantics><\/math>,\nsaldo após pagamento\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><msub><mi>D<\/mi><mi>k<\/mi><\/msub><mo>=<\/mo><mi>S<\/mi><msub><mi>D<\/mi><mrow><mi>k<\/mi><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>−<\/mo><msub><mi>A<\/mi><mi>k<\/mi><\/msub><\/mrow><annotation encoding=\"application/x-tex\">SD_k=SD_{k-1}-A_k<\/annotation><\/semantics><\/math>.<\/p>\n<p>No SAC, amortização constante\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mi>C<\/mi><mi>/<\/mi><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">A=C/n<\/annotation><\/semantics><\/math>,\njuros diminuem e prestações decrescem (taxa fixa, sem outros encargos).\nNo Price, prestação constante dada pela fórmula da anuidade:\n<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mi>C<\/mi><mfrac><mi>i<\/mi><mrow><mn>1<\/mn><mo>−<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mi>−<\/mi><mi>n<\/mi><\/mrow><\/msup><\/mrow><\/mfrac><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">P=C\\frac{i}{1-(1+i)^{-n}}.<\/annotation><\/semantics><\/math>\nJuros decrescem e amortização cresce. Outros sistemas incluem pagamento\núnico do principal no fim (americano, com juros periódicos conforme\ncontrato). Compare fluxos totais, não apenas a primeira parcela.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Tabela SAC<\/strong><\/p>\n<p>Financiamento de R$ 12.000 em 3 meses, 2% a.m.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mn>4000<\/mn><\/mrow><annotation encoding=\"application/x-tex\">A=4000<\/annotation><\/semantics><\/math>.<\/p>\n<div class=\"center\">\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: right;\">Mês<\/th>\n<th style=\"text-align: right;\">Saldo inicial<\/th>\n<th style=\"text-align: right;\">Juros<\/th>\n<th style=\"text-align: right;\">Prestação<\/th>\n<th style=\"text-align: right;\">Saldo final<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: right;\">1<\/td>\n<td style=\"text-align: right;\">12000<\/td>\n<td style=\"text-align: right;\">240<\/td>\n<td style=\"text-align: right;\">4240<\/td>\n<td style=\"text-align: right;\">8000<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: right;\">2<\/td>\n<td style=\"text-align: right;\">8000<\/td>\n<td style=\"text-align: right;\">160<\/td>\n<td style=\"text-align: right;\">4160<\/td>\n<td style=\"text-align: right;\">4000<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: right;\">3<\/td>\n<td style=\"text-align: right;\">4000<\/td>\n<td style=\"text-align: right;\">80<\/td>\n<td style=\"text-align: right;\">4080<\/td>\n<td style=\"text-align: right;\">0<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<p>Total de juros = R$ 480. Pagamentos somam R$ 12.480.<\/p>\n<\/div>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Tabela Price<\/strong><\/p>\n<p>Mesmo financiamento,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mn>12000<\/mn><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>02<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">[<\/mo><mn>1<\/mn><mo>−<\/mo><mn>1<\/mn><mo>,<\/mo><msup><mn>02<\/mn><mrow><mi>−<\/mi><mn>3<\/mn><\/mrow><\/msup><mo form=\"postfix\" stretchy=\"true\">]<\/mo><\/mrow><mo>≈<\/mo><mn>4161<\/mn><mo>,<\/mo><mn>06<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P=12000(0{,}02)/[1-1{,}02^{-3}]\\approx4161{,}06<\/annotation><\/semantics><\/math>.\nValores arredondados:<\/p>\n<div class=\"center\">\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: right;\">Mês<\/th>\n<th style=\"text-align: right;\">Saldo inicial<\/th>\n<th style=\"text-align: right;\">Juros<\/th>\n<th style=\"text-align: right;\">Amortização<\/th>\n<th style=\"text-align: right;\">Prestação<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: right;\">1<\/td>\n<td style=\"text-align: right;\">12000,00<\/td>\n<td style=\"text-align: right;\">240,00<\/td>\n<td style=\"text-align: right;\">3921,06<\/td>\n<td style=\"text-align: right;\">4161,06<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: right;\">2<\/td>\n<td style=\"text-align: right;\">8078,94<\/td>\n<td style=\"text-align: right;\">161,58<\/td>\n<td style=\"text-align: right;\">3999,48<\/td>\n<td style=\"text-align: right;\">4161,06<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: right;\">3<\/td>\n<td style=\"text-align: right;\">4079,46<\/td>\n<td style=\"text-align: right;\">81,59<\/td>\n<td style=\"text-align: right;\">4079,47<\/td>\n<td style=\"text-align: right;\">4161,06<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<p>O arredondamento pode exigir ajuste de centavo na última prestação.\nJuros totais aproximadamente R$ 483,17 (R$ 483,18 com parcelas\narredondadas). SAC amortiza mais rapidamente neste exemplo e tem juros\ntotais menores.<\/p>\n<\/div>\n", "id": "financeira-09", "number": 9, "examples": 2, "exercises": 0, "search": "Amortização reduz principal; juros remuneram saldo; prestação P k = A k + J k P_k=A_k+J_k . Saldo inicial S D 0 = C SD_0=C , juros do período J k = i S D k − 1 J_k=iSD_{k-1} , saldo após pagamento S D k = S D k − 1 − A k SD_k=SD_{k-1}-A_k . No SAC, amortização constante A = C / n A=C/n , juros diminuem e prestações decrescem (taxa fixa, sem outros encargos). No Price, prestação constante dada pela fórmula da anuidade: P = C i 1 − ( 1 + i ) − n . P=C\\frac{i}{1-(1+i)^{-n}}. Juros decrescem e amortização cresce. Outros sistemas incluem pagamento único do principal no fim (americano, com juros periódicos conforme contrato). Compare fluxos totais, não apenas a primeira parcela. Exemplo resolvido · Tabela SAC Financiamento de R$ 12.000 em 3 meses, 2% a.m. A = 4000 A=4000 . Mês Saldo inicial Juros Prestação Saldo final 1 12000 240 4240 8000 2 8000 160 4160 4000 3 4000 80 4080 0 Total de juros = R$ 480. Pagamentos somam R$ 12.480. Exemplo resolvido · Tabela Price Mesmo financiamento, P = 12000 ( 0 , 02 ) / [ 1 − 1 , 02 − 3 ] ≈ 4161 , 06 P=12000(0{,}02)/[1-1{,}02^{-3}]\\approx4161{,}06 . Valores arredondados: Mês Saldo inicial Juros Amortização Prestação 1 12000,00 240,00 3921,06 4161,06 2 8078,94 161,58 3999,48 4161,06 3 4079,46 81,59 4079,47 4161,06 O arredondamento pode exigir ajuste de centavo na última prestação. Juros totais aproximadamente R$ 483,17 (R$ 483,18 com parcelas arredondadas). SAC amortiza mais rapidamente neste exemplo e tem juros totais menores."}, {"title": "Crédito, investimentos e custo efetivo total", "html": "<p>CET reúne custos integrantes do crédito (juros, tributos, tarifas,\nseguros e outras despesas vinculadas nos termos normativos) e permite\ncomparação. Matematicamente, a taxa efetiva do fluxo iguala valor\nlíquido recebido ao valor presente dos pagamentos. Se houver custos\ndescontados na liberação, o capital efetivamente recebido é menor que o\nnominal. Em investimentos, calcule rendimento líquido após custos e\ntributos incidentes, distinguindo capital investido e rendimento.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Custo efetivo simplificado<\/strong><\/p>\n<p>Empréstimo nominal de R$ 1.000, tarifa inicial de R$ 50 descontada,\npagamento de R$ 1.100 em um mês. Valor líquido recebido = R$ 950. Taxa\nmensal do fluxo\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>1100<\/mn><mi>/<\/mi><mn>950<\/mn><mo>−<\/mo><mn>1<\/mn><mo>≈<\/mo><mn>15<\/mn><mo>,<\/mo><mn>79<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">=1100/950-1\\approx15{,}79\\%<\/annotation><\/semantics><\/math>,\nsuperior aos 10% calculados apenas sobre o valor nominal. Anualize\nconforme convenção exigida se a questão pedir CET anual.<\/p>\n<\/div>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Rendimento líquido<\/strong><\/p>\n<p>Aplicação de R$ 2.000 gera rendimento bruto de R$ 200. Tributo\nhipotético de 15% somente sobre rendimento:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>200<\/mn><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>15<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>30<\/mn><\/mrow><annotation encoding=\"application/x-tex\">200(0{,}15)=30<\/annotation><\/semantics><\/math>.\nGanho líquido R$ 170; retorno líquido\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>170<\/mn><mi>/<\/mi><mn>2000<\/mn><mo>=<\/mo><mn>8<\/mn><mo>,<\/mo><mn>5<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">170/2000=8{,}5\\%<\/annotation><\/semantics><\/math>.\nNão aplique a alíquota ao principal se o enunciado restringir ao\nrendimento.<\/p>\n<\/div>\n", "id": "financeira-10", "number": 10, "examples": 2, "exercises": 0, "search": "CET reúne custos integrantes do crédito (juros, tributos, tarifas, seguros e outras despesas vinculadas nos termos normativos) e permite comparação. Matematicamente, a taxa efetiva do fluxo iguala valor líquido recebido ao valor presente dos pagamentos. Se houver custos descontados na liberação, o capital efetivamente recebido é menor que o nominal. Em investimentos, calcule rendimento líquido após custos e tributos incidentes, distinguindo capital investido e rendimento. Exemplo resolvido · Custo efetivo simplificado Empréstimo nominal de R$ 1.000, tarifa inicial de R$ 50 descontada, pagamento de R$ 1.100 em um mês. Valor líquido recebido = R$ 950. Taxa mensal do fluxo = 1100 / 950 − 1 ≈ 15 , 79 % =1100/950-1\\approx15{,}79\\% , superior aos 10% calculados apenas sobre o valor nominal. Anualize conforme convenção exigida se a questão pedir CET anual. Exemplo resolvido · Rendimento líquido Aplicação de R$ 2.000 gera rendimento bruto de R$ 200. Tributo hipotético de 15% somente sobre rendimento: 200 ( 0 , 15 ) = 30 200(0{,}15)=30 . Ganho líquido R$ 170; retorno líquido 170 / 2000 = 8 , 5 % 170/2000=8{,}5\\% . Não aplique a alíquota ao principal se o enunciado restringir ao rendimento."}, {"title": "Fixação comentada", "html": "<div class=\"exercise\">\n<p><strong>Questão 1.<\/strong> R$ 3.000 a 3% a.m. simples por 4\nmeses.<\/p>\n<details><summary>Ver resposta comentada<\/summary><p>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mo>=<\/mo><mn>3000<\/mn><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mn>0<\/mn><mo>,<\/mo><mn>03<\/mn><mo>⋅<\/mo><mn>4<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>3360<\/mn><\/mrow><annotation encoding=\"application/x-tex\">M=3000(1+0{,}03\\cdot4)=3360<\/annotation><\/semantics><\/math>.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 2.<\/strong> R$ 1.000 a 10% a.m. composto por dois\nmeses.<\/p>\n<details><summary>Ver resposta comentada<\/summary><p>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mo>=<\/mo><mn>1000<\/mn><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>,<\/mo><mn>1<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>=<\/mo><mn>1210<\/mn><\/mrow><annotation encoding=\"application/x-tex\">M=1000(1{,}1)^2=1210<\/annotation><\/semantics><\/math>.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 3.<\/strong> Taxa efetiva trimestral equivalente a 1%\nao mês.<\/p>\n<details><summary>Ver resposta comentada<\/summary><p>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>,<\/mo><msup><mn>01<\/mn><mn>3<\/mn><\/msup><mo>−<\/mo><mn>1<\/mn><mo>=<\/mo><mn>3<\/mn><mo>,<\/mo><mn>0301<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">1{,}01^3-1=3{,}0301\\%<\/annotation><\/semantics><\/math>.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 4.<\/strong> Qual o VP de R$ 1.331 em três períodos a\n10%?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1331<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><msup><mn>1<\/mn><mn>3<\/mn><\/msup><mo>=<\/mo><mn>1000<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1331/1{,}1^3=1000<\/annotation><\/semantics><\/math>.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 5.<\/strong> No SAC, dívida de R$ 15.000 em 5 parcelas\na 1% a.m. Qual a primeira?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Amortização 3000 e juros 150; prestação R$\n3150.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 6.<\/strong> A taxa nominal é 8% e a inflação 10%. Qual\no retorno real?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>,<\/mo><mn>08<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><mn>10<\/mn><mo>−<\/mo><mn>1<\/mn><mo>≈<\/mo><mi>−<\/mi><mn>1<\/mn><mo>,<\/mo><mn>82<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">1{,}08/1{,}10-1\\approx-1{,}82\\%<\/annotation><\/semantics><\/math>.<\/p><\/details>\n<\/div>\n", "id": "financeira-11", "number": 11, "examples": 0, "exercises": 6, "search": "Questão 1. R$ 3.000 a 3% a.m. simples por 4 meses. Ver resposta comentada M = 3000 ( 1 + 0 , 03 ⋅ 4 ) = 3360 M=3000(1+0{,}03\\cdot4)=3360 . Questão 2. R$ 1.000 a 10% a.m. composto por dois meses. Ver resposta comentada M = 1000 ( 1 , 1 ) 2 = 1210 M=1000(1{,}1)^2=1210 . Questão 3. Taxa efetiva trimestral equivalente a 1% ao mês. Ver resposta comentada 1 , 01 3 − 1 = 3 , 0301 % 1{,}01^3-1=3{,}0301\\% . Questão 4. Qual o VP de R$ 1.331 em três períodos a 10%? Ver resposta comentada 1331 / 1 , 1 3 = 1000 1331/1{,}1^3=1000 . Questão 5. No SAC, dívida de R$ 15.000 em 5 parcelas a 1% a.m. Qual a primeira? Ver resposta comentada Amortização 3000 e juros 150; prestação R$ 3150. Questão 6. A taxa nominal é 8% e a inflação 10%. Qual o retorno real? Ver resposta comentada 1 , 08 / 1 , 10 − 1 ≈ − 1 , 82 % 1{,}08/1{,}10-1\\approx-1{,}82\\% ."}], "id": "financeira", "short": "Matemática Financeira", "icon": "%", "questions": 5, "description": "Juros, descontos, equivalência e amortização.", "group": "especificos"}, {"title": "Noções de Probabilidade e Estatística", "intro": "", "sections": [{"title": "População, amostra e tipos de dados", "html": "<p>Estatística descritiva organiza, resume e representa dados;\ninferencial utiliza amostras para estimar propriedades populacionais sob\nincerteza. População é conjunto de unidades de interesse; amostra é\nsubconjunto observado; censo observa toda a população definida.\nParâmetro caracteriza população\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML
