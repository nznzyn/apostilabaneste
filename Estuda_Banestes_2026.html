=<\/mo><mn>8<\/mn><mo>⋅<\/mo><mn>7<\/mn><mo>⋅<\/mo><mn>6<\/mn><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>3<\/mn><mo>⋅<\/mo><mn>2<\/mn><mo>⋅<\/mo><mn>1<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>56<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\binom83=8\\cdot7\\cdot6/(3\\cdot2\\cdot1)=56<\/annotation><\/semantics><\/math>.\nSe os três cargos forem distintos, há\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8<\/mn><mo>⋅<\/mo><mn>7<\/mn><mo>⋅<\/mo><mn>6<\/mn><mo>=<\/mo><mn>336<\/mn><\/mrow><annotation encoding=\"application/x-tex\">8\\cdot7\\cdot6=336<\/annotation><\/semantics><\/math>\npossibilidades. A diferença decorre da importância da ordem.<\/p>\n<\/div>\n", "id": "logica-08", "number": 8, "examples": 1, "exercises": 0, "search": "Princípio aditivo: alternativas mutuamente exclusivas são somadas. Multiplicativo: etapas sucessivas são multiplicadas. Permutação de n n elementos distintos: P n = n ! P_n=n! . Com repetição de elementos: n ! / ( a ! b ! ⋯ ) n!/(a!b!\\cdots) . Arranjo: escolha ordenada de k k entre n n , A n , k = n ! / ( n − k ) ! A_{n,k}=n!/(n-k)! . Combinação: escolha sem ordem, C n , k = ( n k ) = n ! / [ k ! ( n − k ) ! ] C_{n,k}=\\binom nk=n!/[k!(n-k)!] . Se houver reposição e n n opções em cada etapa, n k n^k . Exemplo resolvido · Escolha com e sem ordem De 8 empregados, escolha 3 para uma comissão sem cargos. ( 8 3 ) = 8 ⋅ 7 ⋅ 6 / ( 3 ⋅ 2 ⋅ 1 ) = 56 \\binom83=8\\cdot7\\cdot6/(3\\cdot2\\cdot1)=56 . Se os três cargos forem distintos, há 8 ⋅ 7 ⋅ 6 = 336 8\\cdot7\\cdot6=336 possibilidades. A diferença decorre da importância da ordem."}, {"title": "Fixação comentada", "html": "<div class=\"exercise\">\n<p><strong>Questão 1.<\/strong> Negue “todos os clientes possuem\ncartão”.<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Existe pelo menos um cliente que não possui\ncartão.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 2.<\/strong> Qual o resultado de\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>−<\/mi><mn>3<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>+<\/mo><mn>2<\/mn><mo>⋅<\/mo><mn>5<\/mn><mo>−<\/mo><mn>8<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">(-3)^2+2\\cdot5-8/2<\/annotation><\/semantics><\/math>?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9<\/mn><mo>+<\/mo><mn>10<\/mn><mo>−<\/mo><mn>4<\/mn><mo>=<\/mo><mn>15<\/mn><\/mrow><annotation encoding=\"application/x-tex\">9+10-4=15<\/annotation><\/semantics><\/math>.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 3.<\/strong> Um preço passa de 80 para 100. Qual a\nvariação?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>100<\/mn><mo>−<\/mo><mn>80<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mn>80<\/mn><mo>=<\/mo><mn>25<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">(100-80)/80=25\\%<\/annotation><\/semantics><\/math>.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 4.<\/strong> Uma equipe de 5 pessoas termina tarefa em\n12 dias; 10 pessoas, mesma produtividade, levam quanto?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Grandezas inversas:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mo>⋅<\/mo><mn>12<\/mn><mi>/<\/mi><mn>10<\/mn><mo>=<\/mo><mn>6<\/mn><\/mrow><annotation encoding=\"application/x-tex\">5\\cdot12/10=6<\/annotation><\/semantics><\/math>\ndias.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 5.<\/strong> Quantas senhas de 3 algarismos distintos\npodem ser feitas com 0 a 9, admitindo zero inicial?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10<\/mn><mo>⋅<\/mo><mn>9<\/mn><mo>⋅<\/mo><mn>8<\/mn><mo>=<\/mo><mn>720<\/mn><\/mrow><annotation encoding=\"application/x-tex\">10\\cdot9\\cdot8=720<\/annotation><\/semantics><\/math>.<\/p><\/details>\n<\/div>\n", "id": "logica-09", "number": 9, "examples": 0, "exercises": 5, "search": "Questão 1. Negue “todos os clientes possuem cartão”. Ver resposta comentada Existe pelo menos um cliente que não possui cartão. Questão 2. Qual o resultado de ( − 3 ) 2 + 2 ⋅ 5 − 8 / 2 (-3)^2+2\\cdot5-8/2 ? Ver resposta comentada 9 + 10 − 4 = 15 9+10-4=15 . Questão 3. Um preço passa de 80 para 100. Qual a variação? Ver resposta comentada ( 100 − 80 ) / 80 = 25 % (100-80)/80=25\\% . Questão 4. Uma equipe de 5 pessoas termina tarefa em 12 dias; 10 pessoas, mesma produtividade, levam quanto? Ver resposta comentada Grandezas inversas: 5 ⋅ 12 / 10 = 6 5\\cdot12/10=6 dias. Questão 5. Quantas senhas de 3 algarismos distintos podem ser feitas com 0 a 9, admitindo zero inicial? Ver resposta comentada 10 ⋅ 9 ⋅ 8 = 720 10\\cdot9\\cdot8=720 ."}], "id": "logica", "short": "Matemática e Raciocínio Lógico", "icon": "∴", "questions": 10, "description": "Lógica, números, porcentagem e contagem.", "group": "gerais"}, {"title": "Atualidades do Mercado Financeiro", "intro": "", "sections": [{"title": "Sistema Financeiro Nacional e mercados", "html": "<p>O SFN conecta quem dispõe de recursos a quem precisa deles. A esfera\nnormativa estabelece diretrizes; a supervisora acompanha e fiscaliza;\noperadores prestam serviços. No núcleo monetário, CMN define diretrizes\ne BCB executa política monetária e supervisiona instituições; CVM atua\nno mercado de valores mobiliários. CNSP e Susep atuam em seguros,\ncapitalização e previdência aberta. CNPC e Previc relacionam-se à\nprevidência fechada. O capítulo de Bancários aprofunda cada papel.<\/p>\n<p>Mercado monetário envolve liquidez de curto prazo; crédito envolve\nempréstimos/financiamentos; capitais capta recursos mediante valores\nmobiliários como ações e debêntures; câmbio troca moedas. No mercado\nprimário, a emissão capta recursos para o emissor; no secundário,\ninvestidores negociam títulos existentes. Indicadores: IPCA (inflação ao\nconsumidor), Selic (referência monetária), CDI/Taxa DI (referência de\noperações interfinanceiras), câmbio, Ibovespa (carteira teórica de\nações), PIB (produção de bens e serviços finais).<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Mercado primário e secundário<\/strong><\/p>\n<p>Uma empresa emite ações para financiar uma fábrica; depois, um\ninvestidor vende essas ações na bolsa a outro. A primeira transação é\nprimária e a segunda secundária. A revenda não representa nova captação\ndireta para a companhia.<\/p>\n<\/div>\n", "id": "atualidades-01", "number": 1, "examples": 1, "exercises": 0, "search": "O SFN conecta quem dispõe de recursos a quem precisa deles. A esfera normativa estabelece diretrizes; a supervisora acompanha e fiscaliza; operadores prestam serviços. No núcleo monetário, CMN define diretrizes e BCB executa política monetária e supervisiona instituições; CVM atua no mercado de valores mobiliários. CNSP e Susep atuam em seguros, capitalização e previdência aberta. CNPC e Previc relacionam-se à previdência fechada. O capítulo de Bancários aprofunda cada papel. Mercado monetário envolve liquidez de curto prazo; crédito envolve empréstimos/financiamentos; capitais capta recursos mediante valores mobiliários como ações e debêntures; câmbio troca moedas. No mercado primário, a emissão capta recursos para o emissor; no secundário, investidores negociam títulos existentes. Indicadores: IPCA (inflação ao consumidor), Selic (referência monetária), CDI/Taxa DI (referência de operações interfinanceiras), câmbio, Ibovespa (carteira teórica de ações), PIB (produção de bens e serviços finais). Exemplo resolvido · Mercado primário e secundário Uma empresa emite ações para financiar uma fábrica; depois, um investidor vende essas ações na bolsa a outro. A primeira transação é primária e a segunda secundária. A revenda não representa nova captação direta para a companhia."}, {"title": "Política monetária, inflação e transmissão dos juros", "html": "<p>Inflação é aumento generalizado e persistente dos preços; desinflação\né desaceleração da inflação ainda positiva; deflação é queda\ngeneralizada de preços. A taxa Selic meta é definida pelo Copom, órgão\ndo BCB, dentro do regime de metas de inflação. Elevar juros tende a\nencarecer o crédito, estimular poupança e reduzir demanda e pressão\ninflacionária, com defasagens; reduzir juros tende ao efeito contrário.\nChoques de oferta (energia, alimentos), câmbio e expectativas podem\nalterar o resultado. Política fiscal refere-se a receitas e despesas\npúblicas, diferente da monetária. A Selic efetiva é taxa média ajustada\nde operações de financiamento de um dia lastreadas em títulos públicos\nfederais; não é automaticamente a taxa cobrada ao consumidor.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Inflação e poder de compra<\/strong><\/p>\n<p>Uma renda sobe 6% e preços sobem 8%. A variação real é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>,<\/mo><mn>06<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><mn>08<\/mn><mo>−<\/mo><mn>1<\/mn><mo>≈<\/mo><mi>−<\/mi><mn>1<\/mn><mo>,<\/mo><mn>85<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">1{,}06/1{,}08-1\\approx-1{,}85\\%<\/annotation><\/semantics><\/math>.\nO ganho nominal não compensou a inflação. A diferença simples de 2\npontos percentuais é apenas uma aproximação da perda real.<\/p>\n<\/div>\n", "id": "atualidades-02", "number": 2, "examples": 1, "exercises": 0, "search": "Inflação é aumento generalizado e persistente dos preços; desinflação é desaceleração da inflação ainda positiva; deflação é queda generalizada de preços. A taxa Selic meta é definida pelo Copom, órgão do BCB, dentro do regime de metas de inflação. Elevar juros tende a encarecer o crédito, estimular poupança e reduzir demanda e pressão inflacionária, com defasagens; reduzir juros tende ao efeito contrário. Choques de oferta (energia, alimentos), câmbio e expectativas podem alterar o resultado. Política fiscal refere-se a receitas e despesas públicas, diferente da monetária. A Selic efetiva é taxa média ajustada de operações de financiamento de um dia lastreadas em títulos públicos federais; não é automaticamente a taxa cobrada ao consumidor. Exemplo resolvido · Inflação e poder de compra Uma renda sobe 6% e preços sobem 8%. A variação real é 1 , 06 / 1 , 08 − 1 ≈ − 1 , 85 % 1{,}06/1{,}08-1\\approx-1{,}85\\% . O ganho nominal não compensou a inflação. A diferença simples de 2 pontos percentuais é apenas uma aproximação da perda real."}, {"title": "Pix, Open Finance, moedas digitais e inovação", "html": "<p>Pix é o arranjo de pagamentos instantâneos instituído pelo BCB, com\ntransferências entre participantes a qualquer hora, respeitadas regras e\nlimites. Chaves facilitam identificação, mas não são indispensáveis para\ntoda transação. Pix não é moeda nova e não é operação de crédito por\ndefinição. O MED é mecanismo previsto para determinados casos de fraude\ne falha operacional, não garantia geral de reembolso nem solução para\ndesacordo comercial.<\/p>\n<p>Open Finance permite compartilhamento padronizado de dados e serviços\nfinanceiros mediante condições regulatórias e autorização do cliente,\nfavorecendo portabilidade, comparação e concorrência. Não confunda com\ndivulgação pública de extratos. APIs são interfaces que permitem\ncomunicação entre sistemas. Drex é iniciativa do BCB relacionada a\ninfraestrutura financeira digital, tokenização e representação digital\nde ativos; acompanhe seu estágio oficial, sem presumir lançamento amplo.\nCriptoativos privados não equivalem automaticamente a moeda soberana nem\ndepósitos garantidos. Stablecoins buscam referência estável a outro\nativo, mas podem apresentar riscos.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Open Finance versus Pix<\/strong><\/p>\n<p>Um cliente autoriza seu banco a acessar dados de outra instituição\npara receber proposta de crédito personalizada. Trata-se de Open\nFinance. Uma transferência instantânea para pagar um fornecedor é Pix.\nOs ecossistemas podem interagir, mas têm funções diferentes.<\/p>\n<\/div>\n", "id": "atualidades-03", "number": 3, "examples": 1, "exercises": 0, "search": "Pix é o arranjo de pagamentos instantâneos instituído pelo BCB, com transferências entre participantes a qualquer hora, respeitadas regras e limites. Chaves facilitam identificação, mas não são indispensáveis para toda transação. Pix não é moeda nova e não é operação de crédito por definição. O MED é mecanismo previsto para determinados casos de fraude e falha operacional, não garantia geral de reembolso nem solução para desacordo comercial. Open Finance permite compartilhamento padronizado de dados e serviços financeiros mediante condições regulatórias e autorização do cliente, favorecendo portabilidade, comparação e concorrência. Não confunda com divulgação pública de extratos. APIs são interfaces que permitem comunicação entre sistemas. Drex é iniciativa do BCB relacionada a infraestrutura financeira digital, tokenização e representação digital de ativos; acompanhe seu estágio oficial, sem presumir lançamento amplo. Criptoativos privados não equivalem automaticamente a moeda soberana nem depósitos garantidos. Stablecoins buscam referência estável a outro ativo, mas podem apresentar riscos. Exemplo resolvido · Open Finance versus Pix Um cliente autoriza seu banco a acessar dados de outra instituição para receber proposta de crédito personalizada. Trata-se de Open Finance. Uma transferência instantânea para pagar um fornecedor é Pix. Os ecossistemas podem interagir, mas têm funções diferentes."}, {"title": "Fintechs, inclusão e educação financeira", "html": "<p>Fintech é empresa que usa tecnologia para oferecer soluções\nfinanceiras, não necessariamente banco. Bancos digitais são instituições\nbancárias com atendimento predominantemente digital; instituições de\npagamento administram serviços de pagamento e não se confundem com\nbancos por definição. Soluções digitais reduzem custos e facilitam\nacesso, mas podem criar exclusão para quem não tem conectividade,\nletramento digital ou acessibilidade.<\/p>\n<p>Educação financeira envolve orçamento, reserva, crédito responsável,\ncomparação de custos, planejamento e prevenção de fraudes. Inclusão\nfinanceira exige acesso e uso efetivo de serviços adequados. Proteção do\nconsumidor exige informação clara, atendimento, tratamento justo e\nprevenção de práticas abusivas. Uma inovação bem-sucedida combina\nconveniência com segurança e acessibilidade.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Inclusão real<\/strong><\/p>\n<p>Um banco substitui todos os canais humanos por aplicativo inacessível\na parte dos idosos. O número de contas digitais aumentou, mas a inclusão\nnão necessariamente melhorou: acesso nominal não garante capacidade\nefetiva de usar os serviços. Uma solução é oferecer atendimento\nassistido e interfaces acessíveis.<\/p>\n<\/div>\n", "id": "atualidades-04", "number": 4, "examples": 1, "exercises": 0, "search": "Fintech é empresa que usa tecnologia para oferecer soluções financeiras, não necessariamente banco. Bancos digitais são instituições bancárias com atendimento predominantemente digital; instituições de pagamento administram serviços de pagamento e não se confundem com bancos por definição. Soluções digitais reduzem custos e facilitam acesso, mas podem criar exclusão para quem não tem conectividade, letramento digital ou acessibilidade. Educação financeira envolve orçamento, reserva, crédito responsável, comparação de custos, planejamento e prevenção de fraudes. Inclusão financeira exige acesso e uso efetivo de serviços adequados. Proteção do consumidor exige informação clara, atendimento, tratamento justo e prevenção de práticas abusivas. Uma inovação bem-sucedida combina conveniência com segurança e acessibilidade. Exemplo resolvido · Inclusão real Um banco substitui todos os canais humanos por aplicativo inacessível a parte dos idosos. O número de contas digitais aumentou, mas a inclusão não necessariamente melhorou: acesso nominal não garante capacidade efetiva de usar os serviços. Uma solução é oferecer atendimento assistido e interfaces acessíveis."}, {"title": "Finanças sustentáveis e cenários econômicos", "html": "<p>ESG incorpora fatores ambientais, sociais e de governança na decisão\neconômica. Títulos verdes podem financiar projetos ambientais definidos;\ntítulos sociais financiam objetivos sociais; instrumentos vinculados à\nsustentabilidade podem vincular condições a metas verificáveis.\nGreenwashing é alegação ambiental enganosa ou sem evidências. Riscos\nfísicos (enchentes, secas) e de transição (mudanças tecnológicas ou\nregulatórias) podem afetar capacidade de pagamento e carteira de\ncrédito.<\/p>\n<p>Cenários internacionais afetam câmbio, commodities, fluxos de\ncapitais, inflação importada e risco. Juros externos maiores podem\ntornar ativos estrangeiros mais atrativos e pressionar câmbio, mas a\ndireção não é certa: depende de expectativas, risco e fundamentos.\nDesvalorização do real encarece importações em reais, mantido o preço em\ndólar; exportadores podem ganhar receitas em moeda local, mas custos e\nhedge alteram o efeito.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Choque cambial<\/strong><\/p>\n<p>Um bem custa US$ 100. O dólar passa de R$ 5,00 para R$ 5,50.\nDesconsiderando impostos e margens, o preço passa de R$ 500 para R$ 550:\nalta de 10%. Esse canal pode pressionar a inflação doméstica.<\/p>\n<\/div>\n", "id": "atualidades-05", "number": 5, "examples": 1, "exercises": 0, "search": "ESG incorpora fatores ambientais, sociais e de governança na decisão econômica. Títulos verdes podem financiar projetos ambientais definidos; títulos sociais financiam objetivos sociais; instrumentos vinculados à sustentabilidade podem vincular condições a metas verificáveis. Greenwashing é alegação ambiental enganosa ou sem evidências. Riscos físicos (enchentes, secas) e de transição (mudanças tecnológicas ou regulatórias) podem afetar capacidade de pagamento e carteira de crédito. Cenários internacionais afetam câmbio, commodities, fluxos de capitais, inflação importada e risco. Juros externos maiores podem tornar ativos estrangeiros mais atrativos e pressionar câmbio, mas a direção não é certa: depende de expectativas, risco e fundamentos. Desvalorização do real encarece importações em reais, mantido o preço em dólar; exportadores podem ganhar receitas em moeda local, mas custos e hedge alteram o efeito. Exemplo resolvido · Choque cambial Um bem custa US$ 100. O dólar passa de R$ 5,00 para R$ 5,50. Desconsiderando impostos e margens, o preço passa de R$ 500 para R$ 550: alta de 10%. Esse canal pode pressionar a inflação doméstica."}, {"title": "Rotina de atualização para a prova", "html": "<p>Leia comunicados e atas do Copom, relatório de política monetária,\nFocus (expectativas de mercado, não previsão oficial do BCB), IPCA e PIB\ndo IBGE, atualizações de Pix/Open Finance/Drex e notícias de\ninstituições reguladoras. Registre data, fato, conceito associado,\nefeitos esperados e ressalvas. Não confunda projeção com dado realizado.\nEsta apostila ensina mecanismos; não congela valores de Selic, IPCA ou\ncâmbio que podem mudar.<\/p>\n<div class=\"exercise\">\n<p><strong>Questão 1.<\/strong> Quem define a meta Selic?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Copom, no Banco Central. CMN estabelece a\nmeta de inflação conforme o regime vigente.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 2.<\/strong> Inflação cai de 8% para 5%. Houve\ndeflação?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não. Houve desinflação; o nível geral de\npreços ainda aumenta.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 3.<\/strong> A revenda de uma debênture é emissão\nprimária?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não, é negociação secundária.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 4.<\/strong> Open Finance exige divulgação pública dos\ndados?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não. O compartilhamento segue regras,\nfinalidade e autorização aplicáveis.<\/p><\/details>\n<\/div>\n", "id": "atualidades-06", "number": 6, "examples": 0, "exercises": 4, "search": "Leia comunicados e atas do Copom, relatório de política monetária, Focus (expectativas de mercado, não previsão oficial do BCB), IPCA e PIB do IBGE, atualizações de Pix/Open Finance/Drex e notícias de instituições reguladoras. Registre data, fato, conceito associado, efeitos esperados e ressalvas. Não confunda projeção com dado realizado. Esta apostila ensina mecanismos; não congela valores de Selic, IPCA ou câmbio que podem mudar. Questão 1. Quem define a meta Selic? Ver resposta comentada Copom, no Banco Central. CMN estabelece a meta de inflação conforme o regime vigente. Questão 2. Inflação cai de 8% para 5%. Houve deflação? Ver resposta comentada Não. Houve desinflação; o nível geral de preços ainda aumenta. Questão 3. A revenda de uma debênture é emissão primária? Ver resposta comentada Não, é negociação secundária. Questão 4. Open Finance exige divulgação pública dos dados? Ver resposta comentada Não. O compartilhamento segue regras, finalidade e autorização aplicáveis."}], "id": "atualidades", "short": "Atualidades do Mercado Financeiro", "icon": "↗", "questions": 5, "description": "Economia, inovação e mercado financeiro.", "group": "gerais"}, {"title": "Ética, Compliance e ESG", "intro": "", "sections": [{"title": "Ética, moral e responsabilidade profissional", "html": "<p>Moral é o conjunto de costumes, valores e normas de uma coletividade;\nética é a reflexão crítica sobre ações e princípios. Legalidade é\nobservância da lei; uma conduta formalmente legal pode ser questionável\nsob integridade ou responsabilidade. No serviço público e em\ninstituições financeiras, são centrais impessoalidade, respeito,\nhonestidade, zelo, sigilo, qualidade e tratamento não discriminatório. O\nempregado deve observar políticas internas e interesse legítimo da\norganização e do cliente, sem usar a posição para benefício privado\nindevido.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Meta comercial e ética<\/strong><\/p>\n<p>Para atingir a meta, um funcionário oculta encargos de um empréstimo.\nA conduta viola transparência e boa-fé; alcançar resultado não justifica\ninduzir o cliente a erro. O correto é explicar custos, riscos e\nalternativas antes da contratação.<\/p>\n<\/div>\n", "id": "etica-01", "number": 1, "examples": 1, "exercises": 0, "search": "Moral é o conjunto de costumes, valores e normas de uma coletividade; ética é a reflexão crítica sobre ações e princípios. Legalidade é observância da lei; uma conduta formalmente legal pode ser questionável sob integridade ou responsabilidade. No serviço público e em instituições financeiras, são centrais impessoalidade, respeito, honestidade, zelo, sigilo, qualidade e tratamento não discriminatório. O empregado deve observar políticas internas e interesse legítimo da organização e do cliente, sem usar a posição para benefício privado indevido. Exemplo resolvido · Meta comercial e ética Para atingir a meta, um funcionário oculta encargos de um empréstimo. A conduta viola transparência e boa-fé; alcançar resultado não justifica induzir o cliente a erro. O correto é explicar custos, riscos e alternativas antes da contratação."}, {"title": "Integridade, transparência e conflitos de interesse", "html": "<p>Integridade é coerência entre condutas, valores e normas.\nTransparência é comunicação verdadeira e adequada, sem violar sigilos\nlegítimos. Responsabilidade inclui prestar contas e assumir\nconsequências. Conflito de interesse ocorre quando interesses pessoais\npodem prejudicar decisões imparciais; pode ser real, potencial ou\naparente. Deve ser declarado e tratado, com afastamento da decisão\nquando aplicável. Assédio, discriminação, favorecimento e nepotismo\ncomprometem confiança e ambiente de trabalho.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Conflito de interesse<\/strong><\/p>\n<p>Um empregado integra comissão que selecionará uma empresa de seu\nfamiliar. Mesmo sem prova de favorecimento, há risco de conflito. Deve\ninformar a situação segundo os canais e procedimentos internos e não\ninfluenciar a escolha.<\/p>\n<\/div>\n", "id": "etica-02", "number": 2, "examples": 1, "exercises": 0, "search": "Integridade é coerência entre condutas, valores e normas. Transparência é comunicação verdadeira e adequada, sem violar sigilos legítimos. Responsabilidade inclui prestar contas e assumir consequências. Conflito de interesse ocorre quando interesses pessoais podem prejudicar decisões imparciais; pode ser real, potencial ou aparente. Deve ser declarado e tratado, com afastamento da decisão quando aplicável. Assédio, discriminação, favorecimento e nepotismo comprometem confiança e ambiente de trabalho. Exemplo resolvido · Conflito de interesse Um empregado integra comissão que selecionará uma empresa de seu familiar. Mesmo sem prova de favorecimento, há risco de conflito. Deve informar a situação segundo os canais e procedimentos internos e não influenciar a escolha."}, {"title": "Governança corporativa e controles internos", "html": "<p>Governança é o sistema de direção, monitoramento e responsabilização\ndas organizações. Conselho de administração orienta e supervisiona\nestratégia; diretoria executa a gestão; auditoria e comitês fornecem\navaliação conforme competências. Princípios incluem integridade,\ntransparência, equidade, responsabilização e sustentabilidade.\nGovernança não se resume a controle financeiro.<\/p>\n<p>Controle interno reduz riscos e assegura confiabilidade, conformidade\ne eficiência. Exemplos: segregação entre autorização e execução, dupla\naprovação, conciliação, trilhas de auditoria, limites de acesso e\nreconciliação de registros. Controle preventivo evita falhas; detectivo\nidentifica ocorrências; corretivo reduz danos e causas. Auditoria\ninterna fornece avaliação independente; compliance não substitui\nauditoria.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Segregação de funções<\/strong><\/p>\n<p>O mesmo empregado cadastra, aprova e libera pagamentos sem revisão.\nHá risco de erro ou fraude não detectada. Separar autorização da\nexecução e registrar trilhas reduz risco operacional, embora não elimine\ntodo risco.<\/p>\n<\/div>\n", "id": "etica-03", "number": 3, "examples": 1, "exercises": 0, "search": "Governança é o sistema de direção, monitoramento e responsabilização das organizações. Conselho de administração orienta e supervisiona estratégia; diretoria executa a gestão; auditoria e comitês fornecem avaliação conforme competências. Princípios incluem integridade, transparência, equidade, responsabilização e sustentabilidade. Governança não se resume a controle financeiro. Controle interno reduz riscos e assegura confiabilidade, conformidade e eficiência. Exemplos: segregação entre autorização e execução, dupla aprovação, conciliação, trilhas de auditoria, limites de acesso e reconciliação de registros. Controle preventivo evita falhas; detectivo identifica ocorrências; corretivo reduz danos e causas. Auditoria interna fornece avaliação independente; compliance não substitui auditoria. Exemplo resolvido · Segregação de funções O mesmo empregado cadastra, aprova e libera pagamentos sem revisão. Há risco de erro ou fraude não detectada. Separar autorização da execução e registrar trilhas reduz risco operacional, embora não elimine todo risco."}, {"title": "Compliance, gestão de riscos e canais de denúncia", "html": "<p>Compliance é atuação para cumprir leis, regulamentos, políticas e\npadrões éticos. Programa de integridade inclui comprometimento da\nliderança, avaliação de riscos, código, treinamento, controles,\ndiligência de terceiros, canal de denúncias, investigação e melhoria.\nGestão de riscos identifica eventos, avalia probabilidade e impacto,\ndefine resposta (evitar, reduzir, compartilhar ou aceitar) e monitora.\nRisco residual é o que permanece após controles.<\/p>\n<p>Riscos bancários: crédito (não pagamento), mercado (variação de\npreços), liquidez (incapacidade de honrar compromissos sem perdas\nexcessivas), operacional (processos, pessoas, sistemas ou eventos\nexternos), socioambiental/climático e reputacional. Canal de denúncias\ndeve permitir relato de boa-fé, preservar confidencialidade e evitar\nretaliação; não se deve prometer anonimato quando o canal não o garante,\nnem divulgar acusação antes de apuração.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Controle detectivo<\/strong><\/p>\n<p>Uma rotina diária compara saldos de duas bases e sinaliza\ndivergências. Trata-se de controle detectivo. Exigir dupla aprovação\nantes da transferência seria preventivo. Corrigir registros e a causa da\ndivergência é corretivo.<\/p>\n<\/div>\n", "id": "etica-04", "number": 4, "examples": 1, "exercises": 0, "search": "Compliance é atuação para cumprir leis, regulamentos, políticas e padrões éticos. Programa de integridade inclui comprometimento da liderança, avaliação de riscos, código, treinamento, controles, diligência de terceiros, canal de denúncias, investigação e melhoria. Gestão de riscos identifica eventos, avalia probabilidade e impacto, define resposta (evitar, reduzir, compartilhar ou aceitar) e monitora. Risco residual é o que permanece após controles. Riscos bancários: crédito (não pagamento), mercado (variação de preços), liquidez (incapacidade de honrar compromissos sem perdas excessivas), operacional (processos, pessoas, sistemas ou eventos externos), socioambiental/climático e reputacional. Canal de denúncias deve permitir relato de boa-fé, preservar confidencialidade e evitar retaliação; não se deve prometer anonimato quando o canal não o garante, nem divulgar acusação antes de apuração. Exemplo resolvido · Controle detectivo Uma rotina diária compara saldos de duas bases e sinaliza divergências. Trata-se de controle detectivo. Exigir dupla aprovação antes da transferência seria preventivo. Corrigir registros e a causa da divergência é corretivo."}, {"title": "Corrupção, fraude e lavagem de dinheiro", "html": "<p>Corrupção envolve uso indevido de poder ou oferta/solicitação de\nvantagem indevida, conforme enquadramento jurídico. Fraude usa engano\nintencional para obter vantagem ou causar prejuízo. Lavagem de dinheiro\nbusca ocultar ou dissimular natureza, origem, localização, disposição,\nmovimentação ou propriedade de bens provenientes de infração penal.\nEtapas didáticas: colocação, ocultação e integração; nem todo caso passa\npor três fases nítidas. Prevenção envolve identificação e conhecimento\ndo cliente, monitoramento, registros, análise de operações atípicas e\ncomunicações cabíveis, com confidencialidade. Consulte Lei 9.613/1998 e\nregras do BCB.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Oferta de vantagem<\/strong><\/p>\n<p>Um fornecedor oferece presente valioso em troca de acelerar\ncontratação. Recuse a vantagem, preserve os registros e comunique\nconforme política. Não trate o presente como simples gentileza quando\ncondicionado à decisão.<\/p>\n<\/div>\n", "id": "etica-05", "number": 5, "examples": 1, "exercises": 0, "search": "Corrupção envolve uso indevido de poder ou oferta/solicitação de vantagem indevida, conforme enquadramento jurídico. Fraude usa engano intencional para obter vantagem ou causar prejuízo. Lavagem de dinheiro busca ocultar ou dissimular natureza, origem, localização, disposição, movimentação ou propriedade de bens provenientes de infração penal. Etapas didáticas: colocação, ocultação e integração; nem todo caso passa por três fases nítidas. Prevenção envolve identificação e conhecimento do cliente, monitoramento, registros, análise de operações atípicas e comunicações cabíveis, com confidencialidade. Consulte Lei 9.613/1998 e regras do BCB. Exemplo resolvido · Oferta de vantagem Um fornecedor oferece presente valioso em troca de acelerar contratação. Recuse a vantagem, preserve os registros e comunique conforme política. Não trate o presente como simples gentileza quando condicionado à decisão."}, {"title": "Privacidade e LGPD na conduta ética", "html": "<p>Dado pessoal identifica ou permite identificar pessoa natural; dado\nsensível inclui, por exemplo, saúde, biometria vinculada à pessoa,\nreligião e origem racial ou étnica. A Lei 13.709/2018 regula tratamento\nde dados pessoais. Finalidade, necessidade, adequação, segurança,\ntransparência, prevenção e não discriminação orientam o uso. Sigilo\nbancário (LC 105/2001) é adicional: não é superado apenas por\nconveniência comercial. Consentimento não é a única base legal. O\ncapítulo de Informática detalha bases, agentes e direitos.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Curiosidade não é finalidade legítima<\/strong><\/p>\n<p>Um empregado consulta o saldo de um conhecido sem necessidade de\nserviço. Mesmo sem divulgar a informação, o acesso é indevido. O acesso\ndeve ser limitado à finalidade profissional autorizada e auditável.<\/p>\n<\/div>\n", "id": "etica-06", "number": 6, "examples": 1, "exercises": 0, "search": "Dado pessoal identifica ou permite identificar pessoa natural; dado sensível inclui, por exemplo, saúde, biometria vinculada à pessoa, religião e origem racial ou étnica. A Lei 13.709/2018 regula tratamento de dados pessoais. Finalidade, necessidade, adequação, segurança, transparência, prevenção e não discriminação orientam o uso. Sigilo bancário (LC 105/2001) é adicional: não é superado apenas por conveniência comercial. Consentimento não é a única base legal. O capítulo de Informática detalha bases, agentes e direitos. Exemplo resolvido · Curiosidade não é finalidade legítima Um empregado consulta o saldo de um conhecido sem necessidade de serviço. Mesmo sem divulgar a informação, o acesso é indevido. O acesso deve ser limitado à finalidade profissional autorizada e auditável."}, {"title": "ESG, sustentabilidade e Agenda 2030", "html": "<p>Environmental: consumo de água e energia, emissões, resíduos, clima e\nbiodiversidade. Social: direitos humanos, inclusão, acessibilidade,\nrelações de trabalho e comunidade. Governance: integridade, controles,\nprestação de contas e gestão. Sustentabilidade busca atender\nnecessidades atuais sem comprometer gerações futuras. Responsabilidade\nsocioambiental incorpora impactos das operações e do financiamento.<\/p>\n<p>A Agenda 2030 da ONU estabelece 17 ODS: erradicação da pobreza; fome\nzero e agricultura sustentável; saúde; educação; igualdade de gênero;\nágua e saneamento; energia limpa; trabalho decente; indústria, inovação\ne infraestrutura; redução das desigualdades; cidades sustentáveis;\nconsumo e produção responsáveis; ação climática; vida na água; vida\nterrestre; paz, justiça e instituições eficazes; parcerias. Bancos\ncontribuem por meio de crédito responsável, inclusão financeira,\nfinanciamento de projetos e controles de riscos.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Classificação ESG<\/strong><\/p>\n<p>Instalar energia solar na agência relaciona-se principalmente a E;\ntornar aplicativo acessível a pessoas com deficiência relaciona-se a S;\nimplementar canal de denúncias e supervisão de riscos relaciona-se a G.\nUm projeto pode afetar mais de uma dimensão.<\/p>\n<\/div>\n", "id": "etica-07", "number": 7, "examples": 1, "exercises": 0, "search": "Environmental: consumo de água e energia, emissões, resíduos, clima e biodiversidade. Social: direitos humanos, inclusão, acessibilidade, relações de trabalho e comunidade. Governance: integridade, controles, prestação de contas e gestão. Sustentabilidade busca atender necessidades atuais sem comprometer gerações futuras. Responsabilidade socioambiental incorpora impactos das operações e do financiamento. A Agenda 2030 da ONU estabelece 17 ODS: erradicação da pobreza; fome zero e agricultura sustentável; saúde; educação; igualdade de gênero; água e saneamento; energia limpa; trabalho decente; indústria, inovação e infraestrutura; redução das desigualdades; cidades sustentáveis; consumo e produção responsáveis; ação climática; vida na água; vida terrestre; paz, justiça e instituições eficazes; parcerias. Bancos contribuem por meio de crédito responsável, inclusão financeira, financiamento de projetos e controles de riscos. Exemplo resolvido · Classificação ESG Instalar energia solar na agência relaciona-se principalmente a E; tornar aplicativo acessível a pessoas com deficiência relaciona-se a S; implementar canal de denúncias e supervisão de riscos relaciona-se a G. Um projeto pode afetar mais de uma dimensão."}, {"title": "Guia de Conduta Ética do Banestes", "html": "<p>O Guia é exigido nominalmente no edital. Segundo a página\ninstitucional de integridade, alcança administradores, integrantes de\nconselhos e comitês, empregados, estagiários e prestadores de serviços\ndo Sistema Financeiro Banestes. A página também destaca assédios,\nconflitos de interesse, nepotismo/favoritismo e incompatibilidade de\natividades como condutas inadequadas. Estude diretamente o documento:\nabrangência, princípios, relacionamentos, uso de informações e recursos,\ncondutas vedadas, conflitos, comunicação de irregularidades e\nresponsabilidades. Esta síntese não é transcrição do Guia nem fixa\nlimites de presentes ou procedimentos que precisam ser conferidos na\nversão oficial.<\/p>\n<p><strong>Leitura indispensável:<\/strong> <a class=\"uri\" href=\"https://www.banestes.com.br/institucional/integridade-etica.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.banestes.com.br/institucional/integridade-etica.html<\/a>.\nLink indicado pelo edital: <a class=\"uri\" href=\"https://www.banestes.com.br/institucional/pdf/guia_de_conduta_etica.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.banestes.com.br/institucional/pdf/guia_de_conduta_etica.pdf<\/a>.\nCaso o PDF não abra, procure a versão vigente na página institucional.\nUma cópia institucional datada de março de 2020 está disponível em <a class=\"uri\" href=\"https://ri.banestes.com.br/docs/banestes-2020-03-18-zhpphPhq.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ri.banestes.com.br/docs/banestes-2020-03-18-zhpphPhq.pdf<\/a>,\ntambém vinculada na página de governança do Banestes.<\/p>\n<h3 class=\"unnumbered\" id=\"pontos-específicos-do-guia-de-2020\">Pontos\nespecíficos do Guia de 2020<\/h3>\n<p>O Título I estabelece princípios gerais para o SFB; os Títulos II e\nIII tratam, respectivamente, da atuação profissional no mercado\nfinanceiro e de capitais e da administração de carteiras. O Guia prevê\nadesão formal dos profissionais e atribui à GEREH tarefas relacionadas à\ndivulgação e à documentação. Os valores institucionais abrangem foco no\ncliente, inovação, comprometimento, rentabilidade, ética e valorização\ndos colaboradores. Entre os princípios, probidade diz respeito à\nhonestidade, prudência ao cuidado com decisões, idoneidade à aptidão\ntécnica, legal e moral; igualdade de tratamento repudia discriminação. O\nConselho de Conduta Ética exerce função orientadora e preventiva e\nadministra o Guia. Conforme item 8.9 do Título I, suspeitas ou\nconhecimento de irregularidades devem ser reportados imediatamente à\nchefia e, quando isso não for possível, ao Conselho. O silêncio diante\nde violação conhecida não é conduta neutra. Estude também regras\nsetoriais de sigilo, conflitos e informações privilegiadas. Consulte a\nredação literal no PDF para perguntas sobre atribuições e procedimentos\nespecíficos.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Aplicação prática<\/strong><\/p>\n<p>Ao receber solicitação de informação sigilosa de terceiro sem\nautorização, o empregado não deve fornecer o dado; deve orientar sobre o\nprocedimento formal cabível. Cortesia no atendimento não significa\nflexibilizar sigilo e controle.<\/p>\n<\/div>\n", "id": "etica-08", "number": 8, "examples": 1, "exercises": 0, "search": "O Guia é exigido nominalmente no edital. Segundo a página institucional de integridade, alcança administradores, integrantes de conselhos e comitês, empregados, estagiários e prestadores de serviços do Sistema Financeiro Banestes. A página também destaca assédios, conflitos de interesse, nepotismo/favoritismo e incompatibilidade de atividades como condutas inadequadas. Estude diretamente o documento: abrangência, princípios, relacionamentos, uso de informações e recursos, condutas vedadas, conflitos, comunicação de irregularidades e responsabilidades. Esta síntese não é transcrição do Guia nem fixa limites de presentes ou procedimentos que precisam ser conferidos na versão oficial. Leitura indispensável: https://www.banestes.com.br/institucional/integridade-etica.html . Link indicado pelo edital: https://www.banestes.com.br/institucional/pdf/guia_de_conduta_etica.pdf . Caso o PDF não abra, procure a versão vigente na página institucional. Uma cópia institucional datada de março de 2020 está disponível em https://ri.banestes.com.br/docs/banestes-2020-03-18-zhpphPhq.pdf , também vinculada na página de governança do Banestes. Pontos específicos do Guia de 2020 O Título I estabelece princípios gerais para o SFB; os Títulos II e III tratam, respectivamente, da atuação profissional no mercado financeiro e de capitais e da administração de carteiras. O Guia prevê adesão formal dos profissionais e atribui à GEREH tarefas relacionadas à divulgação e à documentação. Os valores institucionais abrangem foco no cliente, inovação, comprometimento, rentabilidade, ética e valorização dos colaboradores. Entre os princípios, probidade diz respeito à honestidade, prudência ao cuidado com decisões, idoneidade à aptidão técnica, legal e moral; igualdade de tratamento repudia discriminação. O Conselho de Conduta Ética exerce função orientadora e preventiva e administra o Guia. Conforme item 8.9 do Título I, suspeitas ou conhecimento de irregularidades devem ser reportados imediatamente à chefia e, quando isso não for possível, ao Conselho. O silêncio diante de violação conhecida não é conduta neutra. Estude também regras setoriais de sigilo, conflitos e informações privilegiadas. Consulte a redação literal no PDF para perguntas sobre atribuições e procedimentos específicos. Exemplo resolvido · Aplicação prática Ao receber solicitação de informação sigilosa de terceiro sem autorização, o empregado não deve fornecer o dado; deve orientar sobre o procedimento formal cabível. Cortesia no atendimento não significa flexibilizar sigilo e controle."}, {"title": "Fixação comentada", "html": "<div class=\"exercise\">\n<p><strong>Questão 1.<\/strong> Transparência exige publicar dados\nbancários individuais?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não; deve coexistir com sigilo e proteção\nde dados.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 2.<\/strong> A auditoria interna substitui controles da\noperação?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não. Ela avalia controles; a gestão deve\nmantê-los.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 3.<\/strong> Qual dimensão ESG abrange independência do\nconselho e controles anticorrupção?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Governança.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 4.<\/strong> É correto retalhar empregado que denuncia\nirregularidade de boa-fé?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não; a integridade exige proteção contra\nretaliação e apuração adequada.<\/p><\/details>\n<\/div>\n", "id": "etica-09", "number": 9, "examples": 0, "exercises": 4, "search": "Questão 1. Transparência exige publicar dados bancários individuais? Ver resposta comentada Não; deve coexistir com sigilo e proteção de dados. Questão 2. A auditoria interna substitui controles da operação? Ver resposta comentada Não. Ela avalia controles; a gestão deve mantê-los. Questão 3. Qual dimensão ESG abrange independência do conselho e controles anticorrupção? Ver resposta comentada Governança. Questão 4. É correto retalhar empregado que denuncia irregularidade de boa-fé? Ver resposta comentada Não; a integridade exige proteção contra retaliação e apuração adequada."}], "id": "etica", "short": "Ética, Compliance e ESG", "icon": "◇", "questions": 5, "description": "Integridade, governança e responsabilidade.", "group": "gerais"}, {"title": "Conhecimentos Bancários e Securitários", "intro": "<p>Este é o capítulo de maior incidência individual na prova. Comece por\ndistinguir instituições, operações e produtos, depois avance para\nregulamentação, proteção do cliente e seguros.<\/p>\n", "sections": [{"title": "Estrutura do Sistema Financeiro Nacional", "html": "<p>O SFN reúne órgãos e instituições que facilitam a circulação de\nmoeda, o crédito, a poupança, o investimento e a gestão de riscos.\nAgentes superavitários possuem recursos disponíveis; deficitários\nprecisam captar recursos. A intermediação aproxima esses agentes,\ntransforma prazos e distribui riscos. A estrutura pode ser compreendida\nem três níveis: normatização, supervisão e operação.<\/p>\n<div class=\"center\">\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Área<\/th>\n<th style=\"text-align: left;\">Órgão normativo<\/th>\n<th style=\"text-align: left;\">Supervisão<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Moeda e crédito<\/td>\n<td style=\"text-align: left;\">CMN<\/td>\n<td style=\"text-align: left;\">BCB<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Valores mobiliários<\/td>\n<td style=\"text-align: left;\">CMN (diretrizes gerais)<\/td>\n<td style=\"text-align: left;\">CVM<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Seguros, capitalização e previdência\naberta<\/td>\n<td style=\"text-align: left;\">CNSP<\/td>\n<td style=\"text-align: left;\">Susep<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Previdência complementar fechada<\/td>\n<td style=\"text-align: left;\">CNPC<\/td>\n<td style=\"text-align: left;\">Previc<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<p>O Conselho Monetário Nacional formula diretrizes para moeda e crédito\ne estabelece normas para o funcionamento do sistema financeiro dentro de\nsuas competências. O Banco Central executa política monetária, emite\nmoeda, administra reservas internacionais, supervisiona instituições sob\nsua competência, atua na estabilidade e regula sistemas de pagamentos. A\nCVM fiscaliza o mercado de valores mobiliários, protege investidores e\npromove seu funcionamento regular; não define a Selic. O CNSP estabelece\ndiretrizes para seguros privados, capitalização e previdência aberta; a\nSusep supervisiona esses mercados. CNPC e Previc normatizam e\nsupervisionam, respectivamente, a previdência complementar fechada. Não\nconfunda BCB, banco central, com Banco do Brasil, banco\ncomercial/múltiplo e operador.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Competência institucional<\/strong><\/p>\n<p>Associe: I. definir a meta da Selic; II. fiscalizar companhia aberta\nno mercado de valores mobiliários; III. supervisionar seguradora; IV.\nestabelecer diretrizes monetárias. <strong>Resolução.<\/strong> I: Copom,\ndo BCB; II: CVM; III: Susep; IV: CMN. A distinção entre normatizar,\nexecutar e fiscalizar é decisiva.<\/p>\n<\/div>\n", "id": "bancarios-01", "number": 1, "examples": 1, "exercises": 0, "search": "O SFN reúne órgãos e instituições que facilitam a circulação de moeda, o crédito, a poupança, o investimento e a gestão de riscos. Agentes superavitários possuem recursos disponíveis; deficitários precisam captar recursos. A intermediação aproxima esses agentes, transforma prazos e distribui riscos. A estrutura pode ser compreendida em três níveis: normatização, supervisão e operação. Área Órgão normativo Supervisão Moeda e crédito CMN BCB Valores mobiliários CMN (diretrizes gerais) CVM Seguros, capitalização e previdência aberta CNSP Susep Previdência complementar fechada CNPC Previc O Conselho Monetário Nacional formula diretrizes para moeda e crédito e estabelece normas para o funcionamento do sistema financeiro dentro de suas competências. O Banco Central executa política monetária, emite moeda, administra reservas internacionais, supervisiona instituições sob sua competência, atua na estabilidade e regula sistemas de pagamentos. A CVM fiscaliza o mercado de valores mobiliários, protege investidores e promove seu funcionamento regular; não define a Selic. O CNSP estabelece diretrizes para seguros privados, capitalização e previdência aberta; a Susep supervisiona esses mercados. CNPC e Previc normatizam e supervisionam, respectivamente, a previdência complementar fechada. Não confunda BCB, banco central, com Banco do Brasil, banco comercial/múltiplo e operador. Exemplo resolvido · Competência institucional Associe: I. definir a meta da Selic; II. fiscalizar companhia aberta no mercado de valores mobiliários; III. supervisionar seguradora; IV. estabelecer diretrizes monetárias. Resolução. I: Copom, do BCB; II: CVM; III: Susep; IV: CMN. A distinção entre normatizar, executar e fiscalizar é decisiva."}, {"title": "Instituições financeiras e de pagamento", "html": "<p>Bancos comerciais captam depósitos à vista e realizam operações de\ncrédito; bancos múltiplos reúnem carteiras autorizadas sob uma\ninstituição. Bancos de investimento atuam na estruturação de operações,\nfinanciamento e captação de médio/longo prazo, sem captar depósitos à\nvista como banco comercial. Bancos de desenvolvimento apoiam projetos e\nfinanciamento produtivo. Cooperativas de crédito prestam serviços aos\nassociados sob lógica cooperativista, em que o associado também\nparticipa da organização. Corretoras e distribuidoras intermedeiam\ninvestimentos e valores mobiliários conforme autorizações.<\/p>\n<p>Instituições de pagamento podem emitir moeda eletrônica, gerir contas\nde pagamento, credenciar estabelecimentos, emitir instrumentos pós-pagos\nou iniciar pagamentos. Não são instituições financeiras por definição e\nnão podem praticar atividades privativas de instituição financeira sem\nautorização pertinente. Uma conta de pagamento pré-paga utiliza saldo\npreviamente aportado; uma pós-paga registra transações para pagamento\nposterior. Diferencie saldo em conta de pagamento e depósito bancário:\nproteção e regime jurídico não são necessariamente os mesmos.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Identificação do operador<\/strong><\/p>\n<p>Uma empresa oferece carteira digital e permite transferência de\nsaldo, mas não concede empréstimos por conta própria como banco. Isso é\ncompatível com instituição de pagamento. Oferecer aplicativo e\npagamentos não transforma automaticamente a empresa em banco.<\/p>\n<\/div>\n", "id": "bancarios-02", "number": 2, "examples": 1, "exercises": 0, "search": "Bancos comerciais captam depósitos à vista e realizam operações de crédito; bancos múltiplos reúnem carteiras autorizadas sob uma instituição. Bancos de investimento atuam na estruturação de operações, financiamento e captação de médio/longo prazo, sem captar depósitos à vista como banco comercial. Bancos de desenvolvimento apoiam projetos e financiamento produtivo. Cooperativas de crédito prestam serviços aos associados sob lógica cooperativista, em que o associado também participa da organização. Corretoras e distribuidoras intermedeiam investimentos e valores mobiliários conforme autorizações. Instituições de pagamento podem emitir moeda eletrônica, gerir contas de pagamento, credenciar estabelecimentos, emitir instrumentos pós-pagos ou iniciar pagamentos. Não são instituições financeiras por definição e não podem praticar atividades privativas de instituição financeira sem autorização pertinente. Uma conta de pagamento pré-paga utiliza saldo previamente aportado; uma pós-paga registra transações para pagamento posterior. Diferencie saldo em conta de pagamento e depósito bancário: proteção e regime jurídico não são necessariamente os mesmos. Exemplo resolvido · Identificação do operador Uma empresa oferece carteira digital e permite transferência de saldo, mas não concede empréstimos por conta própria como banco. Isso é compatível com instituição de pagamento. Oferecer aplicativo e pagamentos não transforma automaticamente a empresa em banco."}, {"title": "Contas, cartões e meios de pagamento", "html": "<p>Conta corrente (depósito à vista) permite movimentação de recursos e\ncontratação de serviços; poupança combina depósito e remuneração segundo\nregras próprias; conta-salário recebe remuneração de vínculo conveniado,\ncom características específicas e portabilidade; conta de pagamento\nviabiliza pagamentos. A abertura e movimentação exigem identificação e\ncontroles proporcionais ao risco.<\/p>\n<p>Cartão de débito utiliza saldo disponível; cartão de crédito permite\npagar posteriormente, sujeito a limite e condições; pré-pago exige saldo\naportado. O rotativo surge quando parte da fatura elegível não é quitada\nintegralmente, observadas regras e limites regulatórios. Boleto é\ninstrumento de cobrança; cheque é ordem de pagamento à vista; TED\ntransfere recursos dentro de regras de horário e liquidação; Pix é\ninstantâneo. Débito automático exige autorização. Canais incluem\nagência, caixa eletrônico, internet banking, aplicativo, telefone,\ncorrespondentes e atendimento assistido. Confirme autenticidade de\nboletos e destinatários antes de concluir pagamentos.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Escolha do meio<\/strong><\/p>\n<p>Um cliente quer transferir recursos imediatamente em um domingo.\nEntre cheque, TED convencional e Pix, o Pix é adequado à necessidade de\ntransferência instantânea, desde que haja saldo, limites e participantes\nhabilitados. Um cartão de crédito não é, por natureza, uma transferência\nimediata do saldo da conta.<\/p>\n<\/div>\n", "id": "bancarios-03", "number": 3, "examples": 1, "exercises": 0, "search": "Conta corrente (depósito à vista) permite movimentação de recursos e contratação de serviços; poupança combina depósito e remuneração segundo regras próprias; conta-salário recebe remuneração de vínculo conveniado, com características específicas e portabilidade; conta de pagamento viabiliza pagamentos. A abertura e movimentação exigem identificação e controles proporcionais ao risco. Cartão de débito utiliza saldo disponível; cartão de crédito permite pagar posteriormente, sujeito a limite e condições; pré-pago exige saldo aportado. O rotativo surge quando parte da fatura elegível não é quitada integralmente, observadas regras e limites regulatórios. Boleto é instrumento de cobrança; cheque é ordem de pagamento à vista; TED transfere recursos dentro de regras de horário e liquidação; Pix é instantâneo. Débito automático exige autorização. Canais incluem agência, caixa eletrônico, internet banking, aplicativo, telefone, correspondentes e atendimento assistido. Confirme autenticidade de boletos e destinatários antes de concluir pagamentos. Exemplo resolvido · Escolha do meio Um cliente quer transferir recursos imediatamente em um domingo. Entre cheque, TED convencional e Pix, o Pix é adequado à necessidade de transferência instantânea, desde que haja saldo, limites e participantes habilitados. Um cartão de crédito não é, por natureza, uma transferência imediata do saldo da conta."}, {"title": "Crédito, garantias e custo de operações", "html": "<p>Crédito é disponibilização de recursos com compromisso de pagamento\nfuturo. Empréstimo costuma ter destinação livre; financiamento\nnormalmente vincula-se a um bem ou finalidade. Consignado tem parcelas\ndescontadas da folha/benefício conforme regras; cheque especial é limite\nrotativo ligado à conta; capital de giro financia necessidades\noperacionais de empresa; crédito imobiliário financia imóvel. Compare\nprazo, taxa, garantias, amortização e CET, que inclui juros e despesas\nintegrantes da operação segundo a regulamentação, expresso como taxa\nanual. Taxa de juros anunciada não é necessariamente o custo total.<\/p>\n<p>Garantias pessoais: fiança (contrato acessório) e aval (garantia\ncambial em título de crédito). Garantias reais: hipoteca (bem imóvel\ngeralmente permanece com devedor), penhor (bens móveis, conforme\nmodalidade), alienação fiduciária (propriedade resolúvel transferida\ncomo garantia). Garantia não elimina risco de inadimplência. Análise de\ncrédito considera renda/capacidade de pagamento, histórico, finalidade,\ngarantias e condições econômicas; não se confunde com discriminação\nindevida. Os cinco Cs de crédito são caráter, capacidade, capital,\ncolateral e condições.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Taxa versus CET<\/strong><\/p>\n<p>Oferta A: taxa de 1,4% ao mês, com custos adicionais. Oferta B: taxa\nde 1,5% ao mês, sem esses custos. Não se pode concluir que A seja mais\nbarata apenas pela taxa nominal. Compare CET, valor líquido liberado,\nprazo, parcelas e condições em bases equivalentes.<\/p>\n<\/div>\n", "id": "bancarios-04", "number": 4, "examples": 1, "exercises": 0, "search": "Crédito é disponibilização de recursos com compromisso de pagamento futuro. Empréstimo costuma ter destinação livre; financiamento normalmente vincula-se a um bem ou finalidade. Consignado tem parcelas descontadas da folha/benefício conforme regras; cheque especial é limite rotativo ligado à conta; capital de giro financia necessidades operacionais de empresa; crédito imobiliário financia imóvel. Compare prazo, taxa, garantias, amortização e CET, que inclui juros e despesas integrantes da operação segundo a regulamentação, expresso como taxa anual. Taxa de juros anunciada não é necessariamente o custo total. Garantias pessoais: fiança (contrato acessório) e aval (garantia cambial em título de crédito). Garantias reais: hipoteca (bem imóvel geralmente permanece com devedor), penhor (bens móveis, conforme modalidade), alienação fiduciária (propriedade resolúvel transferida como garantia). Garantia não elimina risco de inadimplência. Análise de crédito considera renda/capacidade de pagamento, histórico, finalidade, garantias e condições econômicas; não se confunde com discriminação indevida. Os cinco Cs de crédito são caráter, capacidade, capital, colateral e condições. Exemplo resolvido · Taxa versus CET Oferta A: taxa de 1,4% ao mês, com custos adicionais. Oferta B: taxa de 1,5% ao mês, sem esses custos. Não se pode concluir que A seja mais barata apenas pela taxa nominal. Compare CET, valor líquido liberado, prazo, parcelas e condições em bases equivalentes."}, {"title": "Captação, aplicação, intermediação e spread", "html": "<p>Captação é obtenção de recursos, por depósitos e títulos de emissão\nda instituição, por exemplo. Aplicação é destinação de recursos a\noperações de crédito e investimentos. Spread é a diferença entre taxas\nde aplicação e de captação em bases comparáveis. Ele reflete custos\nadministrativos, risco, tributos, encargos e margem; não equivale\nintegralmente a lucro líquido. Bancos também obtêm receitas por serviços\ne assumem riscos de liquidez, crédito, mercado e operação.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Spread simplificado<\/strong><\/p>\n<p>Se a taxa de captação é 10% ao ano e a de empréstimo 18% ao ano, em\numa mesma base, a diferença é 8 pontos percentuais. Isso não significa\nlucro de 8%: ainda existem despesas, inadimplência e outros\ncomponentes.<\/p>\n<\/div>\n", "id": "bancarios-05", "number": 5, "examples": 1, "exercises": 0, "search": "Captação é obtenção de recursos, por depósitos e títulos de emissão da instituição, por exemplo. Aplicação é destinação de recursos a operações de crédito e investimentos. Spread é a diferença entre taxas de aplicação e de captação em bases comparáveis. Ele reflete custos administrativos, risco, tributos, encargos e margem; não equivale integralmente a lucro líquido. Bancos também obtêm receitas por serviços e assumem riscos de liquidez, crédito, mercado e operação. Exemplo resolvido · Spread simplificado Se a taxa de captação é 10% ao ano e a de empréstimo 18% ao ano, em uma mesma base, a diferença é 8 pontos percentuais. Isso não significa lucro de 8%: ainda existem despesas, inadimplência e outros componentes."}, {"title": "Investimentos e perfil de risco", "html": "<p>Renda fixa possui regra de remuneração previamente definida, como\ntaxa prefixada, pós-fixada ou híbrida. Prefixado permite conhecer a taxa\ncontratada, mas pode oscilar se vendido antes do vencimento; pós-fixado\ndepende de indicador; híbrido combina índice e taxa. CDB é título de\ndívida bancária; LCI e LCA são títulos bancários vinculados a créditos\nimobiliários e do agronegócio; títulos públicos federais financiam o\nTesouro. Debênture é título de dívida empresarial; ação representa\nparticipação no capital de companhia; fundos reúnem recursos de cotistas\npara aplicar segundo política. Derivativos podem ser usados para\nproteção ou exposição a variações de preços, com riscos relevantes.<\/p>\n<p>Rentabilidade mede ganho; liquidez é facilidade de converter\ninvestimento em dinheiro sem perda relevante; risco envolve\npossibilidade de perdas. Riscos principais: crédito, mercado, liquidez,\ninflação e concentração. Diversificação reduz parte do risco específico,\nnão garante lucro. Marcação a mercado ajusta valor de ativos às\ncondições correntes; títulos prefixados geralmente perdem valor de\nmercado quando a taxa de mercado sobe, mantidos outros fatores.<\/p>\n<p>O FGC é entidade privada que protege determinados créditos elegíveis,\nobservadas condições e limites. Em regras usuais, garantia ordinária de\naté R$ 250 mil por CPF/CNPJ por instituição ou conglomerado, com teto\nglobal de R$ 1 milhão a cada quatro anos para pagamentos de garantias\nsujeitos ao teto; não cobre todos os produtos. CDB, poupança e LCI/LCA\npodem ser cobertos; ações, fundos, debêntures e títulos públicos não são\ncobertos pelo FGC. Consulte regras atualizadas antes da prova.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Escolha de investimento<\/strong><\/p>\n<p>Uma pessoa precisa do dinheiro para emergências a qualquer momento.\nUm produto com elevada volatilidade e carência de três anos é\ninadequado, ainda que prometa retorno potencial maior. Priorize liquidez\ne preservação de recursos, considerando riscos, condições e custos.<\/p>\n<\/div>\n", "id": "bancarios-06", "number": 6, "examples": 1, "exercises": 0, "search": "Renda fixa possui regra de remuneração previamente definida, como taxa prefixada, pós-fixada ou híbrida. Prefixado permite conhecer a taxa contratada, mas pode oscilar se vendido antes do vencimento; pós-fixado depende de indicador; híbrido combina índice e taxa. CDB é título de dívida bancária; LCI e LCA são títulos bancários vinculados a créditos imobiliários e do agronegócio; títulos públicos federais financiam o Tesouro. Debênture é título de dívida empresarial; ação representa participação no capital de companhia; fundos reúnem recursos de cotistas para aplicar segundo política. Derivativos podem ser usados para proteção ou exposição a variações de preços, com riscos relevantes. Rentabilidade mede ganho; liquidez é facilidade de converter investimento em dinheiro sem perda relevante; risco envolve possibilidade de perdas. Riscos principais: crédito, mercado, liquidez, inflação e concentração. Diversificação reduz parte do risco específico, não garante lucro. Marcação a mercado ajusta valor de ativos às condições correntes; títulos prefixados geralmente perdem valor de mercado quando a taxa de mercado sobe, mantidos outros fatores. O FGC é entidade privada que protege determinados créditos elegíveis, observadas condições e limites. Em regras usuais, garantia ordinária de até R$ 250 mil por CPF/CNPJ por instituição ou conglomerado, com teto global de R$ 1 milhão a cada quatro anos para pagamentos de garantias sujeitos ao teto; não cobre todos os produtos. CDB, poupança e LCI/LCA podem ser cobertos; ações, fundos, debêntures e títulos públicos não são cobertos pelo FGC. Consulte regras atualizadas antes da prova. Exemplo resolvido · Escolha de investimento Uma pessoa precisa do dinheiro para emergências a qualquer momento. Um produto com elevada volatilidade e carência de três anos é inadequado, ainda que prometa retorno potencial maior. Priorize liquidez e preservação de recursos, considerando riscos, condições e custos."}, {"title": "Mercados e instrumentos financeiros", "html": "<p>Mercado monetário é associado à gestão de liquidez; crédito à\nintermediação de empréstimos; capitais à captação por valores\nmobiliários; câmbio à negociação de moedas. Bolsa organiza negociação;\ninstituições intermediárias executam ordens conforme regras; custódia\nmantém registro dos ativos; liquidação conclui transferência de recursos\ne títulos. Mercado primário envolve emissão; secundário, negociação\nposterior. Ações ordinárias geralmente conferem voto; preferenciais\npodem conferir vantagens econômicas ou outras previstas no estatuto.\nDebêntures não tornam credor acionista por si mesmas. Fundos têm cotas e\npatrimônio próprio, não depósitos bancários.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Investidor e credor<\/strong><\/p>\n<p>Ao comprar debênture emitida por uma empresa, o investidor em regra\ntorna-se credor, recebendo condições de remuneração conforme escritura.\nAo comprar ação, torna-se acionista e participa do risco empresarial. Os\ndireitos são distintos.<\/p>\n<\/div>\n", "id": "bancarios-07", "number": 7, "examples": 1, "exercises": 0, "search": "Mercado monetário é associado à gestão de liquidez; crédito à intermediação de empréstimos; capitais à captação por valores mobiliários; câmbio à negociação de moedas. Bolsa organiza negociação; instituições intermediárias executam ordens conforme regras; custódia mantém registro dos ativos; liquidação conclui transferência de recursos e títulos. Mercado primário envolve emissão; secundário, negociação posterior. Ações ordinárias geralmente conferem voto; preferenciais podem conferir vantagens econômicas ou outras previstas no estatuto. Debêntures não tornam credor acionista por si mesmas. Fundos têm cotas e patrimônio próprio, não depósitos bancários. Exemplo resolvido · Investidor e credor Ao comprar debênture emitida por uma empresa, o investidor em regra torna-se credor, recebendo condições de remuneração conforme escritura. Ao comprar ação, torna-se acionista e participa do risco empresarial. Os direitos são distintos."}, {"title": "Política monetária, Copom e indicadores", "html": "<p>O Copom define a meta Selic. O BCB opera no mercado aberto, usa\ninstrumentos de liquidez e depósitos compulsórios, entre outros\nmecanismos, para implementar política monetária. Compra de títulos pelo\nBCB tende, isoladamente, a injetar liquidez; venda, a retirar.\nCompulsório é parcela de recursos captados sujeita a recolhimento\nconforme regras. A elevação da Selic pode aumentar o retorno de\naplicações referenciadas e encarecer novos créditos; os efeitos não são\ninstantâneos nem idênticos para todos os produtos.<\/p>\n<p>IPCA mede inflação de consumo segundo metodologia do IBGE; PIB mede\nprodução final; taxa DI é referência de operações entre instituições;\ncâmbio mede preço de moeda estrangeira em moeda local. Juros nominais e\nreais são diferentes (capítulo de Matemática Financeira).<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Operação de mercado aberto<\/strong><\/p>\n<p>Mantidas as demais condições, o BCB vende títulos para instituições\nfinanceiras. Elas pagam com recursos disponíveis, de modo que a operação\ntende a retirar liquidez. Isso não equivale automaticamente a aumentar\ncompulsório, pois são instrumentos distintos.<\/p>\n<\/div>\n", "id": "bancarios-08", "number": 8, "examples": 1, "exercises": 0, "search": "O Copom define a meta Selic. O BCB opera no mercado aberto, usa instrumentos de liquidez e depósitos compulsórios, entre outros mecanismos, para implementar política monetária. Compra de títulos pelo BCB tende, isoladamente, a injetar liquidez; venda, a retirar. Compulsório é parcela de recursos captados sujeita a recolhimento conforme regras. A elevação da Selic pode aumentar o retorno de aplicações referenciadas e encarecer novos créditos; os efeitos não são instantâneos nem idênticos para todos os produtos. IPCA mede inflação de consumo segundo metodologia do IBGE; PIB mede produção final; taxa DI é referência de operações entre instituições; câmbio mede preço de moeda estrangeira em moeda local. Juros nominais e reais são diferentes (capítulo de Matemática Financeira). Exemplo resolvido · Operação de mercado aberto Mantidas as demais condições, o BCB vende títulos para instituições financeiras. Elas pagam com recursos disponíveis, de modo que a operação tende a retirar liquidez. Isso não equivale automaticamente a aumentar compulsório, pois são instrumentos distintos."}, {"title": "Pix, Open Finance e pagamentos digitais", "html": "<p>Pix utiliza infraestrutura e regras do BCB, com possibilidade de QR\nCode, chave, dados de conta e outras jornadas autorizadas. A chave pode\nser CPF/CNPJ, telefone, e-mail ou aleatória, observadas regras. O DICT é\ndiretório de identificadores de contas transacionais; SPI é sistema de\nliquidação de pagamentos instantâneos do BCB. Pix pode ter limites e\ntarifas em hipóteses previstas; não se deve generalizar que toda\noperação é ilimitada ou gratuita.<\/p>\n<p>Open Finance depende de compartilhamento seguro, padronizado e\ncontrolado pelo usuário nas jornadas que exigem consentimento; pode\nabranger dados cadastrais, transacionais e serviços. Cliente deve\nconseguir gerenciar consentimentos e conhecer finalidade. Iniciação de\npagamento permite começar a transação por instituição iniciadora sem\nprecisar iniciar diretamente na interface da instituição detentora de\nconta. Carteiras digitais, tokenização de cartões, biometria e\npagamentos por aproximação aumentam conveniência, exigindo gestão de\nfraude e privacidade.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Distinção de infraestrutura<\/strong><\/p>\n<p>A chave Pix facilita localizar a conta do recebedor, mas não é a\nconta em si; um cliente pode alterar a chave segundo regras sem alterar\nautomaticamente seu saldo. O compartilhamento de histórico financeiro\npara comparar propostas se refere ao Open Finance, não ao DICT.<\/p>\n<\/div>\n", "id": "bancarios-09", "number": 9, "examples": 1, "exercises": 0, "search": "Pix utiliza infraestrutura e regras do BCB, com possibilidade de QR Code, chave, dados de conta e outras jornadas autorizadas. A chave pode ser CPF/CNPJ, telefone, e-mail ou aleatória, observadas regras. O DICT é diretório de identificadores de contas transacionais; SPI é sistema de liquidação de pagamentos instantâneos do BCB. Pix pode ter limites e tarifas em hipóteses previstas; não se deve generalizar que toda operação é ilimitada ou gratuita. Open Finance depende de compartilhamento seguro, padronizado e controlado pelo usuário nas jornadas que exigem consentimento; pode abranger dados cadastrais, transacionais e serviços. Cliente deve conseguir gerenciar consentimentos e conhecer finalidade. Iniciação de pagamento permite começar a transação por instituição iniciadora sem precisar iniciar diretamente na interface da instituição detentora de conta. Carteiras digitais, tokenização de cartões, biometria e pagamentos por aproximação aumentam conveniência, exigindo gestão de fraude e privacidade. Exemplo resolvido · Distinção de infraestrutura A chave Pix facilita localizar a conta do recebedor, mas não é a conta em si; um cliente pode alterar a chave segundo regras sem alterar automaticamente seu saldo. O compartilhamento de histórico financeiro para comparar propostas se refere ao Open Finance, não ao DICT."}, {"title": "Prevenção à lavagem de dinheiro e ao financiamento do terrorismo", "html": "<p>A Lei 9.613/1998 dispõe sobre lavagem de dinheiro e obrigações de\nprevenção para setores abrangidos. No sistema financeiro, políticas e\ncontroles devem ser proporcionais ao risco, conforme normas aplicáveis,\nincluindo Circular BCB 3.978/2020 e atualizações. Conheça seu cliente\n(KYC) envolve identificação, qualificação e classificação de risco;\nbeneficiário final identifica pessoa natural que controla ou se\nbeneficia da estrutura conforme regras. PEP (pessoa exposta\npoliticamente) demanda diligência adequada, não pressupõe crime.<\/p>\n<p>Instituições devem manter registros, monitorar operações, selecionar\ne analisar situações atípicas e comunicar ao Coaf nos casos exigidos,\nsem revelar indevidamente a comunicação ao envolvido. O Coaf é a unidade\nbrasileira de inteligência financeira: recebe, examina e dissemina\ninformações financeiras nos termos legais, não julga nem condena\ncriminalmente. Financiamento do terrorismo pode usar recursos de origem\nlícita ou ilícita; o objetivo é financiar atividades terroristas. A Lei\n13.260/2016 é referência complementar.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Situação atípica<\/strong><\/p>\n<p>O sistema sinaliza movimentação incompatível com o perfil cadastral.\nA resposta correta não é acusar publicamente o cliente nem ignorar o\nalerta: deve-se seguir os procedimentos internos de análise, registros e\ncomunicação quando cabível. Atipicidade é indicador, não prova isolada\nde crime.<\/p>\n<\/div>\n", "id": "bancarios-10", "number": 10, "examples": 1, "exercises": 0, "search": "A Lei 9.613/1998 dispõe sobre lavagem de dinheiro e obrigações de prevenção para setores abrangidos. No sistema financeiro, políticas e controles devem ser proporcionais ao risco, conforme normas aplicáveis, incluindo Circular BCB 3.978/2020 e atualizações. Conheça seu cliente (KYC) envolve identificação, qualificação e classificação de risco; beneficiário final identifica pessoa natural que controla ou se beneficia da estrutura conforme regras. PEP (pessoa exposta politicamente) demanda diligência adequada, não pressupõe crime. Instituições devem manter registros, monitorar operações, selecionar e analisar situações atípicas e comunicar ao Coaf nos casos exigidos, sem revelar indevidamente a comunicação ao envolvido. O Coaf é a unidade brasileira de inteligência financeira: recebe, examina e dissemina informações financeiras nos termos legais, não julga nem condena criminalmente. Financiamento do terrorismo pode usar recursos de origem lícita ou ilícita; o objetivo é financiar atividades terroristas. A Lei 13.260/2016 é referência complementar. Exemplo resolvido · Situação atípica O sistema sinaliza movimentação incompatível com o perfil cadastral. A resposta correta não é acusar publicamente o cliente nem ignorar o alerta: deve-se seguir os procedimentos internos de análise, registros e comunicação quando cabível. Atipicidade é indicador, não prova isolada de crime."}, {"title": "Educação financeira, proteção e adequação ao cliente", "html": "<p>O Código de Defesa do Consumidor (Lei 8.078/1990) estabelece direitos\nà informação clara e proteção contra abusos, aplicáveis às relações de\nconsumo bancárias. Venda casada condiciona indevidamente um produto à\naquisição de outro; publicidade enganosa distorce informação ou omite\ndado essencial. O consumidor deve poder comparar CET, condições de\nresgate, custos, riscos, coberturas e exclusões. Resolução CMN\n4.949/2021 é referência para princípios e procedimentos de\nrelacionamento com clientes e usuários de produtos e serviços\nfinanceiros; regras de suitability da CVM são relevantes no mercado de\nvalores mobiliários. Adequação considera objetivos, prazo, tolerância e\ncapacidade financeira, experiência e conhecimento.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Venda responsável<\/strong><\/p>\n<p>O cliente solicita empréstimo e o atendente exige aquisição de seguro\nnão obrigatório e sem alternativa. Essa condição pode caracterizar venda\ncasada. Informe coberturas e custos, ofereça separadamente quando\npermitido e não imponha produto desnecessário.<\/p>\n<\/div>\n", "id": "bancarios-11", "number": 11, "examples": 1, "exercises": 0, "search": "O Código de Defesa do Consumidor (Lei 8.078/1990) estabelece direitos à informação clara e proteção contra abusos, aplicáveis às relações de consumo bancárias. Venda casada condiciona indevidamente um produto à aquisição de outro; publicidade enganosa distorce informação ou omite dado essencial. O consumidor deve poder comparar CET, condições de resgate, custos, riscos, coberturas e exclusões. Resolução CMN 4.949/2021 é referência para princípios e procedimentos de relacionamento com clientes e usuários de produtos e serviços financeiros; regras de suitability da CVM são relevantes no mercado de valores mobiliários. Adequação considera objetivos, prazo, tolerância e capacidade financeira, experiência e conhecimento. Exemplo resolvido · Venda responsável O cliente solicita empréstimo e o atendente exige aquisição de seguro não obrigatório e sem alternativa. Essa condição pode caracterizar venda casada. Informe coberturas e custos, ofereça separadamente quando permitido e não imponha produto desnecessário."}, {"title": "Seguros: conceitos, princípios e participantes", "html": "<p>Seguro é mecanismo de transferência de riscos delimitados mediante\nprêmio, com obrigação da seguradora conforme cobertura e contrato.\nSegurado é pessoa ou interesse protegido; estipulante contrata seguro\ncoletivo em nome de grupo, conforme regras; beneficiário recebe\nprestação quando cabível; corretor intermedeia; seguradora assume\nriscos; resseguradora assume riscos transferidos pela seguradora.\nApólice ou documento contratual formaliza condições; sinistro é\nocorrência de evento coberto; indenização ou capital segurado é\nprestação prevista; franquia é parcela suportada pelo segurado em\ncoberturas aplicáveis; carência é intervalo durante o qual determinada\ncobertura não produz efeito, quando permitido; exclusão delimita risco\nnão coberto. Vigência é período de cobertura.<\/p>\n<p>Mutualismo distribui perdas entre participantes mediante técnica\natuarial; boa-fé e informações relevantes sustentam avaliação do risco;\nindenização nos seguros de danos em regra recompõe prejuízo coberto até\nos limites, sem enriquecimento indevido; seguros de pessoas seguem\nlógica de capital/benefício pactuado. A Lei 15.040/2024 estabelece\nnormas de seguro privado e entrou em vigor em dezembro de 2025; consulte\ntambém at
