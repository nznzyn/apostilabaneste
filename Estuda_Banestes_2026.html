enas por integrarem mesmo grupo. Mantenha registro das operações, política de retenção, acesso por perfil, criptografia, treinamento e plano de resposta a incidentes. Incidente com risco ou dano relevante deve ser comunicado nos termos da LGPD e regulamentação da ANPD. Art. 20: titular pode solicitar revisão de decisão tomada unicamente com base em tratamento automatizado de dados pessoais que afete interesses, inclusive perfil de crédito. Controlador deve fornecer informações claras sobre critérios e procedimentos quando solicitado, respeitados segredos comercial e industrial conforme lei. O artigo não impõe genericamente revisão por pessoa natural em todos os casos. Sistemas devem ser avaliados quanto a vieses e erros. Exemplo resolvido · Crédito negado automaticamente Cliente tem proposta negada exclusivamente por sistema automatizado. Ele pode solicitar revisão nos termos do art. 20. O banco deve tratar a solicitação conforme legislação, informar critérios e procedimentos na extensão cabível, verificar dados e riscos discriminatórios, sem divulgar dados de terceiros ou segredos protegidos indevidamente."}, {"title": "IA, aprendizado de máquina e IA generativa", "html": "<p>Inteligência artificial é campo de sistemas que realizam tarefas\nassociadas a capacidades cognitivas. Aprendizado de máquina aprende\npadrões a partir de dados; aprendizado supervisionado usa exemplos\nrotulados (fraude/não fraude), não supervisionado identifica estruturas\nsem rótulos prévios (agrupamento de perfis); aprendizado por reforço\notimiza ações por recompensas. IA generativa produz texto, imagens,\ncódigo ou outros conteúdos; modelo de linguagem estima padrões de texto\ne pode gerar respostas plausíveis porém incorretas (alucinações).\nProcessamento de linguagem natural (PLN) trata linguagem humana, por\nexemplo classificação de mensagens e extração de informação. Chatbots\ndialogam com usuários e podem usar regras ou IA; automação executa\ntarefas repetitivas e não exige necessariamente IA.<\/p>\n<p>Gemini no Workspace pode apoiar elaboração de textos, resumos,\norganização de informações, apresentações e análise de planilhas, de\nacordo com licenças, permissões e recursos disponíveis. Não autoriza\nenvio de dados bancários para ferramentas não aprovadas. Revise\nprecisão, fontes, cálculos, confidencialidade e adequação antes de usar\nresultados. Prompt é instrução fornecida ao modelo; instrução clara\ninclui tarefa, contexto permitido, formato e restrições. Dados e\ndocumentos externos podem conter instruções maliciosas; não permita que\nconteúdo não confiável substitua regras de segurança.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Qual técnica?<\/strong><\/p>\n<p>Banco treina modelo com transações previamente rotuladas como\nfraudulentas ou legítimas: aprendizado supervisionado de classificação.\nAgrupar clientes sem rótulos: aprendizado não supervisionado. Gerar\nrascunho de resposta ao cliente: IA generativa. Automação que envia\nlembrete em data fixa não exige aprendizado de máquina.<\/p>\n<\/div>\n", "id": "informatica-09", "number": 9, "examples": 1, "exercises": 0, "search": "Inteligência artificial é campo de sistemas que realizam tarefas associadas a capacidades cognitivas. Aprendizado de máquina aprende padrões a partir de dados; aprendizado supervisionado usa exemplos rotulados (fraude/não fraude), não supervisionado identifica estruturas sem rótulos prévios (agrupamento de perfis); aprendizado por reforço otimiza ações por recompensas. IA generativa produz texto, imagens, código ou outros conteúdos; modelo de linguagem estima padrões de texto e pode gerar respostas plausíveis porém incorretas (alucinações). Processamento de linguagem natural (PLN) trata linguagem humana, por exemplo classificação de mensagens e extração de informação. Chatbots dialogam com usuários e podem usar regras ou IA; automação executa tarefas repetitivas e não exige necessariamente IA. Gemini no Workspace pode apoiar elaboração de textos, resumos, organização de informações, apresentações e análise de planilhas, de acordo com licenças, permissões e recursos disponíveis. Não autoriza envio de dados bancários para ferramentas não aprovadas. Revise precisão, fontes, cálculos, confidencialidade e adequação antes de usar resultados. Prompt é instrução fornecida ao modelo; instrução clara inclui tarefa, contexto permitido, formato e restrições. Dados e documentos externos podem conter instruções maliciosas; não permita que conteúdo não confiável substitua regras de segurança. Exemplo resolvido · Qual técnica? Banco treina modelo com transações previamente rotuladas como fraudulentas ou legítimas: aprendizado supervisionado de classificação. Agrupar clientes sem rótulos: aprendizado não supervisionado. Gerar rascunho de resposta ao cliente: IA generativa. Automação que envia lembrete em data fixa não exige aprendizado de máquina."}, {"title": "IA aplicada, vieses, explicabilidade e governança", "html": "<p>IA pode estimar risco de crédito, identificar operações atípicas,\nauxiliar atendimento, organizar documentos e personalizar ofertas. Falso\npositivo sinaliza caso legítimo; falso negativo deixa passar caso\nirregular. Viés decorre de dados históricos, seleção, rótulos, variáveis\ncorrelacionadas a atributos protegidos ou mudanças de contexto.\nExplicabilidade busca tornar fatores e funcionamento compreensíveis\nconforme necessidade; interpretabilidade é capacidade de entender\nrelações do modelo. Governança inclui inventário, aprovação,\nresponsáveis, avaliação de qualidade, segurança, testes, monitoramento,\ndocumentação, supervisão proporcional e mecanismo de contestação.\nProteja contra vazamento, entradas maliciosas e resultados inventados.\nIA apoia, mas não elimina responsabilidade humana e institucional.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Viés e validação<\/strong><\/p>\n<p>Um modelo apresenta alto acerto global, mas nega crédito\ndesproporcionalmente a grupo por variável que funciona como substituto\nde atributo sensível. Acurácia não comprova equidade. Investigue causas,\nqualidade e legitimidade das variáveis; teste desempenho por grupos de\nforma legal, corrija problemas, documente e permita revisão nos termos\naplicáveis.<\/p>\n<\/div>\n", "id": "informatica-10", "number": 10, "examples": 1, "exercises": 0, "search": "IA pode estimar risco de crédito, identificar operações atípicas, auxiliar atendimento, organizar documentos e personalizar ofertas. Falso positivo sinaliza caso legítimo; falso negativo deixa passar caso irregular. Viés decorre de dados históricos, seleção, rótulos, variáveis correlacionadas a atributos protegidos ou mudanças de contexto. Explicabilidade busca tornar fatores e funcionamento compreensíveis conforme necessidade; interpretabilidade é capacidade de entender relações do modelo. Governança inclui inventário, aprovação, responsáveis, avaliação de qualidade, segurança, testes, monitoramento, documentação, supervisão proporcional e mecanismo de contestação. Proteja contra vazamento, entradas maliciosas e resultados inventados. IA apoia, mas não elimina responsabilidade humana e institucional. Exemplo resolvido · Viés e validação Um modelo apresenta alto acerto global, mas nega crédito desproporcionalmente a grupo por variável que funciona como substituto de atributo sensível. Acurácia não comprova equidade. Investigue causas, qualidade e legitimidade das variáveis; teste desempenho por grupos de forma legal, corrija problemas, documente e permita revisão nos termos aplicáveis."}, {"title": "Fixação comentada", "html": "<div class=\"exercise\">\n<p><strong>Questão 1.<\/strong> DNS e HTTPS são equivalentes?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não. DNS resolve nomes; HTTPS protege\ncomunicação web com TLS.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 2.<\/strong> Qual ferramenta Google cria formulários e\npode reunir respostas em planilha?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Forms, integrado a Sheets.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 3.<\/strong> Qual pilar CID é violado quando dados são\nalterados sem autorização?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Integridade.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 4.<\/strong> Consentimento é a única base da LGPD?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não. Art. 7º contém diversas bases; art. 11\ntrata sensíveis.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 5.<\/strong> Um arquivo compartilhado com editor pode\nser modificado?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Em geral sim, conforme permissões e\nrestrições aplicáveis.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 6.<\/strong> IA generativa sempre apresenta fatos\nverdadeiros?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não. Exige verificação; pode produzir\ninformações incorretas.<\/p><\/details>\n<\/div>\n", "id": "informatica-11", "number": 11, "examples": 0, "exercises": 6, "search": "Questão 1. DNS e HTTPS são equivalentes? Ver resposta comentada Não. DNS resolve nomes; HTTPS protege comunicação web com TLS. Questão 2. Qual ferramenta Google cria formulários e pode reunir respostas em planilha? Ver resposta comentada Forms, integrado a Sheets. Questão 3. Qual pilar CID é violado quando dados são alterados sem autorização? Ver resposta comentada Integridade. Questão 4. Consentimento é a única base da LGPD? Ver resposta comentada Não. Art. 7º contém diversas bases; art. 11 trata sensíveis. Questão 5. Um arquivo compartilhado com editor pode ser modificado? Ver resposta comentada Em geral sim, conforme permissões e restrições aplicáveis. Questão 6. IA generativa sempre apresenta fatos verdadeiros? Ver resposta comentada Não. Exige verificação; pode produzir informações incorretas."}], "id": "informatica", "short": "Informática e Comportamentos Digitais", "icon": "⌘", "questions": 5, "description": "Tecnologia, segurança, LGPD e inteligência artificial.", "group": "especificos"}, {"title": "Vendas, Negociação e Atendimento", "intro": "", "sections": [{"title": "Atendimento, qualidade e satisfação", "html": "<p>Atendimento é interação para identificar e resolver necessidades do\ncliente. Qualidade envolve confiabilidade (cumprir o prometido),\nresponsividade (agir prontamente), segurança (competência e confiança),\nempatia (atenção individual) e aspectos tangíveis (ambiente e\ncomunicação), dimensões frequentemente associadas ao modelo SERVQUAL.\nSatisfação é avaliação do cliente diante de expectativas e percepção do\nserviço; excelência busca consistência, solução e melhoria contínua.\nCliente satisfeito pode não ser fiel; fidelidade exige relacionamento e\nvalor percebido. Atendimento deve ser acessível, inclusivo, respeitoso e\nseguro, mesmo sob pressão de metas.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Qualidade de atendimento<\/strong><\/p>\n<p>Um cliente espera 40 minutos, mas recebe resposta correta. A\nqualidade técnica pode ser boa, enquanto responsividade é insuficiente.\nO gestor deve analisar tempo e resolução, não apenas precisão ou rapidez\nisoladamente.<\/p>\n<\/div>\n", "id": "vendas-01", "number": 1, "examples": 1, "exercises": 0, "search": "Atendimento é interação para identificar e resolver necessidades do cliente. Qualidade envolve confiabilidade (cumprir o prometido), responsividade (agir prontamente), segurança (competência e confiança), empatia (atenção individual) e aspectos tangíveis (ambiente e comunicação), dimensões frequentemente associadas ao modelo SERVQUAL. Satisfação é avaliação do cliente diante de expectativas e percepção do serviço; excelência busca consistência, solução e melhoria contínua. Cliente satisfeito pode não ser fiel; fidelidade exige relacionamento e valor percebido. Atendimento deve ser acessível, inclusivo, respeitoso e seguro, mesmo sob pressão de metas. Exemplo resolvido · Qualidade de atendimento Um cliente espera 40 minutos, mas recebe resposta correta. A qualidade técnica pode ser boa, enquanto responsividade é insuficiente. O gestor deve analisar tempo e resolução, não apenas precisão ou rapidez isoladamente."}, {"title": "Comunicação interpessoal e relacionamento presencial/digital", "html": "<p>Comunicação envolve emissor, mensagem, canal, receptor, feedback e\nruídos. Escuta ativa exige atenção, perguntas, paráfrase e confirmação\nde entendimento. Comunicação assertiva expressa informação com clareza e\nrespeito, sem agressividade ou passividade. Comunicação verbal e não\nverbal devem ser coerentes; atendimento escrito requer objetividade,\nlinguagem acessível e revisão. Perguntas abertas exploram necessidades\n(“Qual seu objetivo?”); fechadas confirmam informações (“O prazo é de\nseis meses?”). Empatia reconhece perspectiva sem prometer o impossível.\nVerifique identidade por meios autorizados, especialmente no digital;\nnão peça senha ou código secreto.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Escuta ativa<\/strong><\/p>\n<p>Cliente diz que não entende a fatura. Antes de oferecer outro cartão,\npergunte quais cobranças geram dúvida, escute, explique cada item e\nconfirme compreensão. Esse processo identifica a necessidade real e\nreduz ruídos.<\/p>\n<\/div>\n", "id": "vendas-02", "number": 2, "examples": 1, "exercises": 0, "search": "Comunicação envolve emissor, mensagem, canal, receptor, feedback e ruídos. Escuta ativa exige atenção, perguntas, paráfrase e confirmação de entendimento. Comunicação assertiva expressa informação com clareza e respeito, sem agressividade ou passividade. Comunicação verbal e não verbal devem ser coerentes; atendimento escrito requer objetividade, linguagem acessível e revisão. Perguntas abertas exploram necessidades (“Qual seu objetivo?”); fechadas confirmam informações (“O prazo é de seis meses?”). Empatia reconhece perspectiva sem prometer o impossível. Verifique identidade por meios autorizados, especialmente no digital; não peça senha ou código secreto. Exemplo resolvido · Escuta ativa Cliente diz que não entende a fatura. Antes de oferecer outro cartão, pergunte quais cobranças geram dúvida, escute, explique cada item e confirme compreensão. Esse processo identifica a necessidade real e reduz ruídos."}, {"title": "Perfil, necessidades e comportamento do consumidor", "html": "<p>Segmentação agrupa clientes por características relevantes, como\nnecessidades, estágio de vida, comportamento e objetivos, de forma não\ndiscriminatória. Perfil financeiro considera capacidade de pagamento,\nhorizonte, liquidez, risco, experiência, preferências e\nvulnerabilidades. Necessidade é problema a resolver; desejo é forma\npreferida; demanda depende também de capacidade e disposição para\ncontratar. Decisão de compra envolve reconhecimento de necessidade,\nbusca de informações, avaliação de alternativas, compra e pós-compra.\nViés de ancoragem prende atenção ao primeiro preço; aversão à perda\naumenta peso percebido das perdas; efeito de enquadramento muda\npercepção conforme apresentação. Não explore vieses para induzir\ncontratação inadequada.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Diagnóstico de perfil<\/strong><\/p>\n<p>Cliente de baixa tolerância a risco precisa de recursos em dois\nmeses. A necessidade é liquidez e preservação, não maior retorno\npossível. Uma oferta ilíquida de prazo longo não é adequada, mesmo com\ncomissão mais alta para o vendedor.<\/p>\n<\/div>\n", "id": "vendas-03", "number": 3, "examples": 1, "exercises": 0, "search": "Segmentação agrupa clientes por características relevantes, como necessidades, estágio de vida, comportamento e objetivos, de forma não discriminatória. Perfil financeiro considera capacidade de pagamento, horizonte, liquidez, risco, experiência, preferências e vulnerabilidades. Necessidade é problema a resolver; desejo é forma preferida; demanda depende também de capacidade e disposição para contratar. Decisão de compra envolve reconhecimento de necessidade, busca de informações, avaliação de alternativas, compra e pós-compra. Viés de ancoragem prende atenção ao primeiro preço; aversão à perda aumenta peso percebido das perdas; efeito de enquadramento muda percepção conforme apresentação. Não explore vieses para induzir contratação inadequada. Exemplo resolvido · Diagnóstico de perfil Cliente de baixa tolerância a risco precisa de recursos em dois meses. A necessidade é liquidez e preservação, não maior retorno possível. Uma oferta ilíquida de prazo longo não é adequada, mesmo com comissão mais alta para o vendedor."}, {"title": "Técnicas de vendas consultivas e pós-venda", "html": "<p>Venda consultiva identifica problema antes de recomendar solução.\nEtapas: preparação e prospecção; abordagem; diagnóstico; apresentação de\nalternativas; tratamento de objeções; fechamento consciente; pós-venda.\nNo modelo SPIN, perguntas de situação levantam contexto; problema\nidentifica dificuldade; implicação explora consequências; necessidade de\nsolução evidencia benefício. Diferencie característica (atributo do\nproduto), vantagem (capacidade) e benefício (valor concreto para o\ncliente). Cross-selling oferece produto complementar; up-selling oferece\nversão de maior valor. Ambas exigem adequação e liberdade de escolha.\nNão confunda objeção legítima com obstáculo a ser vencido a qualquer\ncusto.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>SPIN e oferta<\/strong><\/p>\n<p>Uma microempresa relata atraso no recebimento de vendas. Situação:\ncomo recebe hoje? Problema: quais dificuldades de caixa? Implicação:\nquais pagamentos são prejudicados? Necessidade: como antecipação ou\nalternativa de organização ajudaria? Só depois compare custos e\nbenefícios. Não ofereça antecipação automaticamente sem avaliar\nnecessidade e CET quando aplicável.<\/p>\n<\/div>\n", "id": "vendas-04", "number": 4, "examples": 1, "exercises": 0, "search": "Venda consultiva identifica problema antes de recomendar solução. Etapas: preparação e prospecção; abordagem; diagnóstico; apresentação de alternativas; tratamento de objeções; fechamento consciente; pós-venda. No modelo SPIN, perguntas de situação levantam contexto; problema identifica dificuldade; implicação explora consequências; necessidade de solução evidencia benefício. Diferencie característica (atributo do produto), vantagem (capacidade) e benefício (valor concreto para o cliente). Cross-selling oferece produto complementar; up-selling oferece versão de maior valor. Ambas exigem adequação e liberdade de escolha. Não confunda objeção legítima com obstáculo a ser vencido a qualquer custo. Exemplo resolvido · SPIN e oferta Uma microempresa relata atraso no recebimento de vendas. Situação: como recebe hoje? Problema: quais dificuldades de caixa? Implicação: quais pagamentos são prejudicados? Necessidade: como antecipação ou alternativa de organização ajudaria? Só depois compare custos e benefícios. Não ofereça antecipação automaticamente sem avaliar necessidade e CET quando aplicável."}, {"title": "Prospecção, fidelização e retenção", "html": "<p>Prospecção identifica potenciais clientes com interesse legítimo;\nqualificação verifica aderência e necessidade; funil acompanha\noportunidades até contratação. Conversão mede proporção que avança ou\nconclui, com denominador definido. Retenção é manutenção do\nrelacionamento; fidelização envolve preferência e confiança duradouras.\nPós-venda verifica entrega, uso, dúvidas e satisfação, permitindo\ncorrigir problemas. Churn representa perda de clientes em período;\nretenção e churn devem usar definições compatíveis. Não use dados sem\nbase legal ou contatos invasivos. Fidelizar por qualidade é diferente de\ndificultar cancelamento.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Indicadores comerciais<\/strong><\/p>\n<p>De 200 contatos qualificados, 50 contratam: conversão\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>50<\/mn><mi>/<\/mi><mn>200<\/mn><mo>=<\/mo><mn>25<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">=50/200=25\\%<\/annotation><\/semantics><\/math>.\nSe uma carteira começa com 400 clientes e perde 20 desses clientes no\nperíodo, churn da base inicial\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>20<\/mn><mi>/<\/mi><mn>400<\/mn><mo>=<\/mo><mn>5<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">=20/400=5\\%<\/annotation><\/semantics><\/math>.\nRetenção da mesma base =95%, desconsiderando outras mudanças. Novos\nclientes devem ser tratados separadamente na metodologia.<\/p>\n<\/div>\n", "id": "vendas-05", "number": 5, "examples": 1, "exercises": 0, "search": "Prospecção identifica potenciais clientes com interesse legítimo; qualificação verifica aderência e necessidade; funil acompanha oportunidades até contratação. Conversão mede proporção que avança ou conclui, com denominador definido. Retenção é manutenção do relacionamento; fidelização envolve preferência e confiança duradouras. Pós-venda verifica entrega, uso, dúvidas e satisfação, permitindo corrigir problemas. Churn representa perda de clientes em período; retenção e churn devem usar definições compatíveis. Não use dados sem base legal ou contatos invasivos. Fidelizar por qualidade é diferente de dificultar cancelamento. Exemplo resolvido · Indicadores comerciais De 200 contatos qualificados, 50 contratam: conversão = 50 / 200 = 25 % =50/200=25\\% . Se uma carteira começa com 400 clientes e perde 20 desses clientes no período, churn da base inicial = 20 / 400 = 5 % =20/400=5\\% . Retenção da mesma base =95%, desconsiderando outras mudanças. Novos clientes devem ser tratados separadamente na metodologia."}, {"title": "Negociação: etapas, estratégias e técnicas", "html": "<p>Negociação busca acordo entre interesses. Posição é o pedido\ndeclarado (“quero taxa de 1%”); interesse é necessidade subjacente\n(reduzir prestação). Etapas: preparação (dados, objetivo, limites,\nalternativas); abertura; exploração de interesses; construção de opções;\nconcessões; fechamento e implementação. Negociação distributiva divide\nvalor limitado; integrativa busca criar valor conjunto. BATNA, ou melhor\nalternativa a um acordo negociado (MAANA), define opção caso não haja\nacordo; ponto de reserva é limite aceitável; ZOPA é zona de possível\nacordo quando limites são compatíveis. Utilize critérios objetivos,\nescuta, propostas condicionais e registro. Nunca prometa algo fora da\nalçada ou esconda custo.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Zona de acordo<\/strong><\/p>\n<p>Cliente aceita pagar até R$ 120 por serviço; fornecedor aceita\nreceber pelo menos R$ 100. ZOPA de R$ 100 a R$ 120. Se cliente aceita\naté 90 e fornecedor exige 100, não há zona nessas condições; podem\nnegociar escopo ou outra alternativa sem manipulação.<\/p>\n<\/div>\n", "id": "vendas-06", "number": 6, "examples": 1, "exercises": 0, "search": "Negociação busca acordo entre interesses. Posição é o pedido declarado (“quero taxa de 1%”); interesse é necessidade subjacente (reduzir prestação). Etapas: preparação (dados, objetivo, limites, alternativas); abertura; exploração de interesses; construção de opções; concessões; fechamento e implementação. Negociação distributiva divide valor limitado; integrativa busca criar valor conjunto. BATNA, ou melhor alternativa a um acordo negociado (MAANA), define opção caso não haja acordo; ponto de reserva é limite aceitável; ZOPA é zona de possível acordo quando limites são compatíveis. Utilize critérios objetivos, escuta, propostas condicionais e registro. Nunca prometa algo fora da alçada ou esconda custo. Exemplo resolvido · Zona de acordo Cliente aceita pagar até R$ 120 por serviço; fornecedor aceita receber pelo menos R$ 100. ZOPA de R$ 100 a R$ 120. Se cliente aceita até 90 e fornecedor exige 100, não há zona nessas condições; podem negociar escopo ou outra alternativa sem manipulação."}, {"title": "CRM e marketing de relacionamento", "html": "<p>CRM (Customer Relationship Management) é estratégia e conjunto de\nprocessos e ferramentas para gerir relacionamento, registrar contatos,\nentender necessidades, acompanhar oportunidades e prestar serviço\nconsistente. CRM operacional apoia atividades; analítico examina dados;\ncolaborativo integra canais. Não é apenas cadastro nem campanha de\nvendas. Marketing transacional foca transação imediata; relacionamento\nfoca valor duradouro. Jornada do cliente abrange descoberta,\ncontratação, utilização, suporte e eventual encerramento. Experiência\n(CX) é percepção ao longo de pontos de contato; UX é experiência de uso\nde interface/produto. Omnichannel integra canais e contexto, enquanto\nmulticanal pode apenas oferecer vários canais desconectados.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Integração de canais<\/strong><\/p>\n<p>Cliente começa atendimento pelo aplicativo e vai à agência sem\nprecisar repetir todos os dados porque o protocolo autorizado é\nrecuperado. Isso é exemplo de integração omnichannel. Ter aplicativo e\nagência sem continuidade é presença multicanal, não integração\nplena.<\/p>\n<\/div>\n", "id": "vendas-07", "number": 7, "examples": 1, "exercises": 0, "search": "CRM (Customer Relationship Management) é estratégia e conjunto de processos e ferramentas para gerir relacionamento, registrar contatos, entender necessidades, acompanhar oportunidades e prestar serviço consistente. CRM operacional apoia atividades; analítico examina dados; colaborativo integra canais. Não é apenas cadastro nem campanha de vendas. Marketing transacional foca transação imediata; relacionamento foca valor duradouro. Jornada do cliente abrange descoberta, contratação, utilização, suporte e eventual encerramento. Experiência (CX) é percepção ao longo de pontos de contato; UX é experiência de uso de interface/produto. Omnichannel integra canais e contexto, enquanto multicanal pode apenas oferecer vários canais desconectados. Exemplo resolvido · Integração de canais Cliente começa atendimento pelo aplicativo e vai à agência sem precisar repetir todos os dados porque o protocolo autorizado é recuperado. Isso é exemplo de integração omnichannel. Ter aplicativo e agência sem continuidade é presença multicanal, não integração plena."}, {"title": "Métricas de satisfação e melhoria contínua", "html": "<p>CSAT mede satisfação, frequentemente percentual de avaliações\nclassificadas como satisfeitas. NPS (Net Promoter Score) usa pergunta de\nrecomendação de 0 a 10: promotores 9–10, neutros 7–8, detratores 0–6.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N<\/mi><mi>P<\/mi><mi>S<\/mi><mo>=<\/mo><mi>%<\/mi><mtext mathvariant=\"normal\">promotores<\/mtext><mo>−<\/mo><mi>%<\/mi><mtext mathvariant=\"normal\">detratores<\/mtext><\/mrow><annotation encoding=\"application/x-tex\">NPS=\\%\\text{promotores}-\\%\\text{detratores}<\/annotation><\/semantics><\/math>,\nvaria de -100 a 100 pontos. CES mede esforço percebido (interpretação\ndepende da escala). FCR mede resolução no primeiro contato; TMA mede\nduração média de atendimento; SLA estabelece nível de serviço acordado.\nIndicadores precisam de contexto, volume e qualidade; diminuir tempo à\ncusta de resolução é contraproducente.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>NPS<\/strong><\/p>\n<p>Em 100 respostas, 60 são promotores, 25 neutros e 15 detratores.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N<\/mi><mi>P<\/mi><mi>S<\/mi><mo>=<\/mo><mn>60<\/mn><mo>−<\/mo><mn>15<\/mn><mo>=<\/mo><mn>45<\/mn><\/mrow><annotation encoding=\"application/x-tex\">NPS=60-15=45<\/annotation><\/semantics><\/math>\npontos. Neutros não são adicionados nem subtraídos, mas entram no\ndenominador de respostas. Não expresse 45 pontos como satisfação\nnecessariamente de 45%.<\/p>\n<\/div>\n", "id": "vendas-08", "number": 8, "examples": 1, "exercises": 0, "search": "CSAT mede satisfação, frequentemente percentual de avaliações classificadas como satisfeitas. NPS (Net Promoter Score) usa pergunta de recomendação de 0 a 10: promotores 9–10, neutros 7–8, detratores 0–6. N P S = % promotores − % detratores NPS=\\%\\text{promotores}-\\%\\text{detratores} , varia de -100 a 100 pontos. CES mede esforço percebido (interpretação depende da escala). FCR mede resolução no primeiro contato; TMA mede duração média de atendimento; SLA estabelece nível de serviço acordado. Indicadores precisam de contexto, volume e qualidade; diminuir tempo à custa de resolução é contraproducente. Exemplo resolvido · NPS Em 100 respostas, 60 são promotores, 25 neutros e 15 detratores. N P S = 60 − 15 = 45 NPS=60-15=45 pontos. Neutros não são adicionados nem subtraídos, mas entram no denominador de respostas. Não expresse 45 pontos como satisfação necessariamente de 45%."}, {"title": "Produtos e serviços: adequação, ética e transparência", "html": "<p>Oferta responsável vincula características a necessidade: crédito\npara financiar objetivo com capacidade de pagamento; investimento\nadequado a risco, liquidez e prazo; seguro a exposição a riscos;\nprevidência a planejamento de longo prazo; consórcio a aquisição\nplanejada sem urgência garantida. Apresente custos, carências,\nexclusões, condições de cancelamento, riscos e alternativas; confirme\ncompreensão e consentimento quando exigido. Não pratique venda casada,\npublicidade enganosa, pressão abusiva, discriminação ou uso inadequado\nde dados. Normas de relacionamento do CMN/BCB e CDC são referências. O\nobjetivo é valor sustentável, não contratação a qualquer preço.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Oferta inadequada<\/strong><\/p>\n<p>Cliente quer reserva de emergência e atendente apresenta\ncapitalização como aplicação de liquidez imediata e rendimento garantido\nsuperior. A afirmação é inadequada: capitalização possui condições de\nresgate e quotas específicas. Explique diferenças e ofereça alternativa\ncompatível; não disfarce sorteio como rentabilidade.<\/p>\n<\/div>\n", "id": "vendas-09", "number": 9, "examples": 1, "exercises": 0, "search": "Oferta responsável vincula características a necessidade: crédito para financiar objetivo com capacidade de pagamento; investimento adequado a risco, liquidez e prazo; seguro a exposição a riscos; previdência a planejamento de longo prazo; consórcio a aquisição planejada sem urgência garantida. Apresente custos, carências, exclusões, condições de cancelamento, riscos e alternativas; confirme compreensão e consentimento quando exigido. Não pratique venda casada, publicidade enganosa, pressão abusiva, discriminação ou uso inadequado de dados. Normas de relacionamento do CMN/BCB e CDC são referências. O objetivo é valor sustentável, não contratação a qualquer preço. Exemplo resolvido · Oferta inadequada Cliente quer reserva de emergência e atendente apresenta capitalização como aplicação de liquidez imediata e rendimento garantido superior. A afirmação é inadequada: capitalização possui condições de resgate e quotas específicas. Explique diferenças e ofereça alternativa compatível; não disfarce sorteio como rentabilidade."}, {"title": "Conflitos, reclamações e mediação", "html": "<p>Tratamento de reclamação: acolher sem confronto, verificar identidade\ne fatos, registrar protocolo, esclarecer necessidade, propor solução\ndentro de alçada, informar prazos e acompanhar. Escalonar quando\nnecessário; não transferir responsabilidade sem orientar. Mediação\nfacilita diálogo para solução construída pelas partes; conciliação pode\nenvolver propostas de acordo; arbitragem envolve decisão de terceiro\nsegundo requisitos legais, não se confunde com atendimento. SAC é canal\nde atendimento de demandas conforme regulamentação; ouvidoria atua nas\ndemandas não solucionadas nos canais primários e dentro de competências\npróprias. Consumidor pode recorrer a órgãos de defesa e reguladores nas\nhipóteses pertinentes. Não prometa resultado impossível, nem divulgue\ndados de terceiros para justificar demora.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Cliente insatisfeito<\/strong><\/p>\n<p>Cliente relata cobrança não reconhecida. O atendente deve acolher,\nautenticar pelo procedimento correto, registrar, verificar transação,\norientar medidas de segurança e análise/contestação cabíveis, informar\nprotocolo e prazo aplicável. Não se deve acusar o cliente de fraude nem\ngarantir estorno antes da análise.<\/p>\n<\/div>\n", "id": "vendas-10", "number": 10, "examples": 1, "exercises": 0, "search": "Tratamento de reclamação: acolher sem confronto, verificar identidade e fatos, registrar protocolo, esclarecer necessidade, propor solução dentro de alçada, informar prazos e acompanhar. Escalonar quando necessário; não transferir responsabilidade sem orientar. Mediação facilita diálogo para solução construída pelas partes; conciliação pode envolver propostas de acordo; arbitragem envolve decisão de terceiro segundo requisitos legais, não se confunde com atendimento. SAC é canal de atendimento de demandas conforme regulamentação; ouvidoria atua nas demandas não solucionadas nos canais primários e dentro de competências próprias. Consumidor pode recorrer a órgãos de defesa e reguladores nas hipóteses pertinentes. Não prometa resultado impossível, nem divulgue dados de terceiros para justificar demora. Exemplo resolvido · Cliente insatisfeito Cliente relata cobrança não reconhecida. O atendente deve acolher, autenticar pelo procedimento correto, registrar, verificar transação, orientar medidas de segurança e análise/contestação cabíveis, informar protocolo e prazo aplicável. Não se deve acusar o cliente de fraude nem garantir estorno antes da análise."}, {"title": "Transformação digital e educação financeira no atendimento", "html": "<p>Transformação digital redesenha processos e experiência;\ndigitalização simples converte informação para meio eletrônico.\nAtendimento digital pode usar chatbot, aplicativo, videoconferência e\nautoatendimento, com passagem a atendimento humano quando necessário.\nAcessibilidade inclui linguagem simples, compatibilidade com tecnologias\nassistivas, contraste e canais alternativos. Educar financeiramente não\né vender: ajude o cliente a elaborar orçamento, entender juros\ncompostos, comparar CET, evitar endividamento excessivo, criar reserva e\nreconhecer golpes. Explique riscos e responsabilidades sem prestar\npromessa de rentabilidade.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Orientação financeira<\/strong><\/p>\n<p>Cliente usa cheque especial recorrentemente. Em vez de aumentar\nlimite sem análise, entenda fluxo de renda/despesas, explique custo,\ncompare alternativas de renegociação e crédito conforme capacidade,\najude a planejar pagamento e evitar recorrência. A solução deve\nconsiderar bem-estar financeiro do cliente.<\/p>\n<\/div>\n", "id": "vendas-11", "number": 11, "examples": 1, "exercises": 0, "search": "Transformação digital redesenha processos e experiência; digitalização simples converte informação para meio eletrônico. Atendimento digital pode usar chatbot, aplicativo, videoconferência e autoatendimento, com passagem a atendimento humano quando necessário. Acessibilidade inclui linguagem simples, compatibilidade com tecnologias assistivas, contraste e canais alternativos. Educar financeiramente não é vender: ajude o cliente a elaborar orçamento, entender juros compostos, comparar CET, evitar endividamento excessivo, criar reserva e reconhecer golpes. Explique riscos e responsabilidades sem prestar promessa de rentabilidade. Exemplo resolvido · Orientação financeira Cliente usa cheque especial recorrentemente. Em vez de aumentar limite sem análise, entenda fluxo de renda/despesas, explique custo, compare alternativas de renegociação e crédito conforme capacidade, ajude a planejar pagamento e evitar recorrência. A solução deve considerar bem-estar financeiro do cliente."}, {"title": "Fixação comentada", "html": "<div class=\"exercise\">\n<p><strong>Questão 1.<\/strong> Qual é a diferença entre necessidade e\ncaracterística de produto?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Necessidade é problema/objetivo do cliente;\ncaracterística é atributo do produto. Benefício conecta os dois.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 2.<\/strong> NPS com 40% de promotores e 35% de\ndetratores?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> 5 pontos.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 3.<\/strong> CRM equivale a lista de contatos?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não; inclui estratégia, processos,\ntecnologia e gestão do relacionamento.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 4.<\/strong> Cross-selling é necessariamente venda\ncasada?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não, se oferta complementar é livre,\nadequada e transparente. Condicionamento indevido pode caracterizar\nabuso.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 5.<\/strong> Se não há acordo dentro da alçada, deve-se\nprometer condição não autorizada?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não. Informe limites, avalie alternativas e\nencaminhe conforme procedimento.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 6.<\/strong> O cliente satisfeito é necessariamente\nfiel?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não. Satisfação e fidelidade são\nrelacionadas, mas não idênticas.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 7.<\/strong> Atendimento digital elimina a necessidade\nde canais acessíveis?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Não. Inclusão, acessibilidade e segurança\ndevem orientar a estratégia.<\/p><\/details>\n<\/div>\n", "id": "vendas-12", "number": 12, "examples": 0, "exercises": 7, "search": "Questão 1. Qual é a diferença entre necessidade e característica de produto? Ver resposta comentada Necessidade é problema/objetivo do cliente; característica é atributo do produto. Benefício conecta os dois. Questão 2. NPS com 40% de promotores e 35% de detratores? Ver resposta comentada 5 pontos. Questão 3. CRM equivale a lista de contatos? Ver resposta comentada Não; inclui estratégia, processos, tecnologia e gestão do relacionamento. Questão 4. Cross-selling é necessariamente venda casada? Ver resposta comentada Não, se oferta complementar é livre, adequada e transparente. Condicionamento indevido pode caracterizar abuso. Questão 5. Se não há acordo dentro da alçada, deve-se prometer condição não autorizada? Ver resposta comentada Não. Informe limites, avalie alternativas e encaminhe conforme procedimento. Questão 6. O cliente satisfeito é necessariamente fiel? Ver resposta comentada Não. Satisfação e fidelidade são relacionadas, mas não idênticas. Questão 7. Atendimento digital elimina a necessidade de canais acessíveis? Ver resposta comentada Não. Inclusão, acessibilidade e segurança devem orientar a estratégia."}], "id": "vendas", "short": "Vendas, Negociação e Atendimento", "icon": "⇄", "questions": 10, "description": "Relacionamento, negociação e vendas consultivas.", "group": "especificos"}], "guide": {"title": "Como utilizar esta apostila", "intro": "<p>Este material foi elaborado para quem está iniciando a preparação\npara Técnico Bancário e precisa de uma base organizada e gratuita. Os\ncapítulos seguem os grandes temas do Anexo IV do Edital nº 01/2026,\nretificado em 10 de novembro de 2026. As questões são autorais,\nformuladas para treino; não são questões oficiais da FCC. O conteúdo\nnormativo é introdutório e deve ser complementado pela leitura da\nlegislação e dos documentos oficiais indicados ao final. Atualidades\nexigem acompanhamento até a prova; os valores econômicos numéricos dos\nexemplos são hipotéticos.<\/p>\n<div class=\"center\">\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Disciplina<\/th>\n<th style=\"text-align: right;\">Questões<\/th>\n<th style=\"text-align: right;\">Bloco<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Língua Portuguesa<\/td>\n<td style=\"text-align: right;\">10<\/td>\n<td style=\"text-align: right;\">Geral<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Matemática e Raciocínio Lógico<\/td>\n<td style=\"text-align: right;\">10<\/td>\n<td style=\"text-align: right;\">Geral<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Atualidades do Mercado Financeiro<\/td>\n<td style=\"text-align: right;\">5<\/td>\n<td style=\"text-align: right;\">Geral<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Ética, Compliance e ESG<\/td>\n<td style=\"text-align: right;\">5<\/td>\n<td style=\"text-align: right;\">Geral<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Conhecimentos Bancários e\nSecuritários<\/td>\n<td style=\"text-align: right;\">15<\/td>\n<td style=\"text-align: right;\">Específico<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Matemática Financeira<\/td>\n<td style=\"text-align: right;\">5<\/td>\n<td style=\"text-align: right;\">Específico<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Probabilidade e Estatística<\/td>\n<td style=\"text-align: right;\">5<\/td>\n<td style=\"text-align: right;\">Específico<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Informática e Comportamentos Digitais<\/td>\n<td style=\"text-align: right;\">5<\/td>\n<td style=\"text-align: right;\">Específico<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Vendas, Negociação e Atendimento<\/td>\n<td style=\"text-align: right;\">10<\/td>\n<td style=\"text-align: right;\">Específico<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Total<\/td>\n<td style=\"text-align: right;\">70<\/td>\n<td style=\"text-align: right;\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<p>A prova tem quatro horas e cinco alternativas por questão. Conforme\ncapítulo 11 do edital, as notas dos dois blocos são calculadas na escala\nde zero a dez e depois ponderadas com pesos 1 e 2. Não se deve\nsimplesmente dividir a soma de acertos ponderados por 110. Se\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>g<\/mi><annotation encoding=\"application/x-tex\">g<\/annotation><\/semantics><\/math>\ne\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>e<\/mi><annotation encoding=\"application/x-tex\">e<\/annotation><\/semantics><\/math>\nrepresentam acertos gerais e específicos, respectivamente, supondo\nquestões de igual valor dentro de cada bloco,\n<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>N<\/mi><mi>G<\/mi><\/msub><mo>=<\/mo><mn>10<\/mn><mfrac><mi>g<\/mi><mn>30<\/mn><\/mfrac><mo>,<\/mo><mspace width=\"2.0em\"><\/mspace><msub><mi>N<\/mi><mi>E<\/mi><\/msub><mo>=<\/mo><mn>10<\/mn><mfrac><mi>e<\/mi><mn>40<\/mn><\/mfrac><mo>,<\/mo><mspace width=\"2.0em\"><\/mspace><mi>N<\/mi><mo>=<\/mo><mfrac><mrow><msub><mi>N<\/mi><mi>G<\/mi><\/msub><mo>+<\/mo><mn>2<\/mn><msub><mi>N<\/mi><mi>E<\/mi><\/msub><\/mrow><mn>3<\/mn><\/mfrac><mi>.<\/mi><\/mrow><annotation e ><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">P(A^c)=1-P(A)<\/annotation><\/semantics><\/math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∪<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>+<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>−<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">P(A\\cup B)=P(A)+P(B)-P(A\\cap B)<\/annotation><\/semantics><\/math>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Condicional<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∣<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">P(A\\mid B)=P(A\\cap B)/P(B)<\/annotation><\/semantics><\/math>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Independência<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>A<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>P<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>B<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">P(A\\cap B)=P(A)P(B)<\/annotation><\/semantics><\/math>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Normal padrão<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z<\/mi><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mi>μ<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mi>σ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">z=(x-\\mu)/\\sigma<\/annotation><\/semantics><\/math>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">NPS<\/td>\n<td style=\"text-align: left;\">Percentual de promotores menos percentual\nde detratores.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "sections": []}, "sources": {"title": "Fontes oficiais e plano de aprofundamento", "intro": "", "sections": [{"title": "Edital e documentos institucionais", "html": "<ul>\n<li><p>BANESTES. Concurso público nº 01/2026. Edital de abertura\nretificado (10/11/2026), capítulo 9, capítulo 11, Anexo IV e Anexo V.\nPortal oficial: <a class=\"uri\" href=\"https://banestes.com.br/publicacoes_legais/concurso2026.htm\" rel=\"noopener noreferrer\" target=\"_blank\">https://banestes.com.br/publicacoes_legais/concurso2026.htm<\/a>.\nAcompanhe também <a class=\"uri\" href=\"https://www.concursosfcc.com.br/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.concursosfcc.com.br/<\/a>.<\/p><\/li>\n<li><p>BANESTES. Integridade e ética: <a class=\"uri\" href=\"https://www.banestes.com.br/institucional/integridade-etica.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.banestes.com.br/institucional/integridade-etica.html<\/a>.\nGuia indicado no edital: <a class=\"uri\" href=\"https://www.banestes.com.br/institucional/pdf/guia_de_conduta_etica.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.banestes.com.br/institucional/pdf/guia_de_conduta_etica.pdf<\/a>.<\/p><\/li>\n<\/ul>\n"}, {"title": "Mercado financeiro, regulação e atualidades", "html": "<ul>\n<li><p>Banco Central do Brasil. Portal institucional, normativos,\npolítica monetária e serviços: <a class=\"uri\" href=\"https://www.bcb.gov.br/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.bcb.gov.br/<\/a>. Consulte Sistema Financeiro\nNacional, Copom, Focus, Pix, Open Finance, Drex e consórcios.<\/p><\/li>\n<li><p>Resolução CMN nº 4.966/2021, texto consolidado: <a class=\"uri\" href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?numero=4966&amp;tipo=RESOLU%C3%87%C3%83O+CMN\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?numero=4966&amp;tipo=RESOLU%C3%87%C3%83O+CMN<\/a>.\nSe o filtro não abrir, pesquise número 4966 na busca de normativos do\nBCB.<\/p><\/li>\n<li><p>BCB. Cidadania financeira: <a class=\"uri\" href=\"https://www.bcb.gov.br/cidadaniafinanceira\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.bcb.gov.br/cidadaniafinanceira<\/a>; Open\nFinance: <a class=\"uri\" href=\"https://www.bcb.gov.br/meubc/faqs/s/open-finance\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.bcb.gov.br/meubc/faqs/s/open-finance<\/a>.<\/p><\/li>\n<li><p>CVM. Portal do Investidor: <a class=\"uri\" href=\"https://www.gov.br/investidor/pt-br\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.gov.br/investidor/pt-br<\/a>. Consulte Resolução\nCVM nº 30/2021 (adequação ao perfil, com alterações vigentes).<\/p><\/li>\n<li><p>Susep. Orientação ao consumidor sobre seguros, previdência e\ncapitalização: <a class=\"uri\" href=\"https://www.gov.br/susep/pt-br\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.gov.br/susep/pt-br<\/a>; PGBL e VGBL: <a class=\"uri\" href=\"https://www.gov.br/susep/pt-br/assuntos/meu-futuro-seguro/seguros-previdencia-e-capitalizacao/providencia-complementar-aberta/pgbl-vgbl\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.gov.br/susep/pt-br/assuntos/meu-futuro-seguro/seguros-previdencia-e-capitalizacao/providencia-complementar-aberta/pgbl-vgbl<\/a>.<\/p><\/li>\n<li><p>FGC. Garantias e produtos elegíveis: <a class=\"uri\" href=\"https://www.fgc.org.br/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.fgc.org.br/<\/a>.<\/p><\/li>\n<li><p>Coaf. Inteligência financeira: <a class=\"uri\" href=\"https://www.gov.br/coaf/pt-br\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.gov.br/coaf/pt-br<\/a>.<\/p><\/li>\n<li><p>IBGE. Indicadores econômicos: <a class=\"uri\" href=\"https://www.ibge.gov.br/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.ibge.gov.br/<\/a>. Consulte IPCA e Contas\nNacionais.<\/p><\/li>\n<li><p>ONU Brasil. Objetivos de Desenvolvimento Sustentável: <a class=\"uri\" href=\"https://brasil.un.org/pt-br/sdgs\" rel=\"noopener noreferrer\" target=\"_blank\">https://brasil.un.org/pt-br/sdgs<\/a>.<\/p><\/li>\n<\/ul>\n"}, {"title": "Legislação para leitura complementar", "html": "<p>Pesquise as versões consolidadas e datas de vigência conforme a regra\ntemporal do Anexo IV. As normas abaixo são referências de aprofundamento\ndos temas, não uma lista adicional de exigências nominais do edital.<\/p>\n<ul>\n<li><p>Lei 4.595/1964 (SFN); Lei 6.385/1976 (mercado de valores\nmobiliários); Lei 12.865/2013 (arranjos e instituições de pagamento);\nLei 11.795/2008 (consórcios).<\/p><\/li>\n<li><p>Lei 9.613/1998 (lavagem de dinheiro), Lei 13.260/2016\n(terrorismo), Circular BCB 3.978/2020 (PLD/FT), Lei 12.846/2013\n(anticorrupção), Lei 13.303/2016 (estatais).<\/p><\/li>\n<li><p>Lei 8.078/1990 (CDC); LC 105/2001 (sigilo); Resoluções CMN\n4.949/2021 (relacionamento), 4.595/2017 (compliance), 4.968/2021\n(controles internos) e 4.945/2021 (responsabilidade social, ambiental e\nclimática).<\/p><\/li>\n<li><p>Lei 15.040/2024 (seguro privado), LC 109/2001 (previdência\ncomplementar), Lei 14.803/2024 (opção tributária na\nprevidência).<\/p><\/li>\n<li><p>Lei 13.709/2018 (LGPD): <a class=\"uri\" href=\"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709compilado.htm\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709compilado.htm<\/a>.\nANPD: <a class=\"uri\" href=\"https://www.gov.br/anpd/pt-br\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.gov.br/anpd/pt-br<\/a>.<\/p><\/li>\n<li><p>Portal da Legislação Federal: <a class=\"uri\" href=\"https://www4.planalto.gov.br/legislacao\" rel=\"noopener noreferrer\" target=\"_blank\">https://www4.planalto.gov.br/legislacao<\/a>.<\/p><\/li>\n<li><p>Centro de aprendizagem Google Workspace: <a class=\"uri\" href=\"https://support.google.com/a/users/?hl=pt-BR\" rel=\"noopener noreferrer\" target=\"_blank\">https://support.google.com/a/users/?hl=pt-BR<\/a>. Consulte\nas páginas de cada aplicativo e Gemini, pois a interface muda com\natualizações.<\/p><\/li>\n<\/ul>\n"}, {"title": "Checklist final", "html": "<p>Em cada capítulo, marque como dominado apenas o assunto que conseguir\nexplicar sem consulta e resolver em contexto de prova. Revise a leitura\nliteral das normas destacadas; acompanhe atualidades com fontes\noficiais; pratique questões anteriores da FCC de assuntos compatíveis;\nfaça simulados cronometrados. Use as questões autorais deste material\ncomo primeira camada de prática, não como substituição de um banco amplo\nde questões.<\/p>\n"}]}, "quiz": [{"question": "“Embora o crédito fosse vantajoso, o cliente não o contratou.” A\nrelação entre orações é:", "options": ["causa", "finalidade", "concessão", "condição", "consequência."], "correct": 2, "explanation": " Embora indica concessão."}, {"question": "Assinale a frase correta:", "options": ["Haviam três propostas", "Fazem\ntrês dias", "Precisam-se de atendentes", "Existem três propostas", "Segue anexas os documentos."], "correct": 3, "explanation": " Existir concorda com sujeito plural; haver\nexistencial e fazer temporal são impessoais."}, {"question": "Assinale o uso correto de crase:", "options": ["a cliente voltou à pé", "a\ngerente respondeu à solicitação", "começou à trabalhar", "entregou à\nele", "pediu à uma pessoa."], "correct": 1, "explanation": " Responder a + a solicitação gera à."}, {"question": "Um preço cai 10% e sobe 10%. Em relação ao inicial, fica:", "options": ["igual", "1% menor", "1% maior", "10% menor", "20%\nmaior."], "correct": 1, "explanation": "\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>,<\/mo><mn>9<\/mn><mo>⋅<\/mo><mn>1<\/mn><mo>,<\/mo><mn>1<\/mn><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mn>99<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0{,}9\\cdot1{,}1=0{,}99<\/annotation><\/semantics><\/math>,\nqueda de 1%."}, {"question": "A negação de “se estudo, aprendo” é:", "options": ["não estudo e aprendo", "estudo e não aprendo", "não estudo ou aprendo", "se não estudo,\nnão aprendo", "aprendo e estudo."], "correct": 1, "explanation": " A condicional é falsa quando antecedente\nverdadeiro e consequente falso."}, {"question": "Uma equipe de 6 seleciona 2 representantes sem cargos. Quantas\nescolhas?", "options": ["12", "30", "36", "15", "6."], "correct": 3, "explanation": "\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac linethickness=\"0\"><mn>6<\/mn><mn>2<\/mn><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>6<\/mn><mo>⋅<\/mo><mn>5<\/mn><mi>/<\/mi><mn>2<\/mn><mo>=<\/mo><mn>15<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\binom62=6\\cdot5/2=15<\/annotation><\/semantics><\/math>."}, {"question": "Redução da inflação de 7% para 4% indica:", "options": ["deflação", "estabilidade absoluta", "desinflação", "contração do PIB\nobrigatória", "queda de todos os preços."], "correct": 2, "explanation": " A inflação diminuiu, mas continua\npositiva."}, {"question": "O Focus do Banco Central reúne principalmente:", "options": ["projeções de\nparticipantes do mercado", "decisões judiciais", "taxas individuais\nobrigatórias de empréstimo", "resultados de seguradoras", "apenas\ndados realizados."], "correct": 0, "explanation": " Focus é pesquisa de expectativas, não\ndecisão do BCB."}, {"question": "O empregado acessa dados bancários por curiosidade. A conduta:", "options": ["é permitida se não divulgar", "é legítima se conhecer o cliente", "viola finalidade e sigilo", "é autorizada por ter senha", "exige\napenas consulta posterior ao gestor."], "correct": 2, "explanation": " Acesso sem finalidade profissional legítima\nviola deveres mesmo sem divulgação."}, {"question": "O controle que impede o mesmo empregado de autorizar e executar\npagamento é:", "options": ["segregação de funções", "conflito de interesses", "publicidade", "sorteio", "capitalização."], "correct": 0, "explanation": " Separa atividades incompatíveis para\nreduzir risco."}, {"question": "A dimensão de ESG mais diretamente ligada a acessibilidade é:", "options": ["liquidez", "ambiental", "cambial", "social", "monetária."], "correct": 3, "explanation": " Acessibilidade diz respeito a inclusão e\ndireitos sociais."}, {"question": "Quem supervisiona mercado de seguros privados?", "options": ["Copom", "CVM", "Previc", "Susep", "FGC."], "correct": 3, "explanation": " Susep supervisiona seguros privados; CNSP\nnormatiza."}, {"question": "A emissão de um CDB representa para o banco:", "options": ["aquisição de\nparticipação acionária", "captação", "pagamento de sinistro", "emissão de moeda estatal", "recebimento de tributo."], "correct": 1, "explanation": " CDB é obrigação do banco perante o\ninvestidor e instrumento de captação."}, {"question": "Ao adquirir debênture, o investidor torna-se normalmente:", "options": ["acionista necessariamente", "segurado", "credor da companhia", "cotista de consórcio", "autoridade monetária."], "correct": 2, "explanation": " Debênture representa dívida da\nemissora."}, {"question": "A característica correta do VGBL é:", "options": ["dedução de aporte de 12%\nem qualquer declaração", "garantia do FGC", "IR no resgate sobre\nrendimento, observadas regras", "contemplação imediata", "isenção\ngeral de imposto."], "correct": 2, "explanation": " VGBL não possui a dedução típica do PGBL;\ntributação incide sobre rendimentos."}, {"question": "O modelo de perdas esperadas da Resolução CMN 4.966/2021 busca:", "options": ["só reconhecer perdas após inadimplência", "reconhecer provisões\nassociadas a risco prospectivo", "extinguir risco", "proibir\ninstrumentos financeiros", "garantir lucros."], "correct": 1, "explanation": " Reconhecimento de perda esperada incorpora\navaliação prospectiva."}, {"question": "Capital de R$ 2.000 rende 5% a.m. compostos por dois meses.\nMontante:", "options": ["2.100", "2.200", "2.205", "2.250", "2.400."], "correct": 2, "explanation": "\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2000<\/mn><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>,<\/mo><mn>05<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>=<\/mo><mn>2205<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2000(1{,}05)^2=2205<\/annotation><\/semantics><\/math>."}, {"question": "No SAC de taxa fixa sem encargos adicionais, qual elemento\npermanece constante?", "options": ["juros", "saldo", "prestação", "amortização", "montante total a cada mês."], "correct": 3, "explanation": " No SAC,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mi>C<\/mi><mi>/<\/mi><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">A=C/n<\/annotation><\/semantics><\/math>."}, {"question": "Taxa nominal de 10%, inflação de 10%, mesmo período. Taxa real:", "options": ["10%", "1%", "20%", "-10%", "0%."], "correct": 4, "explanation": "\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>,<\/mo><mn>10<\/mn><mi>/<\/mi><mn>1<\/mn><mo>,<\/mo><mn>10<\/mn><mo>−<\/mo><mn>1<\/mn><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1{,}10/1{,}10-1=0<\/annotation><\/semantics><\/math>."}, {"question": "Dados 1, 2, 2, 7. Média e mediana respectivamente:", "options": ["2 e 3", "3 e 2", "3 e 3", "2 e 2", "7 e 2."], "correct": 1, "explanation": " Média\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mi>/<\/mi><mn>4<\/mn><mo>=<\/mo><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">12/4=3<\/annotation><\/semantics><\/math>;\nmediana\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>2<\/mn><mo>+<\/mo><mn>2<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mn>2<\/mn><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">(2+2)/2=2<\/annotation><\/semantics><\/math>."}, {"question": "Eventos independentes com probabilidades 0,6 e 0,2. Interseção:", "options": ["0,8", "0,4", "0,12", "0,2", "0,6."], "correct": 2, "explanation": "\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>,<\/mo><mn>6<\/mn><mo>⋅<\/mo><mn>0<\/mn><mo>,<\/mo><mn>2<\/mn><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mn>12<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0{,}6\\cdot0{,}2=0{,}12<\/annotation><\/semantics><\/math>."}, {"question": "Em distribuição normal,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">z=0<\/annotation><\/semantics><\/math>\ncorresponde:", "options": ["ao máximo valor possível", "à média", "ao desvio\npadrão", "à variância", "ao quartil inferior."], "correct": 1, "explanation": " Quando\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mi>μ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">x=\\mu<\/annotation><\/semantics><\/math>,\no escore padronizado é zero."}, {"question": "Em planilha,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mtext mathvariant=\"monospace\">$𝙰$𝟷<\/mtext><annotation encoding=\"application/x-tex\">\\texttt{\\$A\\$1}<\/annotation><\/semantics><\/math>\nindica:", "options": ["referência relativa", "erro", "função de soma", "referência absoluta", "arquivo criptografado."], "correct": 3, "explanation": " Os cifrões fixam linha e coluna ao copiar\nfórmula."}, {"question": "Um e-mail falso induz o usuário a fornecer credenciais. É exemplo\nde:", "options": ["backup", "phishing", "DNS", "atualização", "compressão."], "correct": 1, "explanation": " Phishing usa engano para induzir entrega de\ninformações ou ação indevida."}, {"question": "Na LGPD, decisões tomadas unicamente por tratamento automatizado\nque afetem interesses do titular podem ensejar:", "options": ["impossibilidade de\nrevisão", "divulgação pública de dados", "direito de solicitar\nrevisão", "extinção da responsabilidade", "consentimento tácito\nuniversal."], "correct": 2, "explanation": " O art. 20 da LGPD prevê direito de\nsolicitar revisão."}, {"question": "O cliente deseja reserva de emergência. O primeiro passo da venda\nconsultiva é:", "options": ["ofertar produto com maior comissão", "entender\nobjetivo, prazo, risco e liquidez", "exigir outro produto", "prometer rentabilidade", "fechar antes de esclarecer custos."], "correct": 1, "explanation": " Diagnóstico precede recomendação\nresponsável."}, {"question": "NPS com 55% de promotores e 20% de detratores é:", "options": ["75", "55", "20", "35", "-35."], "correct": 3, "explanation": "\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>55<\/mn><mo>−<\/mo><mn>20<\/mn><mo>=<\/mo><mn>35<\/mn><\/mrow><annotation encoding=\"application/x-tex\">55-20=35<\/annotation><\/semantics><\/math>\npontos."}, {"question": "Uma negociação que busca criar valor mútuo é predominantemente:", "options": ["integrativa", "coercitiva", "enganosa", "unilateral", "necessariamente distributiva."], "correct": 0, "explanation": " A negociação integrativa explora interesses\ne ganhos conjuntos."}]}</script><script>
'use strict';const D=JSON.parse(document.getElementById('study-data').textContent), S=D.subjects, app=document.getElementById('app');const all=S.flatMap(s=>s.sections.map(t=>({s,t}))),total=all.length;const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('estuda-banestes-'+k))??d}catch{return d}};const save=(k,v)=>{try{localStorage.setItem('estuda-banestes-'+k,JSON.stringify(v))}catch{}};let done=new Set(read('done',[])),last=read('last',null),answers=read('answers',{}),qi=0;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const pct=(a,b)=>Math.round(a/b*100)||0;const sc=s=>s.sections.filter(t=>done.has(t.id)).length;const prog=(a,b)=>`<div class="progress" role="progressbar" aria-valuenow="${pct(a,b)}" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso"><i style="width:${pct(a,b)}%"></i></div>`;const path=(s,t)=>`#/materia/${s.id}${t?'/'+t.id:''}`;const footer=()=>`<footer class="footer">Portal independente de preparação para Técnico Bancário · Conteúdo adaptado da apostila de novembro de 2026 · Não é um site oficial do Banestes ou da FCC.</footer>`;const crumb=(...items)=>`<div class="crumb"><a href="#/">Início</a>${items.map(([t,u])=>`<span>›</span>${u?`<a href="${u}">${esc(t)}</a>`:`<span>${esc(t)}</span>`}`).join('')}</div>`;const stat=(v,l,i)=>`<div class="stat"><span class="stat-icon">${i}</span><div><b>${v}</b><small>${l}</small></div></div>`;const subjectCard=s=>`<a class="subject-card" href="${path(s)}"><div class="cardtop"><span class="subject-icon">${s.icon}</span><span class="tag">${s.questions} questões na prova</span></div><h3>${esc(s.short)}</h3><p>${esc(s.description)}</p><div class="cardfoot"><span>${sc(s)}/${s.sections.length} assuntos</span>${prog(sc(s),s.sections.length)}<span class="arrow">›</span></div></a>`;function home(){const resume=all.find(({t})=>t.id===last)||all[0];app.innerHTML=`<section class="hero"><div><div class="kicker">Edital 01/2026 · Banca FCC</div><h1>Seu próximo passo<br>começa aqui.</h1><p>Estude para Técnico Bancário com teoria organizada, exemplos resolvidos e exercícios comentados. Navegue por disciplina e avance no seu ritmo.</p><div class="hero-actions"><a class="primary" href="${path(resume.s,resume.t)}">${last?'Continuar estudos':'Começar a estudar'} <span>→</span></a><a class="outline" href="#/guia">Como estudar</a></div></div><div class="hero-panel"><div class="kicker">Seu progresso</div><div class="big" style="margin:12px 0 5px">${pct(done.size,total)}%</div><small>${done.size} de ${total} assuntos concluídos</small>${prog(done.size,total)}<small>Seu progresso é salvo neste navegador.</small></div></section><div class="statrow">${stat('9','Disciplinas','▤')}${stat(total,'Assuntos','≡')}${stat('99','Exemplos resolvidos','✓')}${stat('79','Questões de treino','?')}</div><div class="searchbox"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Pesquisar um assunto (ex.: juros compostos, crase, Pix...)" aria-label="Pesquisar assuntos"></div><div id="search-results"></div><div id="subject-groups"><div class="section-head"><h2>Conhecimentos gerais</h2><small>4 disciplinas · 30 questões</small></div><div class="cards">${S.filter(s=>s.group==='gerais').map(subjectCard).join('')}</div><div class="section-head"><h2>Conhecimentos específicos</h2><small>5 disciplinas · 40 questões · peso 2</small></div><div class="cards">${S.filter(s=>s.group==='especificos').map(subjectCard).join('')}</div><div class="section-head"><h2>Materiais complementares</h2></div><div class="topics"><a class="topic-card" href="#/simulado"><span class="topic-number">?</span><div><b>Simulado interativo</b><small>28 questões de múltipla escolha com correção</small></div><span class="arrow">›</span></a><a class="topic-card" href="#/formulario"><span class="topic-number">ƒ</span><div><b>Formulário de revisão</b><small>Equações e conceitos essenciais</small></div><span class="arrow">›</span></a><a class="topic-card" href="#/fontes"><span class="topic-number">↗</span><div><b>Fontes oficiais</b><small>Edital, legislação e materiais de aprofundamento</small></div><span class="arrow">›</span></a><a class="topic-card" href="#/guia"><span class="topic-number">i</span><div><b>Como utilizar o portal</b><small>Estratégia de estudo e cálculo da nota</small></div><span class="arrow">›</span></a></div></div>${footer()}`;document.getElementById('search').addEventListener('input',e=>search(e.target.value));}
function search(v){let q=norm(v.trim()),r=document.getElementById('search-results'),g=document.getElementById('subject-groups');g.hidden=!!q;if(!q){r.innerHTML='';return}let words=q.split(/\s+/),hits=all.map(o=>{let title=norm(o.t.title),sub=norm(o.s.short),body=norm(o.t.search);return {...o,score:words.every(w=>title.includes(w)||sub.includes(w)||body.includes(w))?words.reduce((n,w)=>n+(title.includes(w)?10:sub.includes(w)?4:1),0):0}}).filter(o=>o.score).sort((a,b)=>b.score-a.score);r.innerHTML=`<div class="section-head"><h2>Resultados da busca</h2><small>${hits.length} assuntos encontrados</small></div><div class="panel">${hits.map(({s,t})=>`<a class="result" href="${path(s,t)}"><span class="topic-number ${done.has(t.id)?'done':''}">${done.has(t.id)?'✓':t.number}</span><div><b>${esc(t.title)}</b><small>${esc(s.short)}</small></div><span class="arrow">›</span></a>`).join('')||'<div class="empty">Nenhum assunto encontrado. Tente outra palavra.</div>'}</div>`}
function subject(s){app.innerHTML=`${crumb([s.short])}<section class="subject-banner"><div class="kicker">${s.group==='gerais'?'Conhecimentos gerais':'Conhecimentos específicos'}</div><h1>${esc(s.title)}</h1><p>${s.questions} questões na prova · ${s.sections.length} assuntos · ${sc(s)} concluídos</p>${prog(sc(s),s.sections.length)}</section>${s.intro?`<div class="panel reading-body">${s.intro}</div>`:''}<div class="section-head"><h2>Escolha um assunto</h2><small>${s.sections.length} módulos</small></div><div class="topics">${s.sections.map(t=>`<a class="topic-card" href="${path(s,t)}"><span class="topic-number ${done.has(t.id)?'done':''}">${done.has(t.id)?'✓':String(t.number).padStart(2,'0')}</span><div><b>${esc(t.title)}</b><small>${[t.examples?`${t.examples} exemplo(s)`:'',t.exercises?`${t.exercises} questão(ões)`:''].filter(Boolean).join(' · ')||'Conteúdo teórico'}</small></div><span class="arrow">›</span></a>`).join('')}</div>${footer()}`}
function lesson(s,t){last=t.id;save('last',last);let idx=s.sections.indexOf(t),prev=s.sections[idx-1],next=s.sections[idx+1];app.innerHTML=`${crumb([s.short,path(s)],[t.title])}<div class="reading-layout"><aside class="sidebar"><h3>Assuntos da disciplina</h3>${s.sections.map(x=>`<a class="${x.id===t.id?'active':''}" ${x.id===t.id?'aria-current="page"':''} href="${path(s,x)}"><span>${done.has(x.id)?'✓':String(x.number).padStart(2,'0')}</span>${esc(x.title)}</a>`).join('')}</aside><article class="reader"><div class="reader-head"><div class="kicker">${esc(s.short)} · Assunto ${idx+1} de ${s.sections.length}</div><h1>${esc(t.title)}</h1><button class="outline mark ${done.has(t.id)?'done':''}" id="mark" aria-pressed="${done.has(t.id)}">${done.has(t.id)?'✓ Concluído (desmarcar)':'✓ Marcar como estudado'}</button></div><div class="reading-body">${t.html}</div><div class="lesson-nav"><a class="outline" href="${prev?path(s,prev):path(s)}">← ${prev?'Anterior':'Todos os assuntos'}</a><a class="primary" id="next" href="${next?path(s,next):path(s)}">${next?'Próximo assunto':'Voltar à disciplina'} →</a></div></article></div>${footer()}`;document.getElementById('mark').onclick=()=>{const y=scrollY;done.has(t.id)?done.delete(t.id):done.add(t.id);save('done',[...done]);lesson(s,t);scrollTo(0,y)};}
function extra(key){let c=key==='guia'?D.guide:key==='formulario'?D.formula:D.sources;let title=key==='guia'?'Como utilizar o portal':c.title;app.innerHTML=`${crumb([title])}<article class="reader" style="max-width:950px;margin:auto"><div class="reader-head"><div class="kicker">Material complementar</div><h1>${esc(title)}</h1></div><div class="reading-body">${c.intro}${c.sections.map(t=>`<h2>${esc(t.title)}</h2>${t.html}`).join('')}</div></article>${footer()}`}
function quiz(){let q=D.quiz[qi],n=D.quiz.length,selected=answers[qi],answered=Number.isInteger(selected),correct=Object.entries(answers).filter(([i,v])=>D.quiz[i]?.correct===v).length,completed=Object.keys(answers).length;app.innerHTML=`${crumb(['Simulado'])}<article class="reader" style="max-width:900px;margin:auto"><div class="reader-head"><div class="kicker">Questões autorais de revisão</div><h1>Simulado interativo</h1><p style="color:var(--muted)">${completed}/${n} respondidas · ${correct} acertos ${completed?'· '+pct(correct,completed)+'% de aproveitamento':''}</p>${prog(completed,n)}<div class="quiz-dots">${D.quiz.map((x,i)=>`<button data-q="${i}" class="${i===qi?'current ':''}${Number.isInteger(answers[i])?(answers[i]===x.correct?'correct':'wrong'):''}" aria-label="Questão ${i+1}">${i+1}</button>`).join('')}</div></div><div class="kicker">Questão ${qi+1} de ${n}</div><div class="reading-body"><h2 style="margin-top:8px;font-size:20px;color:var(--ink)">${q.question}</h2>${q.options.map((o,i)=>`<button class="quiz-option ${answered?(i===q.correct?'correct':i===selected?'wrong':''):''}" data-opt="${i}" ${answered?'disabled':''}><span>${'ABCDE'[i]}.</span><span>${o}</span></button>`).join('')}${answered?`<div class="quiz-feedback"><b>${selected===q.correct?'Resposta correta!':'Resposta incorreta — alternativa correta: '+'ABCDE'[q.correct]}</b><p style="margin:6px 0 0">${q.explanation}</p></div>`:''}${completed===n?`<div class="panel"><b>Simulado concluído:</b> ${correct} de ${n} acertos (${pct(correct,n)}%). Revise as questões incorretas.</div>`:''}</div><div class="lesson-nav"><button class="outline" id="qprev" ${qi===0?'disabled':''}>← Anterior</button><button class="outline" id="qreset">Reiniciar simulado</button><button class="primary" id="qnext" ${qi===n-1?'disabled':''}>Próxima →</button></div></article>${footer()}`;app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{qi=+b.dataset.q;quiz()});app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(!answered){answers[qi]=+b.dataset.opt;save('answers',answers);quiz()}});document.getElementById('qprev').onclick=()=>{if(qi>0){qi--;quiz()}};document.getElementById('qnext').onclick=()=>{if(qi<n-1){qi++;quiz()}};document.getElementById('qreset').onclick=()=>{if(confirm('Apagar todas as respostas deste simulado?')){answers={};qi=0;save('answers',answers);quiz()}}}
function route(){let parts=location.hash.replace(/^#\/?/,'').split('/'),k=parts[0];document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===(k==='materia'||!k?'home':k)));if(k==='materia'){let s=S.find(x=>x.id===parts[1]);if(!s)home();else{let t=s.sections.find(x=>x.id===parts[2]);t?lesson(s,t):subject(s)}}else if(k==='simulado')quiz();else if(['guia','formulario','fontes'].includes(k))extra(k);else home();scrollTo(0,0)};window.addEventListener('hashchange',route);let dark=read('dark',false);document.body.classList.toggle('dark',dark);document.getElementById('theme').onclick=()=>{dark=!dark;document.body.classList.toggle('dark',dark);save('dark',dark)};route();</script></body></html>
