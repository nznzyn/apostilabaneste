id-template-columns:1fr}.subject-card{min-height:155px;padding:15px}.hero h1{font-size:34px}.stat{padding:12px 10px;gap:7px}.stat b{font-size:23px}.stat-icon{width:30px;height:30px}.top{gap:8px}.brand small{font-size:10px}.nav a{font-size:12px}.nav{width:100%}.theme{margin-left:auto}.reader{padding:18px 15px}.reading-body{font-size:15.5px}.subject-banner{padding:21px}.hero{padding:23px 20px}.lesson-nav .primary,.lesson-nav .outline{font-size:12px;padding:10px}.section-head small{font-size:11px}}@media print{header,.sidebar,.lesson-nav,.crumb,.footer{display:none}.shell{padding:0}.reading-layout{display:block}.reader{border:0;box-shadow:none;padding:0}}
</style></head><body><header><div class="top"><a class="brand" href="#/"><div class="brandmark" aria-hidden="true">e.</div><div><strong>estuda banestes</strong><small>Preparação independente · 2026</small></div></a><nav class="nav" aria-label="Navegação principal"><a href="#/" data-page="home">Disciplinas</a><a href="#/simulado" data-page="simulado">Simulado</a><a href="#/formulario" data-page="formulario">Fórmulas</a><a href="#/fontes" data-page="fontes">Fontes</a><button class="theme" id="theme" aria-label="Alternar tema" title="Alternar tema">◐</button></nav></div></header><main class="shell" id="app"></main><script id="study-data" type="application/json">{"subjects": [{"title": "Língua Portuguesa", "intro": "<p>A prova de Português exige interpretar o sentido do texto e\nidentificar as relações sintáticas e semânticas que o sustentam. Estude\na regra junto com o efeito produzido pela construção, não apenas por\nmemorização de nomenclaturas.<\/p>\n", "sections": [{"title": "Compreensão, interpretação, gêneros e contexto", "html": "<p>Compreensão é a recuperação de informações explicitadas;\ninterpretação inclui inferências autorizadas pelo texto. Tema é o\nassunto; tese é a posição defendida; argumento é a justificativa. A\ninformação implícita não pode contrariar a evidência textual.\nPressuposto é conteúdo acionado por marcas linguísticas (“voltou a\nestudar” pressupõe estudo anterior); subentendido depende do\ncontexto.<\/p>\n<p>Gêneros textuais são práticas comunicativas: notícia informa\nacontecimentos, editorial expressa posicionamento institucional, artigo\nde opinião argumenta, crônica aborda situações cotidianas, relatório\nexpõe dados, anúncio persuade. Tipos textuais (narração, descrição,\nexposição, argumentação, injunção) podem coexistir num gênero. O\ncontexto histórico explica referências, vocabulário e valores de época;\nnão autoriza atribuir ao autor fatos que não estejam demonstrados.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Inferência e tese<\/strong><\/p>\n<p>Leia: “A digitalização facilita operações bancárias, mas a expansão\ndo acesso depende também de educação financeira e inclusão digital.”\nQual é a tese: (A) todo atendimento presencial é inútil; (B) a\ntecnologia, sozinha, não assegura inclusão; (C) a digitalização deve ser\nabandonada; (D) a inclusão já foi alcançada; (E) educação substitui\nbancos? <strong>Resolução.<\/strong> A primeira oração reconhece uma\nvantagem. A conjunção adversativa “mas” introduz a ressalva: há outros\nrequisitos. As demais alternativas extrapolam ou contradizem o texto.\n<strong>B.<\/strong><\/p>\n<\/div>\n", "id": "portugues-01", "number": 1, "examples": 1, "exercises": 0, "search": "Compreensão é a recuperação de informações explicitadas; interpretação inclui inferências autorizadas pelo texto. Tema é o assunto; tese é a posição defendida; argumento é a justificativa. A informação implícita não pode contrariar a evidência textual. Pressuposto é conteúdo acionado por marcas linguísticas (“voltou a estudar” pressupõe estudo anterior); subentendido depende do contexto. Gêneros textuais são práticas comunicativas: notícia informa acontecimentos, editorial expressa posicionamento institucional, artigo de opinião argumenta, crônica aborda situações cotidianas, relatório expõe dados, anúncio persuade. Tipos textuais (narração, descrição, exposição, argumentação, injunção) podem coexistir num gênero. O contexto histórico explica referências, vocabulário e valores de época; não autoriza atribuir ao autor fatos que não estejam demonstrados. Exemplo resolvido · Inferência e tese Leia: “A digitalização facilita operações bancárias, mas a expansão do acesso depende também de educação financeira e inclusão digital.” Qual é a tese: (A) todo atendimento presencial é inútil; (B) a tecnologia, sozinha, não assegura inclusão; (C) a digitalização deve ser abandonada; (D) a inclusão já foi alcançada; (E) educação substitui bancos? Resolução. A primeira oração reconhece uma vantagem. A conjunção adversativa “mas” introduz a ressalva: há outros requisitos. As demais alternativas extrapolam ou contradizem o texto. B."}, {"title": "Denotação, conotação, intertextualidade e figuras", "html": "<p>Denotação é o sentido literal, como “o cliente abriu a porta”.\nConotação é o sentido figurado, como “o crédito abriu portas”. A\nintertextualidade ocorre quando um texto dialoga com outro (citação\nexplícita, alusão, paráfrase, paródia); reconhecer a fonte permite\ncompreender o efeito de sentido.<\/p>\n<p>Metáfora é comparação implícita (“o tempo é dinheiro”); comparação\nexplicita semelhança (“rápido como um raio”); metonímia troca termos por\nproximidade (“leu Machado de Assis”); personificação atribui ação humana\na coisas; hipérbole exagera; eufemismo suaviza; ironia diz algo\nproduzindo sentido crítico diferente do literal; antítese contrapõe\nideias; paradoxo combina ideias aparentemente incompatíveis. Anáfora\nrepete expressão no início de segmentos.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Sentido figurado<\/strong><\/p>\n<p>Em “A inflação devora o poder de compra”, o verbo “devora” não\ndescreve ingestão literal. A inflação é representada como agente que\nconsome recursos. O efeito metafórico destaca a perda de poder\naquisitivo; também há personificação da abstração.<\/p>\n<\/div>\n", "id": "portugues-02", "number": 2, "examples": 1, "exercises": 0, "search": "Denotação é o sentido literal, como “o cliente abriu a porta”. Conotação é o sentido figurado, como “o crédito abriu portas”. A intertextualidade ocorre quando um texto dialoga com outro (citação explícita, alusão, paráfrase, paródia); reconhecer a fonte permite compreender o efeito de sentido. Metáfora é comparação implícita (“o tempo é dinheiro”); comparação explicita semelhança (“rápido como um raio”); metonímia troca termos por proximidade (“leu Machado de Assis”); personificação atribui ação humana a coisas; hipérbole exagera; eufemismo suaviza; ironia diz algo produzindo sentido crítico diferente do literal; antítese contrapõe ideias; paradoxo combina ideias aparentemente incompatíveis. Anáfora repete expressão no início de segmentos. Exemplo resolvido · Sentido figurado Em “A inflação devora o poder de compra”, o verbo “devora” não descreve ingestão literal. A inflação é representada como agente que consome recursos. O efeito metafórico destaca a perda de poder aquisitivo; também há personificação da abstração."}, {"title": "Discurso direto, indireto e indireto livre", "html": "<p>No direto, a fala é reproduzida com autonomia: O gerente disse:\n“Amanhã retornarei.” No indireto, ela é subordinada ao narrador: O\ngerente disse que retornaria no dia seguinte. Ajustam-se pessoa, tempo\nverbal, pronomes e referências espaciais ou temporais conforme o\ncontexto. No indireto livre, narrador e personagem se misturam sem verbo\nintrodutório explícito: “Chegou atrasado. Como explicaria aquilo?”.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Transposição<\/strong><\/p>\n<p>Transforme: A cliente afirmou: “Hoje preciso do comprovante”. Em\nrelato feito depois, temos: A cliente afirmou que naquele dia precisava\ndo comprovante. “Preciso” passa à terceira pessoa no imperfeito; “hoje”\npassa a “naquele dia”.<\/p>\n<\/div>\n", "id": "portugues-03", "number": 3, "examples": 1, "exercises": 0, "search": "No direto, a fala é reproduzida com autonomia: O gerente disse: “Amanhã retornarei.” No indireto, ela é subordinada ao narrador: O gerente disse que retornaria no dia seguinte. Ajustam-se pessoa, tempo verbal, pronomes e referências espaciais ou temporais conforme o contexto. No indireto livre, narrador e personagem se misturam sem verbo introdutório explícito: “Chegou atrasado. Como explicaria aquilo?”. Exemplo resolvido · Transposição Transforme: A cliente afirmou: “Hoje preciso do comprovante”. Em relato feito depois, temos: A cliente afirmou que naquele dia precisava do comprovante. “Preciso” passa à terceira pessoa no imperfeito; “hoje” passa a “naquele dia”."}, {"title": "Ortografia e acentuação", "html": "<p>A sílaba tônica define oxítona (última), paroxítona (penúltima) e\nproparoxítona (antepenúltima). Acentuam-se as oxítonas terminadas em\na(s), e(s), o(s), em, ens (café, também); paroxítonas com terminações\ncomo l, n, r, x, i(s), us, um/uns, ã(s), ão(s), ps e ditongos (fácil,\njúri, história); todas as proparoxítonas (público). Monossílabos tônicos\nterminados em a(s), e(s), o(s) são acentuados (pá, mês, nós). Hiatos com\ni/u tônicos isolados ou seguidos de s geralmente recebem acento (saída,\npaís), com exceções como antes de nh (rainha) ou, em paroxítonas, após\nditongo (feiura). Ditongos abertos em oxítonas recebem acento (herói),\nmas não em paroxítonas (ideia, assembleia). Permanecem pôde/pode e\npôr/por; ter e vir no plural têm acento diferencial (têm, vêm).<\/p>\n<p>Ortografia exige atenção a palavras usuais: exceção, concessão,\nascensão, análise, pesquisa, empecilho, privilégio. “Por que” em\npergunta ou equivalente a pelo qual; “porque” em resposta/explicação;\n“por quê” antes de pausa final; “porquê” é substantivo. Mal opõe-se a\nbem; mau a bom. Há indica passado ou existência; a indica distância ou\nfuturo. “Onde” expressa lugar; “aonde” combina com movimento regido por\na.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Acentuação e grafia<\/strong><\/p>\n<p>Qual a série correta: (A) idéia, heroi, público; (B) ideia, herói,\npúblico; (C) idéa, herói, publico? <strong>Resolução.<\/strong> Ideia é\nparoxítona com ditongo aberto sem acento; herói é oxítona com ditongo\naberto; público é proparoxítona. <strong>B.<\/strong><\/p>\n<\/div>\n", "id": "portugues-04", "number": 4, "examples": 1, "exercises": 0, "search": "A sílaba tônica define oxítona (última), paroxítona (penúltima) e proparoxítona (antepenúltima). Acentuam-se as oxítonas terminadas em a(s), e(s), o(s), em, ens (café, também); paroxítonas com terminações como l, n, r, x, i(s), us, um/uns, ã(s), ão(s), ps e ditongos (fácil, júri, história); todas as proparoxítonas (público). Monossílabos tônicos terminados em a(s), e(s), o(s) são acentuados (pá, mês, nós). Hiatos com i/u tônicos isolados ou seguidos de s geralmente recebem acento (saída, país), com exceções como antes de nh (rainha) ou, em paroxítonas, após ditongo (feiura). Ditongos abertos em oxítonas recebem acento (herói), mas não em paroxítonas (ideia, assembleia). Permanecem pôde/pode e pôr/por; ter e vir no plural têm acento diferencial (têm, vêm). Ortografia exige atenção a palavras usuais: exceção, concessão, ascensão, análise, pesquisa, empecilho, privilégio. “Por que” em pergunta ou equivalente a pelo qual; “porque” em resposta/explicação; “por quê” antes de pausa final; “porquê” é substantivo. Mal opõe-se a bem; mau a bom. Há indica passado ou existência; a indica distância ou futuro. “Onde” expressa lugar; “aonde” combina com movimento regido por a. Exemplo resolvido · Acentuação e grafia Qual a série correta: (A) idéia, heroi, público; (B) ideia, herói, público; (C) idéa, herói, publico? Resolução. Ideia é paroxítona com ditongo aberto sem acento; herói é oxítona com ditongo aberto; público é proparoxítona. B."}, {"title": "Classes de palavras e morfossintaxe", "html": "<p>Morfologia analisa a classe e estrutura da palavra; sintaxe analisa\nsua função na oração. Substantivo nomeia; adjetivo caracteriza; artigo\ndetermina; numeral quantifica/ordena; pronome substitui ou acompanha\nnomes; verbo expressa processo/estado; advérbio modifica verbo, adjetivo\nou advérbio; preposição estabelece relação; conjunção conecta\norações/termos; interjeição expressa reação. A classe depende do\ncontexto: “o amanhã” substantiva um advérbio.<\/p>\n<p>Sujeito é o termo de que se declara algo; predicado é o que se\ndeclara. Sujeito simples tem um núcleo; composto, mais de um; oculto é\nrecuperável; indeterminado não identificado. Há orações sem sujeito,\ncomo “Há vagas” e “Faz dois anos”. Verbos transitivos diretos exigem\nobjeto sem preposição obrigatória; indiretos exigem preposição;\nbitransitivos, ambos; intransitivos não exigem objeto. Predicativo\natribui estado ou característica; adjunto adnominal determina\nsubstantivo; complemento nominal completa nome/adjetivo/advérbio,\ngeralmente com preposição; adjunto adverbial indica circunstância.\nAposto explica ou especifica; vocativo chama o interlocutor.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Análise da oração<\/strong><\/p>\n<p>“Ontem, a gerente entregou os documentos ao cliente.” Sujeito: a\ngerente; núcleo: gerente. Verbo bitransitivo: entregou; objeto direto:\nos documentos; indireto: ao cliente; adjunto adverbial de tempo: ontem.\nO predicado é verbal.<\/p>\n<\/div>\n", "id": "portugues-05", "number": 5, "examples": 1, "exercises": 0, "search": "Morfologia analisa a classe e estrutura da palavra; sintaxe analisa sua função na oração. Substantivo nomeia; adjetivo caracteriza; artigo determina; numeral quantifica/ordena; pronome substitui ou acompanha nomes; verbo expressa processo/estado; advérbio modifica verbo, adjetivo ou advérbio; preposição estabelece relação; conjunção conecta orações/termos; interjeição expressa reação. A classe depende do contexto: “o amanhã” substantiva um advérbio. Sujeito é o termo de que se declara algo; predicado é o que se declara. Sujeito simples tem um núcleo; composto, mais de um; oculto é recuperável; indeterminado não identificado. Há orações sem sujeito, como “Há vagas” e “Faz dois anos”. Verbos transitivos diretos exigem objeto sem preposição obrigatória; indiretos exigem preposição; bitransitivos, ambos; intransitivos não exigem objeto. Predicativo atribui estado ou característica; adjunto adnominal determina substantivo; complemento nominal completa nome/adjetivo/advérbio, geralmente com preposição; adjunto adverbial indica circunstância. Aposto explica ou especifica; vocativo chama o interlocutor. Exemplo resolvido · Análise da oração “Ontem, a gerente entregou os documentos ao cliente.” Sujeito: a gerente; núcleo: gerente. Verbo bitransitivo: entregou; objeto direto: os documentos; indireto: ao cliente; adjunto adverbial de tempo: ontem. O predicado é verbal."}, {"title": "Formação de palavras, sinonímia e antonímia", "html": "<p>Radical concentra significado básico; prefixos e sufixos modificam\nsentido/classe; desinências marcam flexão. Em “reorganização”, re- é\nprefixo, organiz- radical, -ação sufixo. Derivação prefixal (infeliz),\nsufixal (felizmente), prefixal e sufixal (infelizmente), parassintética\n(envelhecer, com afixos simultâneos), regressiva (pesca de pescar) e\nimprópria (o jantar). Composição por justaposição mantém os elementos\n(guarda-chuva), aglutinação modifica a forma (planalto).<\/p>\n<p>Sinônimos têm sentidos próximos, não necessariamente idênticos em\ntodos os contextos; antônimos expressam oposição. Polissemia é\npluralidade de sentidos de uma palavra (banco); homônimos podem ter\nmesma pronúncia/grafia e sentidos distintos; parônimos são parecidos\n(descrição/discrição, ratificar/retificar).<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Estrutura e sentido<\/strong><\/p>\n<p>“O gerente retificou o cadastro”. Retificar significa corrigir, não\nconfirmar (ratificar). Trocar pelo parônimo altera o conteúdo da oração.\n“Releitura” exemplifica derivação prefixal de leitura.<\/p>\n<\/div>\n", "id": "portugues-06", "number": 6, "examples": 1, "exercises": 0, "search": "Radical concentra significado básico; prefixos e sufixos modificam sentido/classe; desinências marcam flexão. Em “reorganização”, re- é prefixo, organiz- radical, -ação sufixo. Derivação prefixal (infeliz), sufixal (felizmente), prefixal e sufixal (infelizmente), parassintética (envelhecer, com afixos simultâneos), regressiva (pesca de pescar) e imprópria (o jantar). Composição por justaposição mantém os elementos (guarda-chuva), aglutinação modifica a forma (planalto). Sinônimos têm sentidos próximos, não necessariamente idênticos em todos os contextos; antônimos expressam oposição. Polissemia é pluralidade de sentidos de uma palavra (banco); homônimos podem ter mesma pronúncia/grafia e sentidos distintos; parônimos são parecidos (descrição/discrição, ratificar/retificar). Exemplo resolvido · Estrutura e sentido “O gerente retificou o cadastro”. Retificar significa corrigir, não confirmar (ratificar). Trocar pelo parônimo altera o conteúdo da oração. “Releitura” exemplifica derivação prefixal de leitura."}, {"title": "Pronomes e colocação pronominal", "html": "<p>Pronomes pessoais retos (eu, tu, ele) normalmente são sujeitos;\noblíquos (me, te, o, a, lhe, se) exercem outras funções. O/a costuma\nsubstituir objeto direto e lhe objeto indireto: “entreguei-lhe o\ncontrato”; “li-o”. Pronomes relativos (que, quem, cujo, onde, o qual)\nretomam antecedente e ligam orações. Cujo indica posse, concorda com o\ntermo seguinte e não admite artigo imediatamente após ele.\nDemonstrativos organizam referência: este costuma anunciar algo ou\nindicar proximidade; esse retoma algo mencionado ou próximo do\ninterlocutor; aquele indica afastamento.<\/p>\n<p>Próclise ocorre com atratores como negação, relativo e conjunção\nsubordinativa (“não me avisaram”, “quando me avisaram”). Ênclise liga\npronome ao verbo (“avisaram-me”); mesóclise pode ocorrer no futuro sem\natrator (“avisar-me-ão”). Na norma formal, evite iniciar oração com\npronome oblíquo átono; a presença de atrator impede a ênclise em\ncontextos típicos.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Pronome relativo<\/strong><\/p>\n<p>Complete: “O contrato <u><\/u> cláusulas foram revisadas é válido.”\nResposta: “cujas”. As cláusulas pertencem ao contrato; o pronome\nconcorda com cláusulas, não com contrato. Não se escreve “cujas as\ncláusulas”.<\/p>\n<\/div>\n", "id": "portugues-07", "number": 7, "examples": 1, "exercises": 0, "search": "Pronomes pessoais retos (eu, tu, ele) normalmente são sujeitos; oblíquos (me, te, o, a, lhe, se) exercem outras funções. O/a costuma substituir objeto direto e lhe objeto indireto: “entreguei-lhe o contrato”; “li-o”. Pronomes relativos (que, quem, cujo, onde, o qual) retomam antecedente e ligam orações. Cujo indica posse, concorda com o termo seguinte e não admite artigo imediatamente após ele. Demonstrativos organizam referência: este costuma anunciar algo ou indicar proximidade; esse retoma algo mencionado ou próximo do interlocutor; aquele indica afastamento. Próclise ocorre com atratores como negação, relativo e conjunção subordinativa (“não me avisaram”, “quando me avisaram”). Ênclise liga pronome ao verbo (“avisaram-me”); mesóclise pode ocorrer no futuro sem atrator (“avisar-me-ão”). Na norma formal, evite iniciar oração com pronome oblíquo átono; a presença de atrator impede a ênclise em contextos típicos. Exemplo resolvido · Pronome relativo Complete: “O contrato cláusulas foram revisadas é válido.” Resposta: “cujas”. As cláusulas pertencem ao contrato; o pronome concorda com cláusulas, não com contrato. Não se escreve “cujas as cláusulas”."}, {"title": "Flexão nominal e verbal; tempos e modos", "html": "<p>Substantivos/adjetivos flexionam em gênero e número; grau pode ser\nexpresso por recursos sintéticos (altíssimo) ou analíticos (muito alto).\nEm verbos, pessoa e número identificam o sujeito, tempo localiza o\nprocesso e modo indica atitude. Indicativo expressa fatos apresentados\ncomo reais; subjuntivo, hipótese/desejo/possibilidade; imperativo, ordem\nou pedido. Pretérito perfeito indica evento concluído, imperfeito ação\nhabitual ou em curso no passado, mais-que-perfeito anterior a outro fato\npassado. Futuro do pretérito pode indicar hipótese, consequência ou\ncortesia.<\/p>\n<p>A correlação deve manter coerência: “Se o cliente pagasse, evitaria\njuros” (imperfeito do subjuntivo + futuro do pretérito); “Se pagar,\nevitará juros” (futuro do subjuntivo + futuro do presente). Não confunda\nfuturo do subjuntivo de ver (vir) com de vir (vier).<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Correlação verbal<\/strong><\/p>\n<p>Complete: “Se os documentos fossem entregues, o cadastro <u><\/u>\natualizado.” Resposta: “seria”. A condição hipotética no passado pede\nconsequência no futuro do pretérito. Em “Quando ele vir o extrato”, vir\né forma do verbo ver.<\/p>\n<\/div>\n", "id": "portugues-08", "number": 8, "examples": 1, "exercises": 0, "search": "Substantivos/adjetivos flexionam em gênero e número; grau pode ser expresso por recursos sintéticos (altíssimo) ou analíticos (muito alto). Em verbos, pessoa e número identificam o sujeito, tempo localiza o processo e modo indica atitude. Indicativo expressa fatos apresentados como reais; subjuntivo, hipótese/desejo/possibilidade; imperativo, ordem ou pedido. Pretérito perfeito indica evento concluído, imperfeito ação habitual ou em curso no passado, mais-que-perfeito anterior a outro fato passado. Futuro do pretérito pode indicar hipótese, consequência ou cortesia. A correlação deve manter coerência: “Se o cliente pagasse, evitaria juros” (imperfeito do subjuntivo + futuro do pretérito); “Se pagar, evitará juros” (futuro do subjuntivo + futuro do presente). Não confunda futuro do subjuntivo de ver (vir) com de vir (vier). Exemplo resolvido · Correlação verbal Complete: “Se os documentos fossem entregues, o cadastro atualizado.” Resposta: “seria”. A condição hipotética no passado pede consequência no futuro do pretérito. Em “Quando ele vir o extrato”, vir é forma do verbo ver."}, {"title": "Concordância nominal e verbal", "html": "<p>O verbo concorda em número e pessoa com o sujeito; o adjetivo\nconcorda em gênero e número com o nome. Sujeito composto anteposto\nnormalmente exige plural. “Faz dois anos”, “havia dez clientes” e “deve\nhaver vagas” permanecem no singular por impessoalidade. Em “vendem-se\nimóveis”, imóveis é sujeito paciente, exigindo plural; em “precisa-se de\nfuncionários”, o sujeito é indeterminado e o verbo fica singular. “Mais\nde um” geralmente pede singular, salvo reciprocidade/repetição em\ndeterminados contextos.<\/p>\n<p>Adjetivos como anexo, incluso e quite variam (“seguem anexas as\nfichas”); expressões adverbiais como em anexo não variam. “Meio”\nadjetivo varia (meia hora), advérbio não (meio cansadas). “Bastante”\nvaria quando quantifica nome (bastantes clientes), mas não quando\nintensifica adjetivo (bastante satisfeitos).<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Identifique a frase correta<\/strong><\/p>\n<p>(A) Houveram atrasos. (B) Fazem dois meses. (C) Devem haver vagas.\n(D) Vendem-se imóveis. (E) Segue anexo as fichas.\n<strong>Resolução.<\/strong> Haver existencial e fazer temporal são\nimpessoais; o auxiliar de haver também fica singular. Fichas exigiria\n“seguem anexas”. Em D, a passiva sintética concorda com imóveis.\n<strong>D.<\/strong><\/p>\n<\/div>\n", "id": "portugues-09", "number": 9, "examples": 1, "exercises": 0, "search": "O verbo concorda em número e pessoa com o sujeito; o adjetivo concorda em gênero e número com o nome. Sujeito composto anteposto normalmente exige plural. “Faz dois anos”, “havia dez clientes” e “deve haver vagas” permanecem no singular por impessoalidade. Em “vendem-se imóveis”, imóveis é sujeito paciente, exigindo plural; em “precisa-se de funcionários”, o sujeito é indeterminado e o verbo fica singular. “Mais de um” geralmente pede singular, salvo reciprocidade/repetição em determinados contextos. Adjetivos como anexo, incluso e quite variam (“seguem anexas as fichas”); expressões adverbiais como em anexo não variam. “Meio” adjetivo varia (meia hora), advérbio não (meio cansadas). “Bastante” varia quando quantifica nome (bastantes clientes), mas não quando intensifica adjetivo (bastante satisfeitos). Exemplo resolvido · Identifique a frase correta (A) Houveram atrasos. (B) Fazem dois meses. (C) Devem haver vagas. (D) Vendem-se imóveis. (E) Segue anexo as fichas. Resolução. Haver existencial e fazer temporal são impessoais; o auxiliar de haver também fica singular. Fichas exigiria “seguem anexas”. Em D, a passiva sintética concorda com imóveis. D."}, {"title": "Regência nominal, verbal e crase", "html": "<p>Regência é a relação entre termo regente e complemento. Assistir\n(ver) rege a: assistir ao filme; visar (ter por objetivo)\ntradicionalmente rege a: visar ao lucro; preferir X a Y; obedecer a;\naspirar a (desejar); informar alguém de algo ou informar algo a alguém.\nImplicar no sentido de acarretar é tradicionalmente direto: implica\ncustos. Regência nominal: favorável a, apto a/para, necessidade de,\nrespeito a/por, compatível com.<\/p>\n<p>Crase é fusão de a preposição com a artigo feminino ou a inicial de\naquele/aquela/aquilo. Teste masculino: “vou à agência” porque “vou ao\nbanco”. Ocorre em locuções femininas (à tarde, às pressas, à medida\nque), indicação de horas determinadas (às 14h) e diante de aquele quando\nhouver regência. Não ocorre antes de verbo, masculino comum, pronome\npessoal ou artigo indefinido. Pode ser facultativa antes de possessivo\nfeminino singular, nome próprio feminino que admita artigo e depois de\naté. Diferencie “a distância” genérica e “à distância de dez\nmetros”.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Crase em contexto<\/strong><\/p>\n<p>“O funcionário encaminhou a proposta <u><\/u> gerente, que se referiu\n<u><\/u> condições do contrato.” Complete. Encaminhar algo a alguém + a\ngerente = à gerente. Referir-se a + as condições = às condições.\n<strong>À; às.<\/strong><\/p>\n<\/div>\n", "id": "portugues-10", "number": 10, "examples": 1, "exercises": 0, "search": "Regência é a relação entre termo regente e complemento. Assistir (ver) rege a: assistir ao filme; visar (ter por objetivo) tradicionalmente rege a: visar ao lucro; preferir X a Y; obedecer a; aspirar a (desejar); informar alguém de algo ou informar algo a alguém. Implicar no sentido de acarretar é tradicionalmente direto: implica custos. Regência nominal: favorável a, apto a/para, necessidade de, respeito a/por, compatível com. Crase é fusão de a preposição com a artigo feminino ou a inicial de aquele/aquela/aquilo. Teste masculino: “vou à agência” porque “vou ao banco”. Ocorre em locuções femininas (à tarde, às pressas, à medida que), indicação de horas determinadas (às 14h) e diante de aquele quando houver regência. Não ocorre antes de verbo, masculino comum, pronome pessoal ou artigo indefinido. Pode ser facultativa antes de possessivo feminino singular, nome próprio feminino que admita artigo e depois de até. Diferencie “a distância” genérica e “à distância de dez metros”. Exemplo resolvido · Crase em contexto “O funcionário encaminhou a proposta gerente, que se referiu condições do contrato.” Complete. Encaminhar algo a alguém + a gerente = à gerente. Referir-se a + as condições = às condições. À; às."}, {"title": "Pontuação", "html": "<p>A vírgula separa itens, vocativo, aposto explicativo, adjunto\nadverbial deslocado (especialmente longo), orações coordenadas\nadversativas e subordinadas adverbiais antepostas. Não separe sujeito de\nverbo, verbo de complemento ou nome de complemento necessário. Oração\nadjetiva restritiva não leva vírgulas e delimita conjunto; explicativa é\nisolada e atribui informação adicional. Ponto e vírgula organiza\nsegmentos extensos ou itens; dois-pontos introduzem explicação,\nenumeração ou discurso; travessão pode intercalar ou marcar fala.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Mudança de sentido<\/strong><\/p>\n<p>“Os clientes que pagaram receberam desconto” limita o desconto a quem\npagou. “Os clientes, que pagaram, receberam desconto” apresenta o\npagamento como informação sobre todos os clientes considerados. As\nvírgulas alteram a extensão da referência, não são opcionais sem\nalteração de sentido.<\/p>\n<\/div>\n", "id": "portugues-11", "number": 11, "examples": 1, "exercises": 0, "search": "A vírgula separa itens, vocativo, aposto explicativo, adjunto adverbial deslocado (especialmente longo), orações coordenadas adversativas e subordinadas adverbiais antepostas. Não separe sujeito de verbo, verbo de complemento ou nome de complemento necessário. Oração adjetiva restritiva não leva vírgulas e delimita conjunto; explicativa é isolada e atribui informação adicional. Ponto e vírgula organiza segmentos extensos ou itens; dois-pontos introduzem explicação, enumeração ou discurso; travessão pode intercalar ou marcar fala. Exemplo resolvido · Mudança de sentido “Os clientes que pagaram receberam desconto” limita o desconto a quem pagou. “Os clientes, que pagaram, receberam desconto” apresenta o pagamento como informação sobre todos os clientes considerados. As vírgulas alteram a extensão da referência, não são opcionais sem alteração de sentido."}, {"title": "Vozes verbais", "html": "<p>Voz ativa: sujeito pratica ação (“O banco aprovou o crédito”).\nPassiva analítica: paciente vira sujeito e verbo ser + particípio (“O\ncrédito foi aprovado pelo banco”). Passiva sintética: verbo transitivo\ndireto + se apassivador (“Aprovou-se o crédito”). Reflexiva: agente e\npaciente coincidem (“Ele se feriu”); recíproca: ação mútua. Na\ntransformação, conserve tempo, sentido e concordância. Verbos apenas\ntransitivos indiretos não formam normalmente passiva.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Transformação<\/strong><\/p>\n<p>“Os analistas revisarão os contratos.” Objeto direto “os contratos”\ntorna-se sujeito paciente; futuro de ser = serão; particípio plural =\nrevisados. Resultado: “Os contratos serão revisados pelos\nanalistas.”<\/p>\n<\/div>\n", "id": "portugues-12", "number": 12, "examples": 1, "exercises": 0, "search": "Voz ativa: sujeito pratica ação (“O banco aprovou o crédito”). Passiva analítica: paciente vira sujeito e verbo ser + particípio (“O crédito foi aprovado pelo banco”). Passiva sintética: verbo transitivo direto + se apassivador (“Aprovou-se o crédito”). Reflexiva: agente e paciente coincidem (“Ele se feriu”); recíproca: ação mútua. Na transformação, conserve tempo, sentido e concordância. Verbos apenas transitivos indiretos não formam normalmente passiva. Exemplo resolvido · Transformação “Os analistas revisarão os contratos.” Objeto direto “os contratos” torna-se sujeito paciente; futuro de ser = serão; particípio plural = revisados. Resultado: “Os contratos serão revisados pelos analistas.”"}, {"title": "Coordenação, subordinação e conectivos", "html": "<p>Orações coordenadas são sintaticamente independentes entre si:\naditivas (e), adversativas (mas), alternativas (ou), conclusivas\n(portanto), explicativas (pois, porque). Subordinadas substantivas\nocupam função nominal (“É necessário que estude”), adjetivas\ncaracterizam nome, adverbiais indicam causa (porque), consequência\n(tanto que), condição (se), concessão (embora), finalidade (para que),\ntempo (quando), comparação (como), conformidade (conforme), proporção (à\nmedida que). O sentido depende do contexto: pois após verbo e isolado\npode ser conclusivo; antes de verbo, frequentemente explicativo.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Conectivo e equivalência<\/strong><\/p>\n<p>“Embora estivesse cansado, estudou.” Embora expressa concessão: o\ncansaço não impediu o estudo. Equivalente: “Apesar de estar cansado,\nestudou.” Não equivale a “porque estava cansado”, que expressa\ncausa.<\/p>\n<\/div>\n", "id": "portugues-13", "number": 13, "examples": 1, "exercises": 0, "search": "Orações coordenadas são sintaticamente independentes entre si: aditivas (e), adversativas (mas), alternativas (ou), conclusivas (portanto), explicativas (pois, porque). Subordinadas substantivas ocupam função nominal (“É necessário que estude”), adjetivas caracterizam nome, adverbiais indicam causa (porque), consequência (tanto que), condição (se), concessão (embora), finalidade (para que), tempo (quando), comparação (como), conformidade (conforme), proporção (à medida que). O sentido depende do contexto: pois após verbo e isolado pode ser conclusivo; antes de verbo, frequentemente explicativo. Exemplo resolvido · Conectivo e equivalência “Embora estivesse cansado, estudou.” Embora expressa concessão: o cansaço não impediu o estudo. Equivalente: “Apesar de estar cansado, estudou.” Não equivale a “porque estava cansado”, que expressa causa."}, {"title": "Redação, equivalência e reorganização", "html": "<p>Na reescrita, verifique simultaneamente correção gramatical e\npreservação de sentido. Transformar ativa em passiva,\ndesenvolver/reduzir oração ou trocar conectivo deve conservar\nreferentes, tempo, negação e relações lógicas. Coesão usa pronomes,\nelipse, repetição controlada e conectivos; coerência mantém\ncompatibilidade lógica. Paralelismo exige construções equivalentes em\nenumerações: “analisar contratos e conferir cadastros”, não “analisar\ncontratos e a conferência de cadastros” em uma série de infinitivos.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Reescrita<\/strong><\/p>\n<p>“O gerente explicou o produto para que o cliente decidisse com\nsegurança.” Uma reescrita equivalente é “O gerente explicou o produto a\nfim de que o cliente decidisse com segurança.” Ambas preservam\nfinalidade. Substituir por “porque o cliente decidira” criaria relação\ncausal e mudança de tempo.<\/p>\n<\/div>\n", "id": "portugues-14", "number": 14, "examples": 1, "exercises": 0, "search": "Na reescrita, verifique simultaneamente correção gramatical e preservação de sentido. Transformar ativa em passiva, desenvolver/reduzir oração ou trocar conectivo deve conservar referentes, tempo, negação e relações lógicas. Coesão usa pronomes, elipse, repetição controlada e conectivos; coerência mantém compatibilidade lógica. Paralelismo exige construções equivalentes em enumerações: “analisar contratos e conferir cadastros”, não “analisar contratos e a conferência de cadastros” em uma série de infinitivos. Exemplo resolvido · Reescrita “O gerente explicou o produto para que o cliente decidisse com segurança.” Uma reescrita equivalente é “O gerente explicou o produto a fim de que o cliente decidisse com segurança.” Ambas preservam finalidade. Substituir por “porque o cliente decidira” criaria relação causal e mudança de tempo."}, {"title": "Fixação comentada", "html": "<div class=\"exercise\">\n<p><strong>Questão 1.<\/strong> Em “É indispensável que os dados estejam\ncorretos”, qual a função da oração iniciada por que?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Subordinada substantiva subjetiva: equivale\na “isso é indispensável”.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 2.<\/strong> Corrija: “Os cliente receberam bastante\ninformações.”<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> “Os clientes receberam bastantes\ninformações.” Bastantes quantifica o substantivo.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 3.<\/strong> Em “Apesar do atraso, a operação foi\nconcluída”, qual a relação?<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Concessão; atraso é obstáculo insuficiente\npara impedir a conclusão.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 4.<\/strong> Complete: “Daqui …dois dias retornarei;\ntrabalho aqui …dois anos.”<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> a; há. Futuro versus tempo decorrido.<\/p><\/details>\n<\/div>\n<div class=\"exercise\">\n<p><strong>Questão 5.<\/strong> Corrija “O banco, enviou os\ncomprovantes”.<\/p>\n<details><summary>Ver resposta comentada<\/summary><p> Retire a vírgula: ela separa sujeito de\npredicado sem elemento intercalado.<\/p><\/details>\n<\/div>\n", "id": "portugues-15", "number": 15, "examples": 0, "exercises": 5, "search": "Questão 1. Em “É indispensável que os dados estejam corretos”, qual a função da oração iniciada por que? Ver resposta comentada Subordinada substantiva subjetiva: equivale a “isso é indispensável”. Questão 2. Corrija: “Os cliente receberam bastante informações.” Ver resposta comentada “Os clientes receberam bastantes informações.” Bastantes quantifica o substantivo. Questão 3. Em “Apesar do atraso, a operação foi concluída”, qual a relação? Ver resposta comentada Concessão; atraso é obstáculo insuficiente para impedir a conclusão. Questão 4. Complete: “Daqui …dois dias retornarei; trabalho aqui …dois anos.” Ver resposta comentada a; há. Futuro versus tempo decorrido. Questão 5. Corrija “O banco, enviou os comprovantes”. Ver resposta comentada Retire a vírgula: ela separa sujeito de predicado sem elemento intercalado."}], "id": "portugues", "short": "Português", "icon": "Aa", "questions": 10, "description": "Interpretação, gramática e reescrita de textos.", "group": "gerais"}, {"title": "Matemática, Raciocínio Lógico e Quantitativo", "intro": "", "sections": [{"title": "Proposições, conectivos e validade de argumentos", "html": "<p>Uma proposição é uma sentença declarativa à qual se pode atribuir\nverdadeiro (V) ou falso (F). Perguntas e ordens não são proposições. A\nnegação\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>¬<\/mo><mi>p<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\neg p<\/annotation><\/semantics><\/math>\ninverte o valor lógico. A conjunção\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>∧<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\land q<\/annotation><\/semantics><\/math>\nexige ambas verdadeiras; disjunção inclusiva\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>∨<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\lor q<\/annotation><\/semantics><\/math>\nexige pelo menos uma; condicional\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>→<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\to q<\/annotation><\/semantics><\/math>\nsó é falsa se\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p<\/mi><annotation encoding=\"application/x-tex\">p<\/annotation><\/semantics><\/math>\né verdadeira e\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>q<\/mi><annotation encoding=\"application/x-tex\">q<\/annotation><\/semantics><\/math>\nfalsa; bicondicional\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>↔<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\leftrightarrow q<\/annotation><\/semantics><\/math>\né verdadeira quando os valores são iguais.<\/p>\n<div class=\"center\">\n<div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: center;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p<\/mi><annotation encoding=\"application/x-tex\">p<\/annotation><\/semantics><\/math><\/th>\n<th style=\"text-align: center;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>q<\/mi><annotation encoding=\"application/x-tex\">q<\/annotation><\/semantics><\/math><\/th>\n<th style=\"text-align: center;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>∧<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\land q<\/annotation><\/semantics><\/math><\/th>\n<th style=\"text-align: center;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>∨<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\lor q<\/annotation><\/semantics><\/math><\/th>\n<th style=\"text-align: center;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>→<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\to q<\/annotation><\/semantics><\/math><\/th>\n<th style=\"text-align: center;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>↔<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\leftrightarrow q<\/annotation><\/semantics><\/math><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: center;\">V<\/td>\n<td style=\"text-align: center;\">V<\/td>\n<td style=\"text-align: center;\">V<\/td>\n<td style=\"text-align: center;\">V<\/td>\n<td style=\"text-align: center;\">V<\/td>\n<td style=\"text-align: center;\">V<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: center;\">V<\/td>\n<td style=\"text-align: center;\">F<\/td>\n<td style=\"text-align: center;\">F<\/td>\n<td style=\"text-align: center;\">V<\/td>\n<td style=\"text-align: center;\">F<\/td>\n<td style=\"text-align: center;\">F<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: center;\">F<\/td>\n<td style=\"text-align: center;\">V<\/td>\n<td style=\"text-align: center;\">F<\/td>\n<td style=\"text-align: center;\">V<\/td>\n<td style=\"text-align: center;\">V<\/td>\n<td style=\"text-align: center;\">F<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: center;\">F<\/td>\n<td style=\"text-align: center;\">F<\/td>\n<td style=\"text-align: center;\">F<\/td>\n<td style=\"text-align: center;\">F<\/td>\n<td style=\"text-align: center;\">V<\/td>\n<td style=\"text-align: center;\">V<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<p>Equivalências:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>→<\/mo><mi>q<\/mi><mo>≡<\/mo><mo>¬<\/mo><mi>p<\/mi><mo>∨<\/mo><mi>q<\/mi><mo>≡<\/mo><mo>¬<\/mo><mi>q<\/mi><mo>→<\/mo><mo>¬<\/mo><mi>p<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\to q\\equiv\\neg p\\lor q\\equiv\\neg q\\to\\neg p<\/annotation><\/semantics><\/math>.\nNegação da condicional:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>¬<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>p<\/mi><mo>→<\/mo><mi>q<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>≡<\/mo><mi>p<\/mi><mo>∧<\/mo><mo>¬<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\neg(p\\to q)\\equiv p\\land\\neg q<\/annotation><\/semantics><\/math>.\nLeis de De Morgan:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>¬<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>p<\/mi><mo>∧<\/mo><mi>q<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>≡<\/mo><mo>¬<\/mo><mi>p<\/mi><mo>∨<\/mo><mo>¬<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\neg(p\\land q)\\equiv\\neg p\\lor\\neg q<\/annotation><\/semantics><\/math>\ne\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>¬<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>p<\/mi><mo>∨<\/mo><mi>q<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>≡<\/mo><mo>¬<\/mo><mi>p<\/mi><mo>∧<\/mo><mo>¬<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\neg(p\\lor q)\\equiv\\neg p\\land\\neg q<\/annotation><\/semantics><\/math>.\nA negação de “todo A é B” é “existe A que não é B”. A negação de “algum\nA é B” é “nenhum A é B”.<\/p>\n<p>Argumento válido não permite premissas verdadeiras e conclusão falsa\nsimultaneamente. Modus ponens:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>→<\/mo><mi>q<\/mi><mo>,<\/mo><mi>p<\/mi><mo>⇒<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\to q,p\\Rightarrow q<\/annotation><\/semantics><\/math>.\nModus tollens:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>→<\/mo><mi>q<\/mi><mo>,<\/mo><mo>¬<\/mo><mi>q<\/mi><mo>⇒<\/mo><mo>¬<\/mo><mi>p<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\to q,\\neg q\\Rightarrow\\neg p<\/annotation><\/semantics><\/math>.\nAfirmar o consequente\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>q<\/mi><annotation encoding=\"application/x-tex\">q<\/annotation><\/semantics><\/math>,\nlogo\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p<\/mi><annotation encoding=\"application/x-tex\">p<\/annotation><\/semantics><\/math>)\né inválido. Negar o antecedente\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>¬<\/mo><mi>p<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\neg p<\/annotation><\/semantics><\/math>,\nlogo\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>¬<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\neg q<\/annotation><\/semantics><\/math>)\ntambém.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Negação e dedução<\/strong><\/p>\n<p>Se um cadastro está completo, então pode seguir à análise. O cadastro\nnão pode seguir à análise. O que se conclui logicamente?\n<strong>Resolução.<\/strong> Defina\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>=<\/mo><\/mrow><annotation encoding=\"application/x-tex\">p=<\/annotation><\/semantics><\/math>\ncompleto e\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q<\/mi><mo>=<\/mo><\/mrow><annotation encoding=\"application/x-tex\">q=<\/annotation><\/semantics><\/math>\npode seguir. Temos\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>→<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">p\\to q<\/annotation><\/semantics><\/math>\ne\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>¬<\/mo><mi>q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\neg q<\/annotation><\/semantics><\/math>.\nPor modus tollens,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>¬<\/mo><mi>p<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\neg p<\/annotation><\/semantics><\/math>.\nNegação da regra original: “o cadastro está completo e não pode seguir à\nanálise”.<\/p>\n<\/div>\n", "id": "logica-01", "number": 1, "examples": 1, "exercises": 0, "search": "Uma proposição é uma sentença declarativa à qual se pode atribuir verdadeiro (V) ou falso (F). Perguntas e ordens não são proposições. A negação ¬ p \\neg p inverte o valor lógico. A conjunção p ∧ q p\\land q exige ambas verdadeiras; disjunção inclusiva p ∨ q p\\lor q exige pelo menos uma; condicional p → q p\\to q só é falsa se p p é verdadeira e q q falsa; bicondicional p ↔ q p\\leftrightarrow q é verdadeira quando os valores são iguais. p p q q p ∧ q p\\land q p ∨ q p\\lor q p → q p\\to q p ↔ q p\\leftrightarrow q V V V V V V V F F V F F F V F V V F F F F F V V Equivalências: p → q ≡ ¬ p ∨ q ≡ ¬ q → ¬ p p\\to q\\equiv\\neg p\\lor q\\equiv\\neg q\\to\\neg p . Negação da condicional: ¬ ( p → q ) ≡ p ∧ ¬ q \\neg(p\\to q)\\equiv p\\land\\neg q . Leis de De Morgan: ¬ ( p ∧ q ) ≡ ¬ p ∨ ¬ q \\neg(p\\land q)\\equiv\\neg p\\lor\\neg q e ¬ ( p ∨ q ) ≡ ¬ p ∧ ¬ q \\neg(p\\lor q)\\equiv\\neg p\\land\\neg q . A negação de “todo A é B” é “existe A que não é B”. A negação de “algum A é B” é “nenhum A é B”. Argumento válido não permite premissas verdadeiras e conclusão falsa simultaneamente. Modus ponens: p → q , p ⇒ q p\\to q,p\\Rightarrow q . Modus tollens: p → q , ¬ q ⇒ ¬ p p\\to q,\\neg q\\Rightarrow\\neg p . Afirmar o consequente ( q q , logo p p ) é inválido. Negar o antecedente ( ¬ p \\neg p , logo ¬ q \\neg q ) também. Exemplo resolvido · Negação e dedução Se um cadastro está completo, então pode seguir à análise. O cadastro não pode seguir à análise. O que se conclui logicamente? Resolução. Defina p = p= completo e q = q= pode seguir. Temos p → q p\\to q e ¬ q \\neg q . Por modus tollens, ¬ p \\neg p . Negação da regra original: “o cadastro está completo e não pode seguir à análise”."}, {"title": "Relações arbitrárias, sequências e orientação", "html": "<p>Problemas de associação envolvem posições, horários, pessoas ou\nobjetos fictícios. Organize uma grade de possibilidades, marque\nincompatibilidades e use restrições absolutas antes das relativas.\nQuando uma afirmação diz “imediatamente antes”, as posições são\nconsecutivas; apenas “antes” não exige proximidade. Em sequências,\nexamine diferenças, razões, alternâncias, repetição, posição e relações\nentre termos. Na orientação, desenhe eixos: norte/sul são sentidos\nopostos, leste/oeste também. Em problemas temporais, converta unidades e\nuse restos quando eventos são periódicos.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Ordenação<\/strong><\/p>\n<p>Ana, Bruno e Carla atendem em três horários: 9h, 10h e 11h, um em\ncada. Ana atende antes de Bruno; Carla não atende às 9h; Bruno não\natende às 11h. <strong>Resolução.<\/strong> Bruno só pode estar às 10h\n(precisa haver horário anterior). Ana fica às 9h e Carla às 11h. Aplique\ntodas as restrições, não apenas a primeira.<\/p>\n<\/div>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Sequência e calendário<\/strong><\/p>\n<p>Qual o próximo termo de\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mo>,<\/mo><mn>7<\/mn><mo>,<\/mo><mn>15<\/mn><mo>,<\/mo><mn>31<\/mn><mo>,<\/mo><mi>…<\/mi><\/mrow><annotation encoding=\"application/x-tex\">3,7,15,31,\\ldots<\/annotation><\/semantics><\/math>?\nCada termo é o anterior multiplicado por dois mais um:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>31<\/mn><mo>×<\/mo><mn>2<\/mn><mo>+<\/mo><mn>1<\/mn><mo>=<\/mo><mn>63<\/mn><\/mrow><annotation encoding=\"application/x-tex\">31\\times2+1=63<\/annotation><\/semantics><\/math>.\nSe um evento se repete a cada 7 dias e hoje é terça-feira, 17 dias\ndepois será sexta-feira, pois\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>17<\/mn><mo>=<\/mo><mn>2<\/mn><mo>×<\/mo><mn>7<\/mn><mo>+<\/mo><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">17=2\\times7+3<\/annotation><\/semantics><\/math>.<\/p>\n<\/div>\n", "id": "logica-02", "number": 2, "examples": 2, "exercises": 0, "search": "Problemas de associação envolvem posições, horários, pessoas ou objetos fictícios. Organize uma grade de possibilidades, marque incompatibilidades e use restrições absolutas antes das relativas. Quando uma afirmação diz “imediatamente antes”, as posições são consecutivas; apenas “antes” não exige proximidade. Em sequências, examine diferenças, razões, alternâncias, repetição, posição e relações entre termos. Na orientação, desenhe eixos: norte/sul são sentidos opostos, leste/oeste também. Em problemas temporais, converta unidades e use restos quando eventos são periódicos. Exemplo resolvido · Ordenação Ana, Bruno e Carla atendem em três horários: 9h, 10h e 11h, um em cada. Ana atende antes de Bruno; Carla não atende às 9h; Bruno não atende às 11h. Resolução. Bruno só pode estar às 10h (precisa haver horário anterior). Ana fica às 9h e Carla às 11h. Aplique todas as restrições, não apenas a primeira. Exemplo resolvido · Sequência e calendário Qual o próximo termo de 3 , 7 , 15 , 31 , … 3,7,15,31,\\ldots ? Cada termo é o anterior multiplicado por dois mais um: 31 × 2 + 1 = 63 31\\times2+1=63 . Se um evento se repete a cada 7 dias e hoje é terça-feira, 17 dias depois será sexta-feira, pois 17 = 2 × 7 + 3 17=2\\times7+3 ."}, {"title": "Números, operações, múltiplos e divisores", "html": "<p>Inteiros incluem negativos, zero e positivos; racionais são razões\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mi>/<\/mi><mi>b<\/mi><\/mrow><annotation encoding=\"application/x-tex\">a/b<\/annotation><\/semantics><\/math>\nde inteiros com\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b<\/mi><mo>≠<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">b\\ne0<\/annotation><\/semantics><\/math>.\nNa ordem de operações, resolva parênteses, potências,\nmultiplicações/divisões e depois somas/subtrações. Produto de dois\nnúmeros negativos é positivo. Para potências de mesma base:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mi>m<\/mi><\/msup><msup><mi>a<\/mi><mi>n<\/mi><\/msup><mo>=<\/mo><msup><mi>a<\/mi><mrow><mi>m<\/mi><mo>+<\/mo><mi>n<\/mi><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">a^m a^n=a^{m+n}<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><msup><mi>a<\/mi><mi>m<\/mi><\/msup><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>n<\/mi><\/msup><mo>=<\/mo><msup><mi>a<\/mi><mrow><mi>m<\/mi><mi>n<\/mi><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">(a^m)^n=a^{mn}<\/annotation><\/semantics><\/math>\ne\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mrow><mi>−<\/mi><mi>n<\/mi><\/mrow><\/msup><mo>=<\/mo><mn>1<\/mn><mi>/<\/mi><msup><mi>a<\/mi><mi>n<\/mi><\/msup><\/mrow><annotation encoding=\"application/x-tex\">a^{-n}=1/a^n<\/annotation><\/semantics><\/math>\npara\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>≠<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">a\\ne0<\/annotation><\/semantics><\/math>.\nAtenção:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>−<\/mi><msup><mn>2<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><mi>−<\/mi><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">-2^2=-4<\/annotation><\/semantics><\/math>,\nmas\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>−<\/mi><mn>2<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>=<\/mo><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">(-2)^2=4<\/annotation><\/semantics><\/math>.<\/p>\n<p>Múltiplo é resultado de multiplicar por inteiro; divisor divide sem\nresto. Critérios: por 2, último algarismo par; por 3, soma dos\nalgarismos múltipla de 3; por 5, final 0 ou 5; por 9, soma múltipla de\n9. Fatoração em primos permite calcular MDC (fatores comuns com menor\nexpoente) e MMC (todos os fatores com maior expoente).<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>MMC e MDC<\/strong><\/p>\n<p>Dois sistemas executam rotinas a cada 12 e 18 minutos. Se iniciam\njuntos, quando coincidem novamente?\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mo>=<\/mo><msup><mn>2<\/mn><mn>2<\/mn><\/msup><mo>⋅<\/mo><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">12=2^2\\cdot3<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>18<\/mn><mo>=<\/mo><mn>2<\/mn><mo>⋅<\/mo><msup><mn>3<\/mn><mn>2<\/mn><\/msup><\/mrow><annotation encoding=\"application/x-tex\">18=2\\cdot3^2<\/annotation><\/semantics><\/math>.\nMMC\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><msup><mn>2<\/mn><mn>2<\/mn><\/msup><mo>⋅<\/mo><msup><mn>3<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><mn>36<\/mn><\/mrow><annotation encoding=\"application/x-tex\">=2^2\\cdot3^2=36<\/annotation><\/semantics><\/math>\nminutos. O MDC é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>⋅<\/mo><mn>3<\/mn><mo>=<\/mo><mn>6<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2\\cdot3=6<\/annotation><\/semantics><\/math>,\nútil para repartir quantidades em grupos iguais de tamanho máximo.<\/p>\n<\/div>\n", "id": "logica-03", "number": 3, "examples": 1, "exercises": 0, "search": "Inteiros incluem negativos, zero e positivos; racionais são razões a / b a/b de inteiros com b ≠ 0 b\\ne0 . Na ordem de operações, resolva parênteses, potências, multiplicações/divisões e depois somas/subtrações. Produto de dois números negativos é positivo. Para potências de mesma base: a m a n = a m + n a^m a^n=a^{m+n} , ( a m ) n = a m n (a^m)^n=a^{mn} e a − n = 1 / a n a^{-n}=1/a^n para a ≠ 0 a\\ne0 . Atenção: − 2 2 = − 4 -2^2=-4 , mas ( − 2 ) 2 = 4 (-2)^2=4 . Múltiplo é resultado de multiplicar por inteiro; divisor divide sem resto. Critérios: por 2, último algarismo par; por 3, soma dos algarismos múltipla de 3; por 5, final 0 ou 5; por 9, soma múltipla de 9. Fatoração em primos permite calcular MDC (fatores comuns com menor expoente) e MMC (todos os fatores com maior expoente). Exemplo resolvido · MMC e MDC Dois sistemas executam rotinas a cada 12 e 18 minutos. Se iniciam juntos, quando coincidem novamente? 12 = 2 2 ⋅ 3 12=2^2\\cdot3 , 18 = 2 ⋅ 3 2 18=2\\cdot3^2 . MMC = 2 2 ⋅ 3 2 = 36 =2^2\\cdot3^2=36 minutos. O MDC é 2 ⋅ 3 = 6 2\\cdot3=6 , útil para repartir quantidades em grupos iguais de tamanho máximo."}, {"title": "Frações, decimais e expressões", "html": "<p>Para somar frações, use denominador comum; para multiplicar,\nmultiplique numeradores e denominadores; para dividir, multiplique pelo\ninverso da segunda fração. Simplifique pelo MDC. Conversão:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>,<\/mo><mn>125<\/mn><mo>=<\/mo><mn>125<\/mn><mi>/<\/mi><mn>1000<\/mn><mo>=<\/mo><mn>1<\/mn><mi>/<\/mi><mn>8<\/mn><mo>=<\/mo><mn>12<\/mn><mo>,<\/mo><mn>5<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">0{,}125=125/1000=1/8=12{,}5\\%<\/annotation><\/semantics><\/math>.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Operações com frações<\/strong><\/p>\n<p>Calcule\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><mo>−<\/mo><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>÷<\/mo><mfrac><mn>7<\/mn><mn>12<\/mn><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">\\left(\\frac34-\\frac16\\right)\\div\\frac7{12}<\/annotation><\/semantics><\/math>.\n<strong>Resolução.<\/strong> O MMC de 4 e 6 é 12. Logo\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>/<\/mi><mn>4<\/mn><mo>−<\/mo><mn>1<\/mn><mi>/<\/mi><mn>6<\/mn><mo>=<\/mo><mn>9<\/mn><mi>/<\/mi><mn>12<\/mn><mo>−<\/mo><mn>2<\/mn><mi>/<\/mi><mn>12<\/mn><mo>=<\/mo><mn>7<\/mn><mi>/<\/mi><mn>12<\/mn><\/mrow><annotation encoding=\"application/x-tex\">3/4-1/6=9/12-2/12=7/12<\/annotation><\/semantics><\/math>.\nDividir pelo mesmo valor não nulo resulta em 1.<\/p>\n<\/div>\n", "id": "logica-04", "number": 4, "examples": 1, "exercises": 0, "search": "Para somar frações, use denominador comum; para multiplicar, multiplique numeradores e denominadores; para dividir, multiplique pelo inverso da segunda fração. Simplifique pelo MDC. Conversão: 0 , 125 = 125 / 1000 = 1 / 8 = 12 , 5 % 0{,}125=125/1000=1/8=12{,}5\\% . Exemplo resolvido · Operações com frações Calcule ( 3 4 − 1 6 ) ÷ 7 12 \\left(\\frac34-\\frac16\\right)\\div\\frac7{12} . Resolução. O MMC de 4 e 6 é 12. Logo 3 / 4 − 1 / 6 = 9 / 12 − 2 / 12 = 7 / 12 3/4-1/6=9/12-2/12=7/12 . Dividir pelo mesmo valor não nulo resulta em 1."}, {"title": "Razão, proporção e regra de três", "html": "<p>Razão compara grandezas; proporção iguala razões:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mi>/<\/mi><mi>b<\/mi><mo>=<\/mo><mi>c<\/mi><mi>/<\/mi><mi>d<\/mi><mo>⇒<\/mo><mi>a<\/mi><mi>d<\/mi><mo>=<\/mo><mi>b<\/mi><mi>c<\/mi><\/mrow><annotation encoding=\"application/x-tex\">a/b=c/d\\Rightarrow ad=bc<\/annotation><\/semantics><\/math>.\nGrandezas diretamente proporcionais crescem pelo mesmo fator;\ninversamente proporcionais mantêm produto constante. Para dividir\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>T<\/mi><annotation encoding=\"application/x-tex\">T<\/annotation><\/semantics><\/math>\nem partes proporcionais a\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>,<\/mo><mi>b<\/mi><mo>,<\/mo><mi>c<\/mi><\/mrow><annotation encoding=\"application/x-tex\">a,b,c<\/annotation><\/semantics><\/math>,\nmultiplique\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>T<\/mi><annotation encoding=\"application/x-tex\">T<\/annotation><\/semantics><\/math>\npor cada peso dividido pela soma dos pesos. Use unidades homogêneas.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Produtividade e divisão proporcional<\/strong><\/p>\n<p>Quatro atendentes fazem 120 atendimentos em 6 horas, com\nprodutividade igual. Quantos fazem seis atendentes em 4 horas? A taxa é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>120<\/mn><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>4<\/mn><mo>×<\/mo><mn>6<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">120/(4\\times6)=5<\/annotation><\/semantics><\/math>\natendimentos por pessoa-hora. Então\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6<\/mn><mo>×<\/mo><mn>4<\/mn><mo>×<\/mo><mn>5<\/mn><mo>=<\/mo><mn>120<\/mn><\/mrow><annotation encoding=\"application/x-tex\">6\\times4\\times5=120<\/annotation><\/semantics><\/math>.\nPara dividir R$ 900 na razão 2:3:4, use\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>900<\/mn><mi>/<\/mi><mn>9<\/mn><mo>=<\/mo><mn>100<\/mn><\/mrow><annotation encoding=\"application/x-tex\">900/9=100<\/annotation><\/semantics><\/math>\npor parte: 200, 300 e 400 reais.<\/p>\n<\/div>\n", "id": "logica-05", "number": 5, "examples": 1, "exercises": 0, "search": "Razão compara grandezas; proporção iguala razões: a / b = c / d ⇒ a d = b c a/b=c/d\\Rightarrow ad=bc . Grandezas diretamente proporcionais crescem pelo mesmo fator; inversamente proporcionais mantêm produto constante. Para dividir T T em partes proporcionais a a , b , c a,b,c , multiplique T T por cada peso dividido pela soma dos pesos. Use unidades homogêneas. Exemplo resolvido · Produtividade e divisão proporcional Quatro atendentes fazem 120 atendimentos em 6 horas, com produtividade igual. Quantos fazem seis atendentes em 4 horas? A taxa é 120 / ( 4 × 6 ) = 5 120/(4\\times6)=5 atendimentos por pessoa-hora. Então 6 × 4 × 5 = 120 6\\times4\\times5=120 . Para dividir R$ 900 na razão 2:3:4, use 900 / 9 = 100 900/9=100 por parte: 200, 300 e 400 reais."}, {"title": "Porcentagem, acréscimos e descontos", "html": "<p>Porcentagem é uma fração com base 100. Se a taxa decimal é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>i<\/mi><annotation encoding=\"application/x-tex\">i<\/annotation><\/semantics><\/math>,\nacréscimo produz\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V<\/mi><mi>f<\/mi><\/msub><mo>=<\/mo><msub><mi>V<\/mi><mn>0<\/mn><\/msub><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">V_f=V_0(1+i)<\/annotation><\/semantics><\/math>\ne desconto\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V<\/mi><mi>f<\/mi><\/msub><mo>=<\/mo><msub><mi>V<\/mi><mn>0<\/mn><\/msub><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mi>i<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">V_f=V_0(1-i)<\/annotation><\/semantics><\/math>.\nVariação percentual é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><msub><mi>V<\/mi><mi>f<\/mi><\/msub><mo>−<\/mo><msub><mi>V<\/mi><mn>0<\/mn><\/msub><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><msub><mi>V<\/mi><mn>0<\/mn><\/msub><mo>×<\/mo><mn>100<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">(V_f-V_0)/V_0\\times100\\%<\/annotation><\/semantics><\/math>.\nPercentuais sucessivos multiplicam fatores. Ponto percentual mede\ndiferença entre taxas: de 10% a 15% são 5 pontos percentuais ou aumento\nrelativo de 50%.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Descontos sucessivos e recuperação<\/strong><\/p>\n<p>Um serviço de R$ 500 aumenta 20% e depois sofre desconto de 20%.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>500<\/mn><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>1<\/mn><mo>,<\/mo><mn>2<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>8<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn>480<\/mn><\/mrow><annotation encoding=\"application/x-tex\">500(1{,}2)(0{,}8)=480<\/annotation><\/semantics><\/math>.\nA redução total foi de 4%, não zero. Para voltar de 480 a 500 é preciso\naumentar\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mi>/<\/mi><mn>480<\/mn><mo>=<\/mo><mn>4<\/mn><mo>,<\/mo><mn>1667<\/mn><mi>%<\/mi><\/mrow><annotation encoding=\"application/x-tex\">20/480=4{,}1667\\%<\/annotation><\/semantics><\/math>.<\/p>\n<\/div>\n", "id": "logica-06", "number": 6, "examples": 1, "exercises": 0, "search": "Porcentagem é uma fração com base 100. Se a taxa decimal é i i , acréscimo produz V f = V 0 ( 1 + i ) V_f=V_0(1+i) e desconto V f = V 0 ( 1 − i ) V_f=V_0(1-i) . Variação percentual é ( V f − V 0 ) / V 0 × 100 % (V_f-V_0)/V_0\\times100\\% . Percentuais sucessivos multiplicam fatores. Ponto percentual mede diferença entre taxas: de 10% a 15% são 5 pontos percentuais ou aumento relativo de 50%. Exemplo resolvido · Descontos sucessivos e recuperação Um serviço de R$ 500 aumenta 20% e depois sofre desconto de 20%. 500 ( 1 , 2 ) ( 0 , 8 ) = 480 500(1{,}2)(0{,}8)=480 . A redução total foi de 4%, não zero. Para voltar de 480 a 500 é preciso aumentar 20 / 480 = 4 , 1667 % 20/480=4{,}1667\\% ."}, {"title": "Estatística descritiva e gráficos", "html": "<p>Para dados\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>,<\/mo><mi>…<\/mi><mo>,<\/mo><msub><mi>x<\/mi><mi>n<\/mi><\/msub><\/mrow><annotation encoding=\"application/x-tex\">x_1,\\ldots,x_n<\/annotation><\/semantics><\/math>,\na média simples é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mo>=<\/mo><mo>∑<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mi>/<\/mi><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\bar x=\\sum x_i/n<\/annotation><\/semantics><\/math>.\nMédia ponderada é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mi>p<\/mi><\/msub><mo>=<\/mo><mo>∑<\/mo><msub><mi>w<\/mi><mi>i<\/mi><\/msub><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mi>/<\/mi><mo>∑<\/mo><msub><mi>w<\/mi><mi>i<\/mi><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\bar x_p=\\sum w_ix_i/\\sum w_i<\/annotation><\/semantics><\/math>.\nMediana é o centro da série ordenada (média dos dois centrais se\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><annotation encoding=\"application/x-tex\">n<\/annotation><\/semantics><\/math>\npar); moda é o valor mais frequente. Amplitude é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x<\/mi><mo>max<\/mo><\/msub><mo>−<\/mo><msub><mi>x<\/mi><mo>min<\/mo><\/msub><\/mrow><annotation encoding=\"application/x-tex\">x_{\\max}-x_{\\min}<\/annotation><\/semantics><\/math>.\nDesvio médio absoluto é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>∑<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">|<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mo>−<\/mo><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mo form=\"postfix\" stretchy=\"true\">|<\/mo><\/mrow><mi>/<\/mi><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\sum|x_i-\\bar x|/n<\/annotation><\/semantics><\/math>.\nVariância populacional é\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>∑<\/mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mo>−<\/mo><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mi>/<\/mi><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\sum (x_i-\\bar x)^2/n<\/annotation><\/semantics><\/math>;\namostral usa\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">n-1<\/annotation><\/semantics><\/math>.\nDesvio padrão é a raiz da variância.<\/p>\n<p>Gráficos de barras comparam categorias; histogramas representam\nclasses numéricas contíguas e, quando as amplitudes diferem, a área\nrepresenta frequência; setores expressam proporções\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mn>360<\/mn><mo>∘<\/mo><\/msup><annotation encoding=\"application/x-tex\">360^\\circ<\/annotation><\/semantics><\/math>\nno total); linhas mostram evolução. Leia títulos, unidades, escala,\nfonte, período e base antes de calcular.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Média e dispersão<\/strong><\/p>\n<p>Para tempos de atendimento\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>,<\/mo><mn>4<\/mn><mo>,<\/mo><mn>4<\/mn><mo>,<\/mo><mn>6<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2,4,4,6<\/annotation><\/semantics><\/math>\nminutos, a média é 4, a mediana 4, a moda 4 e a amplitude\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6<\/mn><mo>−<\/mo><mn>2<\/mn><mo>=<\/mo><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">6-2=4<\/annotation><\/semantics><\/math>.\nDesvio médio\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>2<\/mn><mo>+<\/mo><mn>0<\/mn><mo>+<\/mo><mn>0<\/mn><mo>+<\/mo><mn>2<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mn>4<\/mn><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">=(2+0+0+2)/4=1<\/annotation><\/semantics><\/math>.\nVariância populacional\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mn>4<\/mn><mo>+<\/mo><mn>0<\/mn><mo>+<\/mo><mn>0<\/mn><mo>+<\/mo><mn>4<\/mn><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>/<\/mi><mn>4<\/mn><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">=(4+0+0+4)/4=2<\/annotation><\/semantics><\/math>\nmin<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi><\/mi><mn>2<\/mn><\/msup><annotation encoding=\"application/x-tex\">^2<\/annotation><\/semantics><\/math>;\ndesvio padrão\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>2<\/mn><\/msqrt><mo>≈<\/mo><mn>1<\/mn><mo>,<\/mo><mn>41<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sqrt2\\approx1{,}41<\/annotation><\/semantics><\/math>\nmin. Se 25% dos atendimentos forem digitais, o setor correspondente mede\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mn>90<\/mn><mo>∘<\/mo><\/msup><annotation encoding=\"application/x-tex\">90^\\circ<\/annotation><\/semantics><\/math>.<\/p>\n<\/div>\n", "id": "logica-07", "number": 7, "examples": 1, "exercises": 0, "search": "Para dados x 1 , … , x n x_1,\\ldots,x_n , a média simples é x ‾ = ∑ x i / n \\bar x=\\sum x_i/n . Média ponderada é x ‾ p = ∑ w i x i / ∑ w i \\bar x_p=\\sum w_ix_i/\\sum w_i . Mediana é o centro da série ordenada (média dos dois centrais se n n par); moda é o valor mais frequente. Amplitude é x max − x min x_{\\max}-x_{\\min} . Desvio médio absoluto é ∑ | x i − x ‾ | / n \\sum|x_i-\\bar x|/n . Variância populacional é ∑ ( x i − x ‾ ) 2 / n \\sum (x_i-\\bar x)^2/n ; amostral usa n − 1 n-1 . Desvio padrão é a raiz da variância. Gráficos de barras comparam categorias; histogramas representam classes numéricas contíguas e, quando as amplitudes diferem, a área representa frequência; setores expressam proporções ( 360 ∘ 360^\\circ no total); linhas mostram evolução. Leia títulos, unidades, escala, fonte, período e base antes de calcular. Exemplo resolvido · Média e dispersão Para tempos de atendimento 2 , 4 , 4 , 6 2,4,4,6 minutos, a média é 4, a mediana 4, a moda 4 e a amplitude 6 − 2 = 4 6-2=4 . Desvio médio = ( 2 + 0 + 0 + 2 ) / 4 = 1 =(2+0+0+2)/4=1 . Variância populacional = ( 4 + 0 + 0 + 4 ) / 4 = 2 =(4+0+0+4)/4=2 min 2 ^2 ; desvio padrão 2 ≈ 1 , 41 \\sqrt2\\approx1{,}41 min. Se 25% dos atendimentos forem digitais, o setor correspondente mede 90 ∘ 90^\\circ ."}, {"title": "Princípios de contagem, permutação e combinação", "html": "<p>Princípio aditivo: alternativas mutuamente exclusivas são somadas.\nMultiplicativo: etapas sucessivas são multiplicadas. Permutação de\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><annotation encoding=\"application/x-tex\">n<\/annotation><\/semantics><\/math>\nelementos distintos:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mi>n<\/mi><mi>!<\/mi><\/mrow><annotation encoding=\"application/x-tex\">P_n=n!<\/annotation><\/semantics><\/math>.\nCom repetição de elementos:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mi>!<\/mi><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>a<\/mi><mi>!<\/mi><mi>b<\/mi><mi>!<\/mi><mi>⋯<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">n!/(a!b!\\cdots)<\/annotation><\/semantics><\/math>.\nArranjo: escolha ordenada de\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>k<\/mi><annotation encoding=\"application/x-tex\">k<\/annotation><\/semantics><\/math>\nentre\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><annotation encoding=\"application/x-tex\">n<\/annotation><\/semantics><\/math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>A<\/mi><mrow><mi>n<\/mi><mo>,<\/mo><mi>k<\/mi><\/mrow><\/msub><mo>=<\/mo><mi>n<\/mi><mi>!<\/mi><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mi>k<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>!<\/mi><\/mrow><annotation encoding=\"application/x-tex\">A_{n,k}=n!/(n-k)!<\/annotation><\/semantics><\/math>.\nCombinação: escolha sem ordem,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C<\/mi><mrow><mi>n<\/mi><mo>,<\/mo><mi>k<\/mi><\/mrow><\/msub><mo>=<\/mo><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac linethickness=\"0\"><mi>n<\/mi><mi>k<\/mi><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mi>n<\/mi><mi>!<\/mi><mi>/<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">[<\/mo><mi>k<\/mi><mi>!<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mi>k<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mi>!<\/mi><mo form=\"postfix\" stretchy=\"true\">]<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">C_{n,k}=\\binom nk=n!/[k!(n-k)!]<\/annotation><\/semantics><\/math>.\nSe houver reposição e\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><annotation encoding=\"application/x-tex\">n<\/annotation><\/semantics><\/math>\nopções em cada etapa,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>n<\/mi><mi>k<\/mi><\/msup><annotation encoding=\"application/x-tex\">n^k<\/annotation><\/semantics><\/math>.<\/p>\n<div class=\"example\">\n<p class=\"example-title\">Exemplo resolvido · <strong>Escolha com e sem ordem<\/strong><\/p>\n<p>De 8 empregados, escolha 3 para uma comissão sem cargos.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac linethickness=\"0\"><mn>8<\/mn><mn>3<\/mn><\/mfrac><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>
